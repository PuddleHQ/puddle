# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-app"
description = "The desktop shell: a Tauri 2 window around the SPA that puddle-api serves, with the Puddle host in-process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# Adds the in-memory fixture backend (the real API on in-memory services with one seeded pending
# request), for developing the window and for the smoke test; a debug build shows it when
# `PUDDLE_APP_FIXTURE=1` is set. Without the feature the shell always runs the host.
fixture = []

[lib]
name = "puddle_app"
path = "src/lib.rs"

[[bin]]
name = "puddle-app"
path = "src/main.rs"

[dependencies]
# `embedded-ui`: the SPA is part of the binary (build `ui/` first, `scripts/check.sh ui`).
puddle-api = { workspace = true, features = ["embedded-ui"] }
puddle-compute = { workspace = true }
puddle-host = { workspace = true, features = ["embedded-ui"] }
puddle-lifecycle = { workspace = true }
puddle-fs = { workspace = true }
puddle-settings = { workspace = true }
puddle-store = { workspace = true }
puddle-types = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through the notification plugin: asks the session bus whether a tray host exists.
zbus = "5"

[build-dependencies]
tauri-build = { workspace = true }

[dev-dependencies]
puddle-certs = { workspace = true }
puddle-compute = { workspace = true, features = ["fake"] }
puddle-runtime = { workspace = true }
puddle-secrets = { workspace = true }
puddle-upstream = { workspace = true, features = ["testing"] }
tauri = { workspace = true, features = ["test"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

[lints]
workspace = true
