# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-mutants settings (docs/STANDARDS.md, "Mutation testing"; run through scripts/mutants.sh).
#
# A surviving mutant is fixed with a better test, never by excluding the code. The one allowed
# exclusion is a mutant no test can tell from the original (it changes timing or a log line, or the
# result stays equal for every input). Each goes in `exclude_re` below with a comment that says why
# it is equivalent; a reviewer reads that line like a lint suppression.
#
# The tests run through nextest's `mutants` profile (.config/nextest.toml): the default profile's
# tests, which leave out the VM tests, so a mutant is judged by the tests a pull request runs without
# a VM, but with few threads and a heap limit per test process (a mutant can loop and allocate).
test_tool = "nextest"

# Test support that is compiled outside `cfg(test)` (feature-gated helpers) is no product code.
exclude_globs = [
    "**/testing.rs",
    "**/testing/**",
    "**/tests/**",
    "**/benches/**",
    # Windows-only code of `puddle-fs` (`#[cfg(windows)]` modules): a Linux run never compiles it, so
    # every change to it would pass. The Windows test job covers it; the mutation run does not.
    "crates/puddle-fs/src/private/windows.rs",
    "crates/puddle-fs/src/win/**",
    # Windows-only code of `puddle-certs` (`CryptoAPI` store reader, `#[cfg(windows)]` modules): a Linux
    # run never compiles it, so every change to it would pass. Its tests (`tests/windows_store.rs`) run
    # in the Windows test job; the mutation run does not cover them.
    "crates/puddle-certs/src/platform/windows.rs",
    "crates/puddle-certs/src/platform/windows_trust.rs",
]

# Equivalent mutants, each with its reason:
exclude_re = [
    # The filtered SSH agent's `log` only writes log lines (one per answered request); the answer the
    # guest gets is written by `serve` whatever `log` does.
    'ssh_agent\.rs:\d+:\d+: replace log with \(\)',
    # `KeyringStore::keep_local` is `Ok(())` outside Windows: its rewrite is `#[cfg(windows)]`, so a
    # Linux mutation run never compiles the match guard (`is_kept_local`, which holds the testable
    # part, is tested) and replacing the body or the guard changes nothing it can run. The trait's
    # default `keep_local` body is `Ok(())` too, so replacing it with `Ok(())` is the same code.
    'keyring_store\.rs:\d+:\d+: replace <impl SecretStore for KeyringStore>::keep_local -> Result<\(\), StoreError> with Ok\(\(\)\)',
    'keyring_store\.rs:\d+:\d+: replace match guard is_kept_local\(&attributes\) with (true|false) in <impl SecretStore for KeyringStore>::keep_local',
    'store\.rs:\d+:\d+: replace SecretStore::keep_local -> Result<\(\), StoreError> with Ok\(\(\)\)',
    # `send_and_pump` cuts the upload off when the response came before the body was in. Without the
    # cut-off the sender is dropped with the function, so the body still ends in error for a declared
    # length and, for a chunked body, hyper's connection task would have to write the closing chunk
    # before the connection is dropped a moment later: no test can fix that order, so the two
    # outcomes cannot be told apart. (A failed pump has already cut the upload off in the loop.)
    'session\.rs:\d+:8: delete ! in send_and_pump',
    # `SPLIT_FIRST | ESCAPED_DOTS` combines two flags that share no bit, so `^` gives the same value.
    'replace \| with \^ in Read::all_for',
    # `c != ' '` offers `STRICT_DOTS` for nearly any text. The flag only changes a reading when the
    # text holds a control character or a space, so the extra flag sets repeat readings already listed.
    'request_match.rs:\d+:59: replace == with != in Read::all_for',
    # `WINDOWS_TRIM` differs from the plain trim only where a space sits before a trailing dot, so
    # text with a dot or a space alone reads the same either way.
    'replace && with \|\| in Read::all_for',
    # `Methods::any` is `Self::default()`, so `Default::default()` is the same value.
    'replace Methods::any -> Self with Default::default\(\)',
    # `high << 4 | low` joins two hexadecimal digits: `high` is below 16, so the shifted value has its
    # low four bits clear and `low` is below 16, so `|` and `^` (and `+`) give the same byte for every input.
    "git_path\\.rs:\\d+:\\d+: replace \\| with \\^ in decode_segment",
    "git_path\\.rs:\\d+:\\d+: replace \\| with \\^ in decode_lossy",
    # The default body of `Policy::lookup` is `Ok(None)`, so replacing it with `Ok(None)` is the same code.
    'replace Policy::lookup -> Result<Option<Decision>, PolicyError> with Ok\(None\)',
    # `keyword` returns `Some("")` for a blank line and `Some("#...")` for a comment when `||` becomes
    # `&&`; both callers only ask whether the word is `include`, `host` or `match`, which neither is.
    'sshconfig\.rs:\d+:\d+: replace \|\| with && in keyword',
    # `starts_line` is always asked with `after` at the `{` of the object, so when the last line
    # break lies before `after` the text between it and `pos` holds that `{`, which is not blank, and the
    # answer is `false` either way.
    'replace match guard n >= after with true in starts_line',
    # `eol` is the offset of a line break or the end of the text, and no comment starts there, so
    # `c.start < eol` and `c.start <= eol` agree.
    'json\.rs:\d+:34: replace < with <= in insert',
    # `Store::rule_set` reads a user set directly; without that arm it lists the user's sets and
    # finds the id, which returns the same set, or the same `UnknownRuleSet` error for an id that is
    # not there or another user's.
    "sets\\.rs:\\d+:\\d+: delete match arm RuleSetId::User\\(set\\) in Store::rule_set",
    # `close_decided_rows` skips the row it was told to leave (`except`) or one the rule's pattern does
    # not match. The left row is already decided when the query runs, so it is never in the list, and a
    # row the pattern does not match cannot have this rule as its winner, so `||` and `&&` close the same rows.
    "rows\\.rs:\\d+:\\d+: replace \\|\\| with && in close_decided_rows",
    # `high << 4 | low` joins two hexadecimal digits (as in `decode_segment` above): both are below 16,
    # so `|` and `^` give the same byte.
    "workspace_git\\.rs:\\d+:\\d+: replace \\| with \\^ in decode_address_segment",
    # `set_key` puts the rule id last, and an entry (no rule row) takes the placeholder -1 there. Only two
    # keys of the same set are ever compared on it, and a set's entries all have no id, so the placeholder's
    # value (-1 or 1) never decides.
    "engine\\.rs:\\d+:\\d+: delete - in set_key",
    # `RuleIndex::decide` replaces its best hit when a candidate's key is greater; `>=` only differs for
    # an equal key. Rule keys end in the rule id, which is unique, and two entries of one set with equal
    # keys (same kind and length of pattern matching one host, same effect) are the same pattern, so
    # both give the same answer. The three entries are the `key > best` / `own_key > own_key` comparisons
    # (not the specificity comparison against an own rule, where equal does matter and a test pins it).
    # They go through `outranks` so that the function has one `>` to name; the fourth `>` of `decide`
    # (the specificity comparison) stays measured there.
    "replace > with >= in outranks",
    # The default body of `SshTarget::failed` is `let _ = reason;`, so `()` is the same code.
    'replace SshTarget::failed with \(\)',
    # `SshEndpoint::drop` aborts the accept task, but dropping the endpoint also drops the `stop`
    # sender, which makes the task's `stopped` receiver resolve, so the loop ends and shuts its
    # sessions down either way; the abort only makes it prompt, which no test can time.
    'replace <impl Drop for SshEndpoint>::drop with \(\)',
    # `!matches!(written, Ok(Ok(())))` in `session` only decides whether to log that a refused
    # client left before reading its refusal; the connection is dropped on both paths.
    'endpoint\.rs:\d+:12: delete ! in session',
    # The default body of `SecretStore::sweep_orphans` is `Ok(Sweep::default())`, so `Ok(Default::default())`
    # is the same code.
    'replace SecretStore::sweep_orphans -> Result<Sweep, StoreError> with Ok\(Default::default\(\)\)',
    # `keyring_available` is `false` on a computer with no credential store (every Linux run of the
    # tests), which is what the mutant returns; on a computer that has one, the Windows job sets
    # PUDDLE_REQUIRE_OS_CREDENTIAL_STORE and its real-store tests fail when the answer is `false`.
    'replace keyring_available -> bool with false',
    # Not measured: the `#[cfg(not(unix))]` `exists_as_file` (the Windows body of `is_executable`: a file
    # counts when it exists) is never compiled on Linux. The Unix body is `has_execute_bit`, measured
    # and caught; the two have their own names so this entry names only the Windows one.
    'replace exists_as_file ',
    # Not measured: the Windows bodies are `#[cfg(windows)]`, so a Linux run never compiles them and every
    # change to them passes; the Windows test job runs their tests (`tests/agent.rs` of `puddle-ssh-agent`
    # against a real pipe, the `puddle-fs` tests). The Unix bodies are measured and caught. Each pair has
    # its own function names (`ask_socket` / `ask_pipe`, `allocated_unix` / `allocated_windows`,
    # `free_bytes_unix` / `free_bytes_windows`), so an entry names the Windows function and no other,
    # whatever line it moves to. `mutants-exclusions` still fails an entry that matches no mutant.
    '(replace ask_pipe | in ask_pipe$)',
    '(replace allocated_windows | in allocated_windows$)',
    '(replace free_bytes_windows | in free_bytes_windows$)',
    # `high << 4 | low` style join again: in `tlv` the length bytes are folded with `(acc << 8) | byte`,
    # and `acc << 8` has its low eight bits clear, so `|` and `^` give the same length for every input.
    'der\.rs:\d+:\d+: replace \| with \^ in tlv',
    # `platform::read` on a host without Windows stores returns `StoreSnapshot::new()`, which is
    # `StoreSnapshot::default()`, so `Ok(Default::default())` is the same code; the Windows reader
    # (`windows.rs`, left out above, re-exported under the same name on Windows) is never compiled on Linux. `read_host_stores`
    # only calls it, so on Linux the mutant returns the same empty snapshot; the Windows job's
    # `tests/windows_store.rs` fails it where the snapshot is not empty.
    'platform/mod\.rs:\d+:\d+: replace read -> Result<StoreSnapshot, StoreError> with Ok\(Default::default\(\)\)',
    'store\.rs:\d+:5: replace read_host_stores -> Result<StoreSnapshot, StoreError> with Ok\(Default::default\(\)\)',
    # `watch.rs` reads a frame's 24-bit length as `a << 16 | b << 8 | c`: the three terms share no
    # bit, so `^` gives the same length for every input.
    'watch\.rs:\d+:\d+: replace \| with \^ in Frames::observe',
    # `percent_decoded` joins `high << 4 | low` with `low` below 16: the shifted value has its low
    # four bits clear, so `^` gives the same byte for every input.
    'alt_svc\.rs:\d+:\d+: replace \| with \^ in percent_decoded',
    # `PassThrough` entries expire when their age passes the ttl: `<` against `<=` differs only for
    # an age equal to the ttl to the nanosecond, which no clock reading can produce on purpose.
    'intercept\.rs:\d+:\d+: replace < with <= in PassThrough::(learn|contains|forget|clear)',
    # `records_answer` truncates to `MAX_RECORDS`: with exactly `MAX_RECORDS` records `truncate` is a
    # no-op, so `>` and `>=` give the same answer.
    'resolve\.rs:\d+:\d+: replace > with >= in records_answer',
    # `response::write` rejects a body shorter than its `Content-Length`. The answer's body is
    # `AnswerBody`, whose exact size hint is its own length (`Buffered`) or one hyper has already
    # checked against the wire (`Streaming`, `Rejoined`), so no body can end short of its hint
    # without hyper's own error first; the guard is a defence against a body that breaks the trait.
    'response\.rs:\d+:\d+: replace match guard sent != n with false in write',
    # `TokenBody` wipes its texts on drop (`wipe`, only called from `drop`). The wiped memory is
    # freed right after, so no safe code can read what the wipe cleared: the two outcomes cannot be
    # told apart by a test (the same reason as the drop of a `SecretValue`).
    'token_body\.rs:\d+:\d+: replace wipe with \(\)',
    'token_body\.rs:\d+:\d+: replace <impl Drop for TokenBody>::drop with \(\)',
    # `SecretValue::drop` only zeroizes the string just before it is freed; no safe code can read the
    # buffer after the drop, so a test cannot tell the zeroed buffer from the untouched one.
    'replace <impl Drop for SecretValue>::drop with \(\)',
    # The same holds for the drops of `Wiped`, `WipedKey` and `PullToken`, which only zeroize their
    # own memory before it is freed.
    'replace <impl Drop for (Wiped|WipedKey|PullToken)>::drop with \(\)',
    # `Wiped::extend_from_slice` makes the next buffer itself so it can overwrite the old one. Where
    # that branch is skipped (`>` to `==`, or `+` to `*` in the size) the `Vec` grows the same
    # way (to at least double, at least the needed size), so only the overwrite of the freed
    # buffer, which no safe code can read, differs.
    'wiped\.rs:\d+:\d+: replace (\+ with \*|> with ==) in Wiped::extend_from_slice',
    # `PassThrough::set_limits` keeps a host while its age is under the time; `<=` differs only for an
    # age equal to the time to the nanosecond, which a clock that moves cannot be made to show.
    'intercept\.rs:\d+:\d+: replace < with <= in PassThrough::set_limits',
    # In the same function, `excess > 0` guards a `take(excess)`: with `>=` a zero excess takes none.
    'intercept\.rs:\d+:\d+: replace > with >= in PassThrough::set_limits',
    # `collect` counts the records it leaves out (`truncated`, `skipped`) only to say so in a log
    # line, and `skipped + truncated > 0` only decides whether the line is written; the answer is the
    # same whatever the count. The counters live in `LeftOut` so these entries name them and not the byte
    # counter beside them (`txt_bytes +=`), which is real and a test covers it.
    'replace \+= with \*= in LeftOut::',
    'replace (.* in LeftOut::any|LeftOut::any -> bool with (true|false))',
    'replace LeftOut::bump_(skipped|truncated) with \(\)',
    # `fuzzing::host` and `fuzzing::preamble` only assert invariants of code that has its own tests,
    # and return nothing; the fuzz targets call them with arbitrary bytes. A body that does nothing
    # differs from them only for an input that breaks an invariant, and the real code has none.
    'fuzzing\.rs:\d+:\d+: replace (host|preamble) with \(\)',
    # `fuzzing::answer_tokens` and the check behind it compare reading an answer whole and in pieces; the
    # piece size is the first byte of the input (`% 97 + 1`), and any size gives a valid check, so a
    # different size (`/`, `+`) differs from it for no input, and a body that does nothing differs only for
    # an input that breaks the invariant, which the real scanner has none (the tests of the scanner split
    # every body at every offset).
    'fuzzing\.rs:\d+:\d+: replace answer_tokens with \(\)',
    'scan\.rs:\d+:\d+: replace check with \(\)',
    'scan\.rs:\d+:\d+: replace % with [/+] in check',
    # The same for `head`: its `clean` check of the parsed head is an oracle that never fires on the
    # real parser (it refuses control characters first), so a weaker oracle fails no input.
    'fuzzing\.rs:\d+:\d+: replace \|\| with && in head',
    # `Scrubber::run` looks for a new frontier after a replacement only when the old one lies inside the
    # form just replaced (`frontier < copied`). With `<=` it also looks when the frontier sits exactly at
    # the end of the replaced form; the search from there finds that same place, so the output is the same.
    'answer\.rs:\d+:\d+: replace < with <= in Scrubber::run',
]

# The first failing test decides a mutant: stop the rest. Without it, a mutant that makes a test
# loop forever keeps the run until the timeout, and is reported as a timeout although a faster
# test already failed.
additional_cargo_test_args = ["--profile", "mutants", "--max-fail=1:immediate"]
