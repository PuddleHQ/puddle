# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "puddle-doctor"
description = "`puddle doctor`: checks the host's prerequisites and what can interfere, with the exact fix for each finding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Advice may name `puddle serve --headless` only in a build that has the command (the `puddle`
# crate's `serve` feature forwards here); without it the advice names what the build can do.
serve = []

[dependencies]
puddle-fs = { workspace = true }
puddle-process = { workspace = true }
puddle-runtime = { workspace = true }
puddle-secrets = { workspace = true }
puddle-ssh-agent = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
object = { workspace = true, features = ["read_core", "elf", "write"] }
puddle-test-kit = { workspace = true }

[lints]
workspace = true
