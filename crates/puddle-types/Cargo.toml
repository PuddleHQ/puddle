[package]
name = "puddle-types"
description = "Shared types for Puddle's crates: validated names, guest files and env, memory size, events, errors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test fixtures (`fixture`): runtime-random passwords and canaries for other crates' tests.
testing = []
# `utoipa::ToSchema` on the types the API puts on the wire (ADR 0004).
openapi = ["dep:utoipa"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
