# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-compute-msb"
description = "The compute-plane traits over the msb SDK: sandboxes, volumes, images, exec, SSH, the memory setting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
dunce = { workspace = true }
microsandbox = { workspace = true }
microsandbox-image = { workspace = true }
puddle-compute = { workspace = true }
puddle-fs = { workspace = true }
puddle-runtime = { workspace = true }
puddle-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
tracing-subscriber = { workspace = true }
microsandbox-runtime = { workspace = true }
puddle-compute = { workspace = true, features = ["contract"] }
puddle-api = { workspace = true }
puddle-boot = { workspace = true }
puddle-ipc = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-proxy = { workspace = true, features = ["testing"] }
puddle-store = { workspace = true }
puddle-vm-tests = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "time"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dev-dependencies]
puddle-fs = { workspace = true, features = ["testing"] }
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[lints]
workspace = true
