# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-upstream"
description = "Upstream company proxy: discovery (WinINet, WinHTTP PAC/WPAD, policy, env), authentication (Basic, SSPI Negotiate and NTLM) and the chained connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
thiserror = { workspace = true }
tokio-rustls = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Credentials",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[features]
# `testing`: `FakeOs`, an in-memory stand-in for the operating system's proxy answers (never in
# product code).
testing = []

[dev-dependencies]
puddle-test-kit = { workspace = true }
puddle-types = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
puddle-upstream = { path = ".", features = ["testing"] }
rcgen = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
