# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Tijs van Kampen <puddle@tijsvankampen.be>"]
repository = "https://github.com/PuddleHQ/puddle"
publish = false

[workspace.dependencies]
# Internal crates. Add external dependencies here too, with a version, and use
# `dep = { workspace = true }` in the member crates, so every crate gets the same version.
puddle-types = { path = "crates/puddle-types" }
puddle-compute = { path = "crates/puddle-compute" }
puddle-proxy = { path = "crates/puddle-proxy" }
puddle-store = { path = "crates/puddle-store" }
puddle-api = { path = "crates/puddle-api" }
puddle-boot = { path = "crates/puddle-boot" }
puddle-agent = { path = "crates/puddle-agent" }
puddle-agent-proto = { path = "crates/puddle-agent-proto" }
puddle-runtime = { path = "crates/puddle-runtime" }
puddle-ipc = { path = "crates/puddle-ipc" }
puddle-compute-msb = { path = "crates/puddle-compute-msb" }
puddle-vm-tests = { path = "crates/puddle-vm-tests" }
puddle-settings = { path = "crates/puddle-settings" }
puddle-netpolicy = { path = "crates/puddle-netpolicy" }
puddle-ca = { path = "crates/puddle-ca" }
puddle-guest-env = { path = "crates/puddle-guest-env" }
puddle-ssh = { path = "crates/puddle-ssh" }
puddle-certs = { path = "crates/puddle-certs" }
puddle-workspace = { path = "crates/puddle-workspace" }
puddle-doctor = { path = "crates/puddle-doctor" }
puddle-e2e = { path = "crates/puddle-e2e" }
puddle-lifecycle = { path = "crates/puddle-lifecycle" }
puddle-upstream = { path = "crates/puddle-upstream" }
puddle-fs = { path = "crates/puddle-fs" }
puddle-fd-limit = { path = "crates/puddle-fd-limit" }
puddle-host = { path = "crates/puddle-host" }
puddle-secrets = { path = "crates/puddle-secrets" }
puddle-inject = { path = "crates/puddle-inject" }
puddle-repos = { path = "crates/puddle-repos" }
puddle-logins = { path = "crates/puddle-logins" }
puddle-ports = { path = "crates/puddle-ports" }
puddle-front = { path = "crates/puddle-front" }
puddle-appicon = { path = "crates/puddle-appicon" }
# Dev-dependency only (scripts/quality-gate.py checks it): bounded waits, event reads, ports, temp folders for tests.
puddle-test-kit = { path = "crates/puddle-test-kit" }

# External
# msb SDK from Puddle's fork, tag `v<release>-puddle.N`. The SDK and the bundled runtime
# move together: `puddle-runtime` reads its expected runtime version from this pin in
# Cargo.lock, and the CI VM jobs and `cargo xtask runtime` read the tag from there too
# (`ci/msb-tag.sh`), so the three `tag =` values below are the only place the version is written.
# To bump: change the tag on the three lines (the same string), update the libkrun/russh pins in
# `[patch.crates-io]` to the commits the new tag's Cargo.lock pins, add the tag's checksums to
# `ci/msb-runtime.sha256`, then `cargo update -p microsandbox`.
# Default features off: no build-time runtime download, no keyring/dbus, no cloud client. `net` is
# required even without guest networking: without it the SDK's launch config lacks `sandbox_slot`
# and a release msb refuses it ("missing field `sandbox_slot`"). `ssh` for the in-process
# SSH server.
microsandbox = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.8-puddle.9", default-features = false, features = ["local", "net", "ssh"] }
# The SDK's image crate: the SDK has no public "pull without creating" call.
microsandbox-image = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.8-puddle.9", default-features = false }
# Only for building the SDK's boot error in tests.
microsandbox-runtime = { git = "https://github.com/TijsVK/microsandbox", tag = "v0.7.8-puddle.9", default-features = false }
object = { version = "0.40", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = "1.0.149"
sha2 = "0.11"
# The OS credential store (Credential Manager, Keychain, Secret Service over D-Bus in pure Rust),
# used only for tokens the user pastes into Puddle.
keyring = "4.2"
zeroize = "1.9"
rust-embed = { version = "8.12", default-features = false, features = ["mime-guess"] }
hickory-resolver = { version = "0.26.3", default-features = true }
proptest = { version = "1.11", default-features = false, features = ["std"] }
psl = "2.1"
# UTS #46 host-name mapping (IDNA to ASCII) for the proxy's name normalisation.
idna = "1.1"
rusqlite = { version = "0.39", features = ["bundled"] }
tempfile = "3"
thiserror = "2"
# Names the program that holds a port this computer wants to forward to (Linux, Windows, macOS).
listeners = { version = "0.6.1", default-features = false }
tokio = { version = "1.52", default-features = false }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
# Guest agent and its protocol. tokio-yamux multiplexes guest connections over a few
# vsock streams (a Windows vsock route tops out around 100 streams); libc for AF_VSOCK.
tokio-yamux = { version = "0.3.20", default-features = false, features = ["tokio-timer"] }
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
libc = "0.2.172"
# Interface listing for the guest agent (getifaddrs, if_nametoindex) without hand-written FFI.
nix = { version = "0.31.3", default-features = false, features = ["net", "signal"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
getrandom = "0.4"
# The login key of direct SSH (public half derived from the seed); already in the tree through the runtime's SSH stack.
ed25519-dalek = { version = "3", default-features = false, features = ["zeroize"] }
# Fast substring search for the proxy's stand-in swap (already in the tree through regex and axum).
memchr = "2.8"
# The per-user data folder per OS; no own per-OS code for it.
dirs = "7"
windows-sys = "0.61"
# `getaddrinfo` with its error code kept (the proxy tells "no such name" from "lookup failed" by it); std and tokio keep only text.
dns-lookup = "4.0.2"
# Per-sandbox CA and leaf certificates. ring, not aws-lc-rs: aws-lc-sys carries the
# OpenSSL licence, which deny.toml does not allow; ring is Apache-2.0 AND ISC.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# tls12: real upstream servers still negotiate TLS 1.2, and nothing may fail because of the sandbox.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
time = { version = "0.3", default-features = false, features = ["std"] }
# Reading certificate extensions (the dev certificate's shape checks); already in the tree through rcgen.
x509-parser = { version = "0.18", default-features = false }
# PEM for the guest CA bundle; already in the tree through rcgen.
pem = { version = "4", default-features = false, features = ["std"] }
# OpenAPI schemas for the API's wire types (ADR 0004).
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
# Local HTTP API: axum on loopback; utoipa-axum registers routes and spec together.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "macros", "query", "tokio", "tracing"] }
# Served through hyper directly (not `axum::serve`) for a header-read timeout and owned connection tasks.
hyper = { version = "1.11", default-features = false, features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
utoipa-axum = "0.3.0"
tower-http = { version = "0.7.1", default-features = false, features = ["timeout"] }
subtle = { version = "2.6.1", default-features = false, features = ["std"] }
# Basic credentials of the image-pull proxy; already in the tree through reqwest.
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
# TLS over tokio streams: the sandbox proxy's terminated connections and the host-side client;
# also the lab registry of the image-pull test. ring, not aws-lc-rs (see rcgen).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The host's own TLS verifier: the platform's on Windows (so the corporate roots the company
# added there count), the system roots and extra roots elsewhere.
rustls-platform-verifier = "0.7"
tar = { version = "0.4", default-features = false }
# Unpacks the bundled code-server release (cargo xtask code-server); already in the tree.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Desktop shell. Tauri 2.12 (3.0 is alpha). `wry` is the webview; `x11` is the Linux
# display backend. No `common-controls-v6` (the unit-test executables have no manifest, so they
# fail to load with 0xc0000139; nothing here shows a dialog) and no `compression`
# (nothing is served through Tauri's asset protocol: the SPA comes from puddle-api) and no devtools
# feature. `tray-icon` is the tray icon and the application menu.
tauri = { version = "2.12.1", default-features = false, features = ["wry", "x11", "tray-icon"] }
# The user's icon image: PNG, JPEG and WebP in, a 256 pixel PNG out. No other formats, no threads.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# Draws the built-in duck icons (anti-aliased paths); `png-format` encodes them.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "png-format"] }
tauri-build = { version = "2.7.1", default-features = false }
tauri-plugin-notification = { version = "2.7.0", default-features = false }
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-opener = { version = "2.7.0", default-features = false }
url = "2"
# WebSocket handshake of a terminated connection (RFC 6455 §4.2.2: SHA-1 of the key). Already in
# the tree through rustls and rcgen.
ring = { version = "0.17", default-features = false }
# Test client for the HTTP/2 of terminated connections (hostile-guest tests); already in the tree
# through hyper.
h2 = { version = "0.4", default-features = false }
# gRPC test server and client for the trailers and streaming of terminated HTTP/2 connections.
# Dev-dependencies only; no protoc: the messages are written by hand with prost's derive.
tonic = { version = "0.14", default-features = false, features = ["codegen"] }
tonic-prost = { version = "0.14", default-features = false }
prost = { version = "0.14", default-features = false, features = ["derive"] }
# Terminated TLS connections: hyper HTTP/1 and HTTP/2 on both legs.
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

[workspace.lints.rust]
unsafe_code = "deny" # each crate root also says #![forbid(unsafe_code)] unless it needs FFI
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Restriction lints picked for a security tool written mostly by agents.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
exit = "warn"
expect_used = "warn"
get_unwrap = "warn"
indexing_slicing = "warn"
mem_forget = "warn"
panic = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unwrap_used = "warn"
wildcard_dependencies = "warn"
# clippy.toml names std::env::temp_dir: make a test's files with `tempfile`, or say why in an
# #[expect(clippy::disallowed_methods, reason = "...")] (scripts/flake-lints-test.sh proves the rule fires).
disallowed_methods = "deny"

# The msb fork's own `[patch.crates-io]` doesn't reach Puddle (patches apply only in the root
# workspace), so its libkrun, russh and imago forks are repeated here, pinned to the commits the
# fork tag's Cargo.lock pins (a branch would follow later pushes, which the tag's msb wasn't built
# with). libkrun: TijsVK/libkrun tag `msb_krun-v0.1.41-puddle.5` (msb_krun 0.1.41 + fixes); russh:
# TijsVK/russh tag `v0.64.1-puddle.1` (russh 0.64.1 + the peer-close fix).
[patch.crates-io]
msb_krun = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_arch = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_arch_gen = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_cpuid = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_devices = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_hvf = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_kernel = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_polly = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_smbios = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_utils = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
msb_krun_vmm = { git = "https://github.com/TijsVK/libkrun", tag = "msb_krun-v0.1.41-puddle.5" }
russh = { git = "https://github.com/TijsVK/russh", tag = "v0.64.1-puddle.1" }
# msb-imago: TijsVK/imago `puddle` (File::sync() calls fdatasync, so a guest flush no longer commits the
# host journal for the image mtime).
msb-imago = { git = "https://github.com/TijsVK/imago", rev = "e528d65caf49ed0e117eb29ffae1d9e6efc95d25" }

# tokio-yamux 0.3.20 with two fixes (vendor/tokio-yamux): a writer gets the peer's window updates
# whether or not its stream is read (after the peer's FIN, or by a program that only writes), so it
# can move more than one window of data; and one stream that is not read no longer stops the session reading
# its socket for every other stream. Temporary: drop it when a tokio-yamux release has the fix or a fork pinned
# by `rev` (like russh above) takes its place. The exact condition is in vendor/tokio-yamux/NOTICE.
tokio-yamux = { path = "vendor/tokio-yamux" }

[profile.release]
lto = "thin"
codegen-units = 1
