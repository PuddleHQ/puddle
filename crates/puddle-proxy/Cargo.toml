# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-proxy"
description = "Puddle's egress proxy: CONNECT/HTTP handling, pending requests, TLS termination of bound hosts with a credential injection hook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
dns-lookup = { workspace = true }
getrandom = { workspace = true }
hickory-resolver = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
memchr = { workspace = true }
psl = { workspace = true }
puddle-agent-proto = { workspace = true }
puddle-ca = { workspace = true }
puddle-ipc = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-types = { workspace = true }
puddle-upstream = { workspace = true }
ring = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[features]
# `testing`: in-memory policy, resolver and allow-any address check for tests (never in product code).
testing = []
# `fuzzing`: entry points for the cargo-fuzz targets in `fuzz/` and their checked-in corpus (never in
# product code; the xtask release-feature check refuses it in a shipped build).
fuzzing = []

[dev-dependencies]
puddle-types = { workspace = true, features = ["testing"] }
base64 = { workspace = true }
hickory-resolver = { workspace = true }
futures-util = { workspace = true }
h2 = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
proptest = { workspace = true }
puddle-inject = { workspace = true, features = ["testing"] }
puddle-logins = { workspace = true }
puddle-proxy = { path = ".", features = ["testing", "fuzzing"] }
puddle-secrets = { workspace = true }
puddle-store = { workspace = true }
puddle-upstream = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinSock"] }
