[package]
name = "puddle-process"
description = "Starts a child process the one way Puddle's host does: on Windows, without a console window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[lints]
workspace = true
