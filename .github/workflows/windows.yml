# SPDX-License-Identifier: GPL-3.0-or-later
# Native Windows MSVC build and tests. It runs on every pull request to develop and main (a
# required check on develop), nightly (skipped when this workflow already has a green run on
# develop's head), and by hand. Linux CI already cross-checks clippy for the msvc target.
# Clippy, tests and UI run on every trigger; the release build runs only on the nightly, on pull
# requests to main and on manual runs from develop, so a pull request to develop skips it. The jobs
# run side by side, so the run takes as long as the slowest one instead of the sum. Two cache entries
# (debug builds, release build); only runs on develop save them. Clippy has none: its check builds
# were no faster with one.
# The nightly also reruns each failed test once and lists the ones that pass only on retry
# (ci/flaky-report.py); it never turns the run red.
name: windows

on:
  schedule:
    - cron: "30 2 * * *"
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a PR or task branch stop; develop's (the nightly, a dispatch) run to the end, each in its own group so none is dropped as a pending run.
concurrency:
  group: windows-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, while the 100+ test binaries link much faster and
  # the cache stays smaller (the same setting as ci.yml and the VM workflows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  clippy:
    name: windows clippy
    runs-on: windows-2025
    timeout-minutes: 30
    # `actions: read` for ci/should-run.sh (a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - name: clippy
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: scripts/check.sh clippy

  tests:
    name: windows tests (nextest, doc tests, secret scan)
    runs-on: windows-2025
    # Nearly all of it is compiling and linking the test binaries; running the 2000+ tests takes
    # under two minutes, so there is nothing to gain from splitting them across runners.
    timeout-minutes: 45
    # `actions: read` for ci/should-run.sh (a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # One entry for the debug builds (this job saves it, the UI job restores it); only develop
      # saves, and cache-gc.yml deletes the superseded one (10 GB cap for the whole repo).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows
          cache-on-failure: true # a red test must not forfeit the build
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: tests
        if: steps.changed.outputs.run == 'true'
        shell: bash
        env:
          # The nightly retries a failed test once, only to report flakes (below). The profile
          # keeps retries at 0 for every other run (docs/STANDARDS.md, "Flaky tests").
          RETRIES: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: cargo nextest run --workspace --all-features --locked --profile ci --retries "$RETRIES"
      - name: flaky tests (nightly report)
        if: ${{ github.event_name == 'schedule' && steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: python3 ci/flaky-report.py target/nextest/ci/junit.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: doc tests
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: cargo test --doc --workspace --all-features --locked --no-fail-fast
      # Windows runs this one gate of the Linux job too: it proves ci/fetch-gitleaks.sh and the
      # gate work in Git Bash with the Windows release, where developers' pre-push hook runs.
      - name: secret scanning (gitleaks, Windows release)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: |
          ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" scripts/check.sh secrets
      - name: upload test results
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: windows UI (unit tests, e2e on Edge, desktop shell smoke)
    runs-on: windows-2025
    timeout-minutes: 40
    # `actions: read` for ci/should-run.sh (a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the UI diff-coverage gate needs the base commit
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows # saved by the tests job
          save-if: false
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI (format, lint, types, unit and component tests with coverage, build)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: scripts/check.sh ui
      - name: UI end-to-end (Playwright on the installed Edge, axe)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: scripts/check.sh ui-e2e
      # The desktop shell starts on the installed WebView2 and its main window shows the SPA from
      # the in-process backend; driven over WebView2's DevTools Protocol, no extra tools.
      - name: desktop shell smoke test (WebView2)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          cargo build -p puddle-app --all-features --locked
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          node crates/puddle-app/e2e/smoke.mjs
      - name: upload UI test results
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-test-results
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore

  # Nightly, pull requests to main and manual runs from develop only: it compiles everything a
  # second time, which a pull request to develop does not need. Only the nightly and a manual run
  # from develop save its cache (`save-if` below), so the nightly starts warm.
  release:
    name: windows release build
    if: >-
      ${{ github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
    runs-on: windows-2025
    timeout-minutes: 45
    # `actions: read` for ci/should-run.sh (a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The binaries embed ui/build, so it is built first, as the release build always saw it.
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI build (embedded in the release binaries)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cd ui && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: release build
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cargo build --workspace --release --locked

  # One stable result for the four jobs above. The release build is skipped on a pull request to
  # develop and on a manual run from a task branch; a skipped job counts as passed below, and
  # `always()` makes this job report even then. The develop ruleset requires it by this name: a
  # rename changes the ruleset in the same change.
  windows:
    name: windows-msvc (build, clippy, tests)
    needs: [clippy, tests, ui, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: every job passed (or was skipped on purpose)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
