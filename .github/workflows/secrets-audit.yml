# SPDX-License-Identifier: AGPL-3.0-or-later
# Nightly audit of every ref for secrets. The PR gate (scripts/check-secrets.sh, scope `history`) scans a pull
# request's own history only, so a branch with no pull request is never scanned. This run clones the whole
# repository (every branch) and scans all of it with PUDDLE_SECRETS_SCOPE=all, then ci/secrets-audit-issue.sh
# opens or rewrites one issue ("Secrets audit: ...") when a finding exists and closes it after a clean run. The
# issue names rule, file, line and commit, never a value. Its own signal, so nightly-signal does not watch it
# (the list in ci/nightly-issue-test.sh). A scan that cannot run (exit other than 0 or 1) fails the job and
# touches no issue. GitHub turns scheduled workflows off after 60 days without repository activity.
name: secrets-audit

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-audit
  cancel-in-progress: false

jobs:
  audit:
    name: scan every ref
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0 # the whole history of every branch: the audit is the scan of what no pull request covers
          persist-credentials: false
      - name: self-test of the issue text
        run: ci/secrets-audit-issue-test.sh
      - name: scan every ref
        id: scan
        env:
          PUDDLE_SECRETS_SCOPE: all
        run: |
          # No -e (Actions' default is -e): exit code 1 (a finding) is a result, handled by the issue step.
          set +e
          ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" PUDDLE_SECRETS_REPORT="$RUNNER_TEMP/secrets-report.json" scripts/check-secrets.sh
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.scan.outputs.code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ci/secrets-audit-issue.sh "$RUNNER_TEMP/secrets-report.json" "$CODE" "$RUN_URL"
