[package]
name = "puddle-boot"
description = "Boot hook (guest/boot.sh) and the readiness gate: no SSH or exec before the hook passes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
puddle-compute = { workspace = true }
puddle-types = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
puddle-test-kit = { workspace = true }
tracing-subscriber = { workspace = true }
puddle-compute = { workspace = true, features = ["fake"] }
puddle-compute-msb = { workspace = true }
puddle-guest-env = { workspace = true }
puddle-vm-tests = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
