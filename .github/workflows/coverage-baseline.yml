# SPDX-License-Identifier: GPL-3.0-or-later
# The nightly coverage baseline raise (ci/raise-coverage-baseline.sh): when the coverage the `ci` workflow measured on develop's tip is
# above scripts/coverage-baseline.json, ONE pull request, `build: raise the coverage baseline`, raises it and goes through the
# merge queue like any other. Pull requests carry no raise of their own, so two of them never conflict on that file. It reads the
# measurement the ci coverage gate uploaded; it builds and tests nothing.
#
# A pull request opened or updated with the default GITHUB_TOKEN does not start the required checks (a GitHub rule against
# workflow loops), so the job mints a short-lived installation token for the GitHub App "puddle-coverage-baseline" and opens the
# pull request as that app. Maintainers need the app installed on this repository only, the repository variable
# COVERAGE_BASELINE_CLIENT_ID (the app's public Client ID) and the repository secret COVERAGE_BASELINE_APP_PRIVATE_KEY (a private key of the app).
# The app needs the repository permissions Contents and Pull requests (read and write) and Actions (read). The token asks for just
# those three, on this repository only, and GitHub revokes it when the job ends.
name: coverage-baseline

on:
  schedule:
    - cron: "27 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be raised; push nothing, open nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: coverage-baseline
  cancel-in-progress: false

jobs:
  raise:
    name: raise the coverage baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Token for the coverage baseline app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COVERAGE_BASELINE_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_BASELINE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-actions: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 20 # the script walks back over documentation-only commits
          token: ${{ steps.app-token.outputs.token }}
      - name: Node for the ratchet script
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: raise the baseline
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: ci/raise-coverage-baseline.sh
