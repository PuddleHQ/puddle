# SPDX-License-Identifier: AGPL-3.0-or-later
# The company-network bars on Windows (the Windows half of the corporate-network acceptance
# battery), weekly on develop (Wednesday 04:41 UTC, so a regression in the real-tool radar shows within a
# week; nightly-signal opens the issue) and by hand on any branch (`gh workflow run company-network-windows.yml --ref <branch>`):
# `vm_company_network_*` and `vm_radar_company_network_*` in a real microVM on WHP: the guest's
# curl, git, npm and dotnet restore with the toggle off and on, and the intranet refused off and
# served on. The radar half calls live package mirrors, so it never runs per pull request.
# It runs on GitHub's windows-2025 runner, never on a developer's machine (Defender ASR rule).
# The end-to-end tests over the stand-in (puddle-e2e `private_access`) are unix-only and run in the
# Linux jobs. A runner without a usable hypervisor fails this job: it exists to run the VM bars.
name: company-network-windows

on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-network-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PUDDLE_VM_MSB_LOG_LEVEL: debug

jobs:
  company-network:
    name: company-network bars (windows-2025, WHP)
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/whp-preflight
        with:
          title: company-network windows
          fail-events: '*'
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: company-network-windows
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (fork tag release assets; download, verify)
        shell: bash
        run: |
          dir=$(cygpath -w "$RUNNER_TEMP")
          ci/fetch-msb.sh "$(cygpath -u "$RUNNER_TEMP")/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$dir\\msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$dir\\pvm" >> "$GITHUB_ENV"
      - name: guest agent (static musl build)
        shell: bash
        run: echo "PUDDLE_AGENT_BIN=$(cygpath -w "$PWD/$(ci/build-agent.sh --locked)")" >> "$GITHUB_ENV"
      # The Windows chain test (vm_radar_company_network_windows_*) runs mitmproxy as the NTLM-demanding
      # TLS interceptor; pinned with hashes in ci/lab/requirements.txt, as in windows.yml.
      - name: mitmproxy for the corporate-lab fixtures
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/lab-venv"
          "$RUNNER_TEMP/lab-venv/Scripts/python.exe" -m pip install --retries 10 --timeout 60 --require-hashes --no-deps --quiet -r ci/lab/requirements.txt
          "$RUNNER_TEMP/lab-venv/Scripts/mitmdump.exe" --version
          echo "PUDDLE_MITMDUMP_BIN=$(cygpath -w "$RUNNER_TEMP/lab-venv/Scripts/mitmdump.exe")" >> "$GITHUB_ENV"
      - name: VM bars and the real-tool battery (toggle off, then on)
        shell: bash
        timeout-minutes: 50
        env:
          # The chain test puts a root in the runner user's store and a proxy in its Internet Settings,
          # and fails (never skips) when the runner lacks mitmproxy or stops being a CI runner.
          PUDDLE_REQUIRE_MITMPROXY: "1"
          PUDDLE_REQUIRE_REGISTRY_TESTS: "1"
        run: |
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo nextest run -p puddle-host --profile vm --locked --no-fail-fast \
            -E 'test(/(^|::)vm_company_network_/) | test(/(^|::)vm_radar_company_network_/)' --no-tests=fail
      - name: upload test results and msb logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: company-network-windows-results
          path: |
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
