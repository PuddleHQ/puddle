# SPDX-License-Identifier: GPL-3.0-or-later
# VM tests on Windows WHP (tier W): crate puddle-vm-tests under `nextest --profile vm` on the
# hosted windows-2025 runner, whose Hyper-V/WHP runs msb microVMs (observed, not promised by
# GitHub). It runs on every pull request to develop (a required check there) and to main, on every merge queue run, by
# hand on any branch (`gh workflow run vm-windows.yml --ref <branch>`) and nightly on develop unless it
# already has a green nightly or manual run on that commit (a merge queue run or a light pull request
# run never counts, so the soak tests still run). VM tests are never retried; a runner without a usable
# hypervisor is reported as an infrastructure skip, not a test result, except on a pull request or a
# merge queue run, where it fails the job (a required check must not pass without running VM tests;
# same policy as ci/vm-skip-policy.sh).
# A pull request to develop or a merge queue run whose changed files cannot reach a VM test skips every job here
# (ci/scope.sh, the `scope` job); the result job accepts that skip only when `scope` said so. With the
# repository variable PUDDLE_QUEUE set to `on`, a pull request to develop skips them too (the light
# mode) and the merge queue runs them on the commit that lands.
# With the repository variable PUDDLE_TIER set to `on`, a merge queue run skips them too unless the
# group's diff touches a path that can only break them there (ci/scope.sh `escalates`: the msb
# adapter, the shared VM test crate, the msb pin, this workflow, any path with `windows` in its name);
# they then run in the nightly and release tier. The result job accepts that skip and its summary
# says the check is not a test result for them.
# The test binaries are built once (`cargo nextest archive`) and the tests run in five partitions
# on five runners at once; `vm-windows (WHP, msb microVMs)` is the one result of all of them.
name: vm-windows

on:
  schedule:
    - cron: "23 3 * * *"
  pull_request:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or task branch stops the run in flight (its result would be about a commit that is
# no longer the head); develop's runs (the nightly, a dispatch) run to the end, each in its own group so none is dropped.
concurrency:
  group: vm-windows-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, builds and the cache stay much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Crates with VM tests: the harness smoke, the msb adapter (contract suite, memory),
  # the boot hook, the workspace lifecycle, shutdown and reconcile, the whole host.
  VM_CRATES: -p puddle-vm-tests -p puddle-compute-msb -p puddle-boot -p puddle-workspace -p puddle-lifecycle -p puddle-host --package=puddle
  # msb's sandbox runtimes log at debug, and the harness keeps each removed sandbox's logs beside
  # the run home, so a boot that fails keeps its VMM trace and kernel.log in the artefact.
  PUDDLE_VM_MSB_LOG_LEVEL: debug

jobs:
  # Which jobs this pull request needs (ci/scope.sh; it falls open to "all" on any doubt). Checks out
  # only ci/, so it costs a few seconds.
  scope:
    name: scope (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      vm: ${{ steps.scope.outputs.vm }}
      defer_vm_windows: ${{ steps.scope.outputs.defer_vm_windows }}
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: which jobs does this change need?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
        run: ci/scope.sh
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  build:
    name: vm-windows build (test archive, guest agent)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.vm != 'false' && needs.scope.outputs.light != 'true' && needs.scope.outputs.defer_vm_windows != 'true' }}
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    runs-on: windows-2025
    # A cold build of the SDK takes ~10 min on windows-2025.
    timeout-minutes: 40
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh vm-windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # No Rust cache here: this job's nextest archive build restored an entry on 0 of the last 22 pull
      # requests, and with the windows entry restored it was within noise of a cold build, so the
      # restore only cost time and the repo's 10 GB cap more space (cache-gc.yml, budget table).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: guest agent (static musl build)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$(ci/build-agent.sh --locked)" "$RUNNER_TEMP/bundle/puddle-agent"
      - name: build the VM tests once (nextest archive)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cargo nextest archive $VM_CRATES --profile vm --locked --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst"
      - name: share the archive and the agent with the test jobs
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-windows-build
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          compression-level: 0 # the archive is already compressed
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  tests:
    name: vm-windows tests (partition ${{ matrix.partition }} of 5)
    needs: build
    if: needs.build.outputs.run == 'true'
    permissions:
      contents: read
      actions: write
    runs-on: windows-2025
    # ~67 VM tests in all, each partition a fifth of them; every test has its own 12-minute cap.
    # Three limits, each inside the next, so a hang ends in a named failure with its log uploaded
    # instead of the job's timeout (a cancelled job skips the steps that would keep the evidence):
    # nextest's deadline for the whole run (VM_TEST_DEADLINE), the test step's own limit as the
    # backstop if nextest cannot end, then this job limit. Change them together: the steps before
    # the tests (under a minute) plus the step limit must leave the steps after it a few minutes.
    timeout-minutes: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WHP preflight (infrastructure)
        id: whp
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $whp = (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State
          "HypervisorPresent=$($cs.HypervisorPresent) HypervisorPlatform=$whp"
          if ($cs.HypervisorPresent -and "$whp" -eq 'Enabled') {
            "ok=true" >> $env:GITHUB_OUTPUT
          } else {
            # Same policy as ci/vm-skip-policy.sh (kept inline: plain `bash` from pwsh may be WSL).
            $reason = "Windows Hypervisor Platform is not usable on this runner (HypervisorPresent=$($cs.HypervisorPresent), HypervisorPlatform=$whp)"
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -or $env:GITHUB_EVENT_NAME -eq 'merge_group') {
              "::error title=vm-windows cannot run::$reason; a required VM check must not pass without running VM tests"
              exit 1
            }
            "::warning title=vm-windows skipped::$reason; VM tests did not run (infrastructure, not a test result)"
            "### vm-windows partition ${{ matrix.partition }}: SKIPPED, WHP not usable on the runner (infrastructure)" >> $env:GITHUB_STEP_SUMMARY
            "ok=false" >> $env:GITHUB_OUTPUT
          }
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.whp.outputs.ok == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (fork tag release assets; download, verify)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: |
          # The runtime is the SDK's fork tag (ci/msb-tag.sh, from Cargo.lock). Unix-style path for
          # the script, Windows-style for the tests.
          dir=$(cygpath -w "$RUNNER_TEMP")
          ci/fetch-msb.sh "$(cygpath -u "$RUNNER_TEMP")/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$dir\\msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$dir\\pvm" >> "$GITHUB_ENV"
      - name: the test archive and the guest agent from the build job
        if: steps.whp.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-windows-build
          path: ${{ runner.temp }}/bundle
      - name: VM tests (tier W, partition ${{ matrix.partition }} of 5)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        timeout-minutes: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 52 || 32 }}
        env:
          VM_TEST_DEADLINE: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '48m' || '28m' }}
        run: |
          export PUDDLE_AGENT_BIN
          # The hostile-guest second-user tests fail, not skip, when the runner won't make an account.
          export PUDDLE_REQUIRE_SECOND_USER=1
          PUDDLE_AGENT_BIN=$(cygpath -w "$RUNNER_TEMP/bundle/puddle-agent")
          # cargo-nextest is called directly: through `cargo` it would make rustup install the
          # pinned toolchain here, which an archive run never needs.
          mkdir -p "$RUNNER_TEMP/vmx"
          # Real-machine tests (vm_machine_*) run in ci/windows-e2e.ps1, and the real-tool radar (vm_radar_*) in full-test.yml, not here. The soak (vm_soak_*, a 15-minute idle SSH session) runs on the nightly and on a dispatch only.
          FILTER='not (test(/(^|::)vm_machine_/) | test(/(^|::)vm_radar_/) | test(/(^|::)vm_soak_/))'
          case "$GITHUB_EVENT_NAME" in schedule | workflow_dispatch) FILTER='not (test(/(^|::)vm_machine_/) | test(/(^|::)vm_radar_/))' ;; esac
          # At the deadline nextest stops the test still running, names it and writes junit.xml.
          # The other users of the vm profile (the radar, the real-machine run) need longer, so the
          # deadline comes from this job, as a tool config below the repository's.
          printf '[profile.vm]\nglobal-timeout = "%s"\n' "$VM_TEST_DEADLINE" > "$RUNNER_TEMP/vm-deadline.toml"
          # nextest writes to a file that the upload keeps (the job log is lost when the job is
          # cancelled), and tail shows it here as it grows, until nextest exits. The file exists before
          # tail opens it, and a tail failure never ends the step early: nextest would go on running
          # under the steps that follow.
          log="$RUNNER_TEMP/vm-tests.log"
          : > "$log"
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo-nextest nextest run --profile vm \
            --tool-config-file "vm-deadline:$(cygpath -m "$RUNNER_TEMP")/vm-deadline.toml" \
            --archive-file "$(cygpath -m "$RUNNER_TEMP")/bundle/vm-tests.tar.zst" \
            --extract-to "$(cygpath -m "$RUNNER_TEMP")/vmx" --workspace-remap . \
            --partition hash:${{ matrix.partition }}/5 \
            -E "$FILTER" > "$log" 2>&1 &
          nextest=$!
          tail -n +1 -f --pid="$nextest" "$log" || true
          wait "$nextest"
      - name: memory and processes after a failed or stopped run
        if: ${{ (failure() || cancelled()) && steps.whp.outputs.ok == 'true' }}
        # Best effort: a starved runner must not cost the upload after it.
        timeout-minutes: 3
        continue-on-error: true
        shell: pwsh
        run: |
          # What was still running (a VM process that outlived its test, a stuck test) and how much
          # memory was left; printed here and kept with the results. Command lines only for the
          # run's own programs (test binaries, msb), which carry no secrets.
          $os = Get-CimInstance Win32_OperatingSystem
          $ours = { param($p) $p.ExecutablePath -and $p.ExecutablePath.StartsWith($env:RUNNER_TEMP, [StringComparison]::OrdinalIgnoreCase) }
          $report = @(
            "memory: {0:N0} MiB free of {1:N0} MiB" -f ($os.FreePhysicalMemory / 1KB), ($os.TotalVisibleMemorySize / 1KB)
            Get-CimInstance Win32_Process | Sort-Object WorkingSetSize -Descending | Select-Object -First 40 ProcessId, ParentProcessId,
              @{ n = 'MiB'; e = { [int]($_.WorkingSetSize / 1MB) } }, CreationDate,
              @{ n = 'Command'; e = { if (& $ours $_) { $_.CommandLine } else { $_.Name } } } | Format-Table -AutoSize -Wrap | Out-String -Width 400
          )
          $report | Tee-Object -FilePath "$env:RUNNER_TEMP\vm-processes.txt"
      - name: upload test results and msb logs
        if: ${{ always() && steps.whp.outputs.ok == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-windows-results-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/vmx/target/nextest/vm/junit.xml
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/vm-tests.log
            ${{ runner.temp }}/vm-processes.txt
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # One stable result for the build and every partition.
  # The develop ruleset requires it by this name: a rename changes the ruleset in the same change.
  # A pull request or a merge queue run may skip them all only when `scope` said so, or in the light
  # mode (`queue`), and a nightly when the commit already has a green run (ci/scope.sh verdict); the
  # KVM/WHP infrastructure skip is a skipped step inside a passing job, not a skipped job.
  vm-windows:
    name: vm-windows (WHP, msb microVMs)
    needs: [scope, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh verdict --nightly-skips build=vm,queue,defer:defer_vm_windows tests=vm,queue,defer:defer_vm_windows
