[package]
name = "xtask"
description = "Developer and release tasks: `cargo xtask runtime` assembles the bundled msb runtime folder with its licence files; `cargo xtask code-server` unpacks the pinned code-server release; `cargo xtask openapi` writes the API contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flate2 = { workspace = true }
puddle-api = { workspace = true }
puddle-runtime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
object = { workspace = true, features = ["write"] }
tempfile = { workspace = true }

[lints]
workspace = true
