# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-lifecycle"
description = "Shutdown and reconcile: stop every sandbox with Puddle, clean up after a Puddle that died, one kill-on-close job for Puddle and its VMs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
puddle-compute = { workspace = true }
puddle-types = { workspace = true }
puddle-workspace = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
puddle-test-kit = { workspace = true }
microsandbox = { workspace = true }
puddle-compute = { workspace = true, features = ["fake"] }
puddle-compute-msb = { workspace = true }
puddle-vm-tests = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util", "time"] }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
