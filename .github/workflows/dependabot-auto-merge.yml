# SPDX-License-Identifier: AGPL-3.0-or-later
# Arms auto-merge on a Dependabot PR whose updates are all patch or minor (cargo and npm only), so it goes
# through the same required checks and merge queue as any PR. The decision is ci/dependabot-auto-merge.sh.
# pull_request_target runs this file and the script from develop, never from the PR; the checkout takes
# only that script from develop, and the PR's code is never checked out or run. An armed PR can still miss the merge
# queue; merge-queue-sweep.yml queues it.
name: dependabot-auto-merge

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  arm:
    name: arm auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          sparse-checkout: ci/dependabot-auto-merge.sh
          persist-credentials: false
      - name: arm auto-merge for patch and minor updates
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: ci/dependabot-auto-merge.sh "$PR"
