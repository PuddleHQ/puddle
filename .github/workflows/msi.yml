# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds Puddle's per-user MSI on a clean windows-2025 runner and tests it the way a user meets it:
# a silent install, the installed program starting and finding its runtime, an upgrade over the
# previous MSI that keeps the data folder, the installed program's real test boot, a workspace made
# from the stock image that runs a command and is deleted, and an uninstall that leaves nothing
# outside Puddle's own data folders (ci/msi-install-test.ps1). A runner without a usable hypervisor
# skips the boot steps with a warning, except on a pull request, where that fails (as vm-windows). Not a required check: it runs on pull requests that
# touch the installer (paths below), nightly on develop (skipped when this workflow already has a
# green run on the commit), and by hand. The MSI of the run is kept as an artifact.
#
# The `upgrade` job tests the upgrade a user makes, on a machine of its own: it installs the last
# release's MSI (ci/fetch-baseline-msi.sh; while there is none, the MSI the newest green develop
# run kept), makes a workspace and writes files to it, upgrades to this run's build, and checks that
# the workspace starts with its files intact under the newer runtime (ci/msi-install-test.ps1
# -BaselineMsi).
#
# The `usable` job is the "usable" bar (install, create, approve, edit, build, push) with no person: it installs the MSI
# this run built, per user, starts the installed app, and drives its real window with Windows UI Automation, plus the REST API for what
# no screen shows (crates/puddle-app/e2e/usable.mjs, uia.mjs, uia.ps1; a release build has no DevTools port): an SSH remote is refused with the explicit message, a workspace
# is created from the lab's own Git forge (Gitea's Windows release, pinned: Forgejo ships none; its account,
# token and certificate are made for the run, so no outside host, account or
# secret is used and a pull request from a fork can run it), requests are approved in the inbox, the browser
# editor opens in its own window, a real `npm run build` and `npm test` run in the workspace, and `git push`
# reaches Forgejo with the injected credential while no token is in the guest, the audit log or the API.
# What only a person can still check (SmartScreen, a company network, how it reads) is not here. A red nightly opens
# "Nightly red: msi" through nightly-signal.yml. Never retried.
name: msi

on:
  schedule:
    - cron: "47 3 * * *"
  pull_request:
    branches: [develop, main]
    paths:
      - .github/workflows/msi.yml
      - ci/build-msi.sh
      - ci/msi-install-test.ps1
      - ci/fetch-baseline-msi.sh
      - ci/fetch-tauri-cli.sh
      - ci/fetch-retry.sh
      - ci/tauri-cli.sha256
      - ci/msb-runtime.sha256
      - ci/code-server.sha256
      - crates/puddle-app/tauri.conf.json
      - crates/puddle-app/wix/**
      - crates/puddle-app/build.rs
      - crates/puddle-app/e2e/usable.mjs
      - crates/puddle-app/e2e/uia.mjs
      - crates/puddle-app/e2e/uia.ps1
      - ci/fetch-forgejo.sh
      - ci/forgejo.sha256
      - crates/puddle-e2e/src/lab/forgejo.rs
      - crates/puddle-e2e/src/bin/puddle-lab-forgejo.rs
  workflow_dispatch:
    inputs:
      msi_run_id:
        description: "Run only the usable job, on the MSI that this earlier run of the workflow kept (skips the build)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: msi-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  msi:
    name: msi (build, install, upgrade, uninstall)
    if: ${{ inputs.msi_run_id == '' }}
    runs-on: windows-2025
    timeout-minutes: 90
    # `actions: read` for ci/should-run.sh.
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install-test helpers (self-test)
        shell: pwsh
        run: ./ci/msi-install-test.ps1 -SelfTest
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh msi.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-about@0.9.2
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Tauri command line (pinned, checksum-verified)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          ci/fetch-tauri-cli.sh "$RUNNER_TEMP/tauri-cli"
          cygpath -w "$RUNNER_TEMP/tauri-cli" >>"$GITHUB_PATH"
      - name: UI build (the shell embeds it)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cd ui && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: stage the runtime, code-server, agent and CLI
        if: steps.changed.outputs.run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/build-msi.sh stage "$RUNNER_TEMP/msi-stage"
      # The workspace's own version, then the next patch: the upgrade test installs the first and
      # upgrades to the second. Only the first MSI is kept: the second carries the same program
      # under a newer package version, so its `puddle --version` would not match its file name.
      - name: build the shell (release)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: ci/build-msi.sh shell "$RUNNER_TEMP/msi-stage"
      - name: pack the MSI and a newer one for the upgrade test
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          current=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          next=${current%.*}.$(( ${current##*.} + 1 ))
          echo "current=$current next=$next"
          ci/build-msi.sh bundle "$RUNNER_TEMP/msi-stage" "$RUNNER_TEMP/msi-out" "$current"
          ci/build-msi.sh bundle "$RUNNER_TEMP/msi-stage" "$RUNNER_TEMP/msi-upgrade" "$next"
          ls -l "$RUNNER_TEMP/msi-out" "$RUNNER_TEMP/msi-upgrade"
          echo "FIRST_MSI=$(cygpath -w "$RUNNER_TEMP/msi-out/Puddle_${current}_x64_en-US.msi")" >>"$GITHUB_ENV"
          echo "NEXT_MSI=$(cygpath -w "$RUNNER_TEMP/msi-upgrade/Puddle_${next}_x64_en-US.msi")" >>"$GITHUB_ENV"
      - name: install, start, boot a workspace, upgrade, uninstall
        if: steps.changed.outputs.run == 'true'
        shell: pwsh
        run: ./ci/msi-install-test.ps1 -Msi $env:FIRST_MSI -UpgradeMsi $env:NEXT_MSI -LogDir "$env:RUNNER_TEMP\msi-logs"
      - name: upload the MSI
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puddle-msi
          path: ${{ runner.temp }}/msi-out/*.msi
          retention-days: 14
          if-no-files-found: ignore
      # For the upgrade job only: the same program as the kept MSI, under the next package version.
      - name: upload the newer MSI for the upgrade job
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puddle-msi-next
          path: ${{ runner.temp }}/msi-upgrade/*.msi
          retention-days: 1
          if-no-files-found: ignore
      - name: upload the installer logs
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puddle-msi-logs
          path: ${{ runner.temp }}/msi-logs
          retention-days: 14
          if-no-files-found: ignore

  upgrade:
    name: upgrade (from the last release, a workspace with files)
    needs: msi
    # Runs although the install test failed: the MSIs are kept by then, and the two say different things.
    if: ${{ !cancelled() && needs.msi.outputs.run == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 60
    # `actions: read` to download the MSI an earlier run kept.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the MSI a user upgrades from (the last release)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msi=$(ci/fetch-baseline-msi.sh "$RUNNER_TEMP/msi-baseline" | tail -n 1)
          echo "BASELINE_MSI=$(cygpath -w "$msi")" >>"$GITHUB_ENV"
      - name: this run's build, under the next package version
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: puddle-msi-next
          path: ${{ runner.temp }}/msi-next
      - name: install the older build, make a workspace with files, upgrade, start it, check the files
        shell: pwsh
        run: |
          $next = Get-ChildItem "$env:RUNNER_TEMP\msi-next" -Filter *.msi | Select-Object -First 1
          ./ci/msi-install-test.ps1 -BaselineMsi $env:BASELINE_MSI -UpgradeMsi $next.FullName -LogDir "$env:RUNNER_TEMP\msi-logs"
      - name: what the app and the runtime logged
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'msi-logs\runtime-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\puddle" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -lt 5MB } | Select-Object -First 60 |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $logs ($_.FullName.Substring($env:LOCALAPPDATA.Length).TrimStart('\') -replace '[\\/:]', '_')) }
      - name: upload the installer and runtime logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: puddle-msi-upgrade-logs
          path: ${{ runner.temp }}/msi-logs
          retention-days: 14
          if-no-files-found: ignore

  usable:
    name: "usable (installed app: create, approve, editor, build, push)"
    needs: msi
    # Runs although the install test failed: the MSI is kept by then, and the two say different things.
    if: ${{ !cancelled() && (needs.msi.outputs.run == 'true' || inputs.msi_run_id != '') }}
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      FORGE_NAME: forgejo.lab.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WHP preflight (infrastructure)
        id: whp
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $whp = (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State
          "HypervisorPresent=$($cs.HypervisorPresent) HypervisorPlatform=$whp"
          if ($cs.HypervisorPresent -and "$whp" -eq 'Enabled') {
            "ok=true" >> $env:GITHUB_OUTPUT
          } else {
            # Same policy as vm-windows.yml and ci/vm-skip-policy.sh.
            $reason = "Windows Hypervisor Platform is not usable on this runner (HypervisorPresent=$($cs.HypervisorPresent), HypervisorPlatform=$whp)"
            if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
              "::error title=usable cannot run::$reason; a pull request must not pass without running it"
              exit 1
            }
            "::warning title=usable skipped::$reason; the run did not happen (infrastructure, not a test result)"
            "ok=false" >> $env:GITHUB_OUTPUT
          }
      - name: the MSI this run built
        if: ${{ steps.whp.outputs.ok == 'true' && inputs.msi_run_id == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: puddle-msi
          path: ${{ runner.temp }}/msi
      - name: the MSI an earlier run kept (by hand, msi_run_id)
        if: ${{ steps.whp.outputs.ok == 'true' && inputs.msi_run_id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: puddle-msi
          path: ${{ runner.temp }}/msi
          run-id: ${{ inputs.msi_run_id }}
          github-token: ${{ github.token }}
      - name: Node (the driver)
        if: steps.whp.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # Forgejo has no Windows release: the lab runs Gitea's (the project Forgejo forked from) through the same fixture.
      - name: the lab's Git forge for Windows (pinned release; download, verify)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: |
          ci/fetch-forgejo.sh "$(cygpath -u "$RUNNER_TEMP")/forge" "" windows
          {
            echo "PUDDLE_FORGEJO_BIN=$(cygpath -w "$RUNNER_TEMP/forge/forgejo.exe")"
            echo "PUDDLE_REQUIRE_FORGEJO=1"
          } >> "$GITHUB_ENV"
          "$RUNNER_TEMP/forge/forgejo.exe" --version
      - name: the lab Forgejo program (puddle-e2e)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        run: cargo build --locked -p puddle-e2e --bin puddle-lab-forgejo
      - name: name the forge's host; a folder for the run's output
        if: steps.whp.outputs.ok == 'true'
        shell: pwsh
        run: |
          # The name points at this machine, as a company's internal name would through its DNS. The usable run
          # starts the forge itself (a step's background processes do not outlive it) and puts its root in the
          # machine's store before the app starts.
          Add-Content -LiteralPath "$env:SystemRoot\System32\drivers\etc\hosts" -Value "127.0.0.1 $env:FORGE_NAME"
          ipconfig /flushdns | Out-Null
          $out = Join-Path $env:RUNNER_TEMP 'usable-out'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "USABLE_OUT=$out" >> $env:GITHUB_ENV
          "USABLE_FORGE_NAME=$env:FORGE_NAME" >> $env:GITHUB_ENV
          "USABLE_LAB_BIN=$((Resolve-Path 'target\debug\puddle-lab-forgejo.exe').Path)" >> $env:GITHUB_ENV
      - name: install the MSI per user
        if: steps.whp.outputs.ok == 'true'
        shell: pwsh
        run: |
          $msi = Get-ChildItem "$env:RUNNER_TEMP\msi" -Filter *.msi | Select-Object -First 1
          $log = Join-Path $env:USABLE_OUT 'msiexec.log'
          $p = Start-Process msiexec.exe -ArgumentList @('/i', "`"$($msi.FullName)`"", '/qn', '/norestart', '/l*v', "`"$log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec exited with $($p.ExitCode); see $log" }
          Get-ChildItem "$env:LOCALAPPDATA\Programs\Puddle" | Select-Object -First 20 Name
      - name: the usable run (installed app, through its window)
        if: steps.whp.outputs.ok == 'true'
        shell: bash
        timeout-minutes: 60
        run: node crates/puddle-app/e2e/usable.mjs
      - name: stop the lab Forgejo, remove its root and hosts line
        if: ${{ always() && steps.whp.outputs.ok == 'true' }}
        shell: pwsh
        run: |
          Get-Process puddle-app, msb -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          certutil -delstore Root "Puddle lab Forgejo root" | Out-Null
          # What the app and the runtime logged, for a failed run.
          if (-not $env:USABLE_OUT) { exit 0 }
          $logs = Join-Path $env:USABLE_OUT 'runtime-logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          Get-ChildItem "$env:LOCALAPPDATA\puddle" -Recurse -Filter *.log -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -lt 5MB } | Select-Object -First 60 |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $logs ($_.FullName.Substring($env:LOCALAPPDATA.Length).TrimStart('\') -replace '[\\/:]', '_')) }
      - name: upload screenshots and logs
        if: ${{ always() && steps.whp.outputs.ok == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: usable-run
          path: |
            ${{ runner.temp }}/usable-out/*.png
            ${{ runner.temp }}/usable-out/*.log
            ${{ runner.temp }}/usable-out/*.out
            ${{ runner.temp }}/usable-out/uia-tree-*.txt
            ${{ runner.temp }}/usable-out/forgejo-server.log
            ${{ runner.temp }}/usable-out/runtime-logs/**
          retention-days: 14
          if-no-files-found: ignore
