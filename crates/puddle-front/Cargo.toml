[package]
name = "puddle-front"
description = "The browser editor's front: one loopback listener that routes <workspace>.localhost to the editor server in a workspace's guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
getrandom = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
puddle-agent-proto = { workspace = true }
puddle-fs = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-ports = { workspace = true }
puddle-types = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
puddle-test-kit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
