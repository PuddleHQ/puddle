# SPDX-License-Identifier: AGPL-3.0-or-later
# The real-tool radar (tests named `vm_radar_*`): apt, npm, pnpm, cargo, go and maven fetch thousands of
# packages from the real registries through the whole stack in a real microVM, and the tools' answer
# to a certificate they refuse is recorded. It discovers; it never blocks a merge (it is not a required
# check). Every failure is triaged into a deterministic case of the transparency suite
# (crates/puddle-e2e/tests/transparency.rs, the vm_host_transparency_* VM test) and fixed there.
# The private-feeds tests (vm_feeds.rs) get their own step, and a second job runs them on Windows (WHP).
# Runs weekly on develop, by hand on any branch (`gh workflow run full-test.yml --ref <branch>`), and
# on a pull request when it gets the `full-test` label. Never retried.
name: full-test

on:
  schedule:
    - cron: "7 4 * * 0"
  pull_request:
    branches: [develop]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the label too: another label added to the pull request starts a run that skips its job,
# and must not cancel a radar that is running.
concurrency:
  group: full-test-${{ github.ref }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  PUDDLE_VM_MSB_LOG_LEVEL: debug

jobs:
  radar:
    name: real-tool radar (KVM, msb microVMs)
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'full-test' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/kvm
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (fork tag; download, verify)
        run: |
          ci/fetch-msb.sh "$RUNNER_TEMP/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$RUNNER_TEMP/msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$RUNNER_TEMP/pvm" >> "$GITHUB_ENV"
      - name: code-server (pinned release; download, verify)
        run: |
          ci/fetch-code-server.sh "$RUNNER_TEMP/code-server"
          echo "PUDDLE_CODE_SERVER_DIR=$RUNNER_TEMP/code-server" >> "$GITHUB_ENV"
      - name: guest agent (static musl build)
        # build-agent.sh prints a path relative to the repository root; nextest runs each test with the
        # crate's directory as its cwd, so the host would look for it there and report the agent missing.
        run: echo "PUDDLE_AGENT_BIN=$PWD/$(ci/build-agent.sh --locked)" >> "$GITHUB_ENV"
      - name: private feeds (npm, pip, NuGet, Maven with and without a credential; credential provider; token placements)
        run: |
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo nextest run -p puddle-host --profile vm --locked --no-fail-fast --no-tests=fail \
              -E 'test(/(^|::)vm_radar_(private_feeds|artifacts_credential_provider|token_placements)_/)'
      - name: Squid (the company proxy of the tools-through-a-proxy radar test)
        run: |
          ci/apt-setup.sh
          ci/apt-retry.sh sudo apt-get update
          ci/apt-retry.sh sudo apt-get install -y --no-install-recommends squid
          # The package starts its own daemon; the test runs its own Squid on a free port.
          sudo systemctl stop squid || true
          test -x /usr/sbin/squid
          echo "PUDDLE_SQUID_BIN=/usr/sbin/squid" >> "$GITHUB_ENV"
          echo "PUDDLE_REQUIRE_SQUID=1" >> "$GITHUB_ENV"
      - name: the radar (one test at a time, never retried)
        run: |
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo nextest run -p puddle-host --profile vm --locked --no-fail-fast \
              -E 'test(/(^|::)vm_radar_/) & not test(/(^|::)vm_radar_forgejo_/) & not (test(/(^|::)vm_radar_(private_feeds|artifacts_credential_provider|token_placements)_/))'
      - name: stage msb logs that still exist
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          src="$RUNNER_TEMP/pvm"
          dest="$RUNNER_TEMP/msb-logs"
          mkdir -p "$dest"
          if [ ! -d "$src" ]; then
            echo "::warning::no msb run home at $src, so no sandbox logs to upload (expected when the run was cancelled)"
            exit 0
          fi
          cd "$src" || exit 0
          while IFS= read -r -d '' f; do
            mkdir -p "$dest/$(dirname "$f")" 2>/dev/null && cp "$f" "$dest/$f" 2>/dev/null || true
          done < <(find . -path '*/logs/*' -type f -print0 2>/dev/null || true)
      - name: upload test results and msb logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-test-results
          path: |
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/msb-logs/**
          retention-days: 14
          if-no-files-found: ignore

  private-feeds-windows:
    name: private feeds (windows-2025, WHP)
    if: ${{ github.event_name != 'pull_request' || github.event.label.name == 'full-test' }}
    runs-on: windows-2025
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WHP preflight
        shell: pwsh
        run: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $whp = (Get-WindowsOptionalFeature -Online -FeatureName HypervisorPlatform).State
          "HypervisorPresent=$($cs.HypervisorPresent) HypervisorPlatform=$whp"
          if (-not ($cs.HypervisorPresent -and "$whp" -eq 'Enabled')) {
            "::error title=no hypervisor::Windows Hypervisor Platform is not usable on this runner"
            exit 1
          }
      - name: Toolchain (from rust-toolchain.toml)
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: private-feeds-windows
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.146
      - name: msb runtime (fork tag release assets; download, verify)
        shell: bash
        run: |
          dir=$(cygpath -w "$RUNNER_TEMP")
          ci/fetch-msb.sh "$(cygpath -u "$RUNNER_TEMP")/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$dir\\msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$dir\\pvm" >> "$GITHUB_ENV"
      - name: guest agent (static musl build)
        shell: bash
        run: echo "PUDDLE_AGENT_BIN=$(cygpath -w "$PWD/$(ci/build-agent.sh --locked)")" >> "$GITHUB_ENV"
      - name: private feeds (the Linux guest on WHP; same tests as the Linux job)
        shell: bash
        run: |
          PUDDLE_VM_PREFIX="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            cargo nextest run -p puddle-host --profile vm --locked --no-fail-fast --no-tests=fail \
              -E 'test(/(^|::)vm_radar_(private_feeds|artifacts_credential_provider|token_placements)_/)'
      - name: upload test results and msb logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: private-feeds-windows-results
          path: |
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
