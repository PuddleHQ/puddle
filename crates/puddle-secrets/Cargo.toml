# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-secrets"
description = "where Puddle gets a secret on the host: signed-in gh, Git Credential Manager, a pasted token in the OS store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = { workspace = true }
keyring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber = { workspace = true }

# A stand-in for `gh` and `git` that the tests copy next to a behaviour file. A binary, so the
# same tests run on Windows, where a shell script is not an executable.
[[bin]]
name = "puddle-fake-tool"
path = "tests/support/fake_tool.rs"
test = false

[lints]
workspace = true
