# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "puddle-settings"
description = "Puddle's settings model: global settings, per-workspace overrides, consents, schema versions and migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The managed mise layer (dormant in v0.1). Without it `Tools::mise()` is false whatever is
# stored, so every piece of the layer stays off and hidden. Build with `--features mise` on `puddle`
# or `puddle-app` (they forward it) to turn it back on; nothing is deleted.
mise = []

[dependencies]
puddle-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
