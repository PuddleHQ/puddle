# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-about: third-party notices for Puddle's own dependency tree (`cargo xtask notices`).
# `accepted` mirrors deny.toml's licence allow list: cargo-deny decides what may be used, this
# only says which licence of an `OR` expression to attribute. Our own crates are publish = false.
accepted = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
# The platforms Puddle ships for (host on Windows, guest agent on Linux musl) and develops on.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
private = { ignore = true }
