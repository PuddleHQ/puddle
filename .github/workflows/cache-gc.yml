# SPDX-License-Identifier: GPL-3.0-or-later
# Keeps the Actions caches under the repo's 10 GB cap (ci/cache-gc.sh): drops superseded rust-cache
# entries on develop, stale task-branch caches and every merge queue cache, so the cargo-xwin cache
# is never evicted.
#
# What the repo keeps (compressed sizes as GitHub reports them, 2026-10-24; the Rust entries grow and
# shrink with the dependency tree). Only develop saves them, pull requests restore:
#
#   entry                                        saved by (develop only)              GiB
#   rust-cache `linux`                           every push that changes it (ci)    6.66
#   rust-cache `windows`                         nightly, a push that changes a manifest
#                                                (windows, windows-cache)           1.94
#   Playwright browsers                          a push (ci)                        0.37
#   cargo-xwin CRT and SDK (never deleted here)  a push (ci)                        0.13
#   npm caches, Linux and Windows                a push; pull refs 2-day cleanup    0.34
#   rust-cache `fuzz`                            a fuzz run (fuzz)                  0.17
#   licence notices stamp (one per input hash)   a push that ran the gate (ci)        0.00
#   total wanted                                                                    9.61 of 10
#
# The Linux msb is no cache entry: the VM jobs download the fork release's prebuilt one
# (ci/fetch-msb.sh); a leftover `msb-linux-*` entry ages out (ci/cache-gc.sh drops orphans after 7 days).
#
# The nightly release build keeps no Rust cache: its 1.55 GiB entry was saved once a night, the
# 2026-10-24 nightly found none, and while it existed the wanted set was 11.2 GiB, over the 10 GiB
# cap for good (9.85 GiB sat under it without an eviction). The VM workflows keep no Rust cache
# either: their archive build missed on every one of the last 22 pull requests, and restoring the
# `linux` entry (exact) saved 9 s of a 150 s build for a 70 s restore, the `windows` one about 30 s
# of 390 s for a 41 s restore.
#
# A replacement of the `linux` entry holds the old and the new one together (6.7 GiB each), which is over
# the cap; GitHub then evicts entries without a log. The develop run that saves the replacement deletes the
# entry it restored right after rust-cache's save (ci/cache-drop.sh, run by .github/actions/cache-drop; its
# test lists the guards), so the overrun lasts seconds. Deleting it earlier would leave pull requests no
# entry to restore (a cold build takes about 35 minutes of a job limited to 30). This workflow deletes any
# other superseded entry right after the run.
#
# Seconds can still be enough: on 2026-10-26 a develop save of the `linux` entry (4.7 GiB) found the 7.1 GiB one
# it replaced already evicted at 15:15 (cache-drop: "already gone"), and the repo went from 13 entries to 2 while
# this workflow logged 10285 MB and had nothing to delete. That total was under 10 GiB, and totals of 10.3 to
# 10.7 GB sat for hours on the same day without an eviction, so the number this workflow prints is not the
# trigger and a lower cap in this script would have deleted nothing either. What fits is the replacement
# arithmetic: every other entry (about 4.1 GB) plus two `linux` entries must stay under 10 GiB, which needs
# a `linux` entry under about 3.1 GiB; at 4.8 to 5.1 GiB it does not fit.
#
# GitHub publishes no eviction log: on 2026-10-24 the cargo-xwin entry (a miss costs a 12-minute CRT
# download in a job limited to 30) and the `linux` entry were both gone while the repo sat at 10.5 to 12 GiB,
# and the develop runs between 06:41 and 07:03 UTC ran into the job limit.
# ci.yml saves the `linux` entry whenever its restore was not an exact hit, so a lost one costs the
# next develop run, not every pull request until the next dependency change.
name: cache-gc

on:
  schedule:
    - cron: "45 3 * * *"
  # Right after a develop run that may have saved a new entry, so the superseded one (1-4 GB) does
  # not wait for the nightly run, and right after a merge queue run of a required workflow, whose
  # npm, cargo-xwin or msb entries only a rerun of that queue entry could read.
  workflow_run:
    workflows: [ci, windows, windows-cache, vm-linux, vm-windows]
    types: [completed]
    branches: [develop, "gh-readonly-queue/**"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cache-gc
  cancel-in-progress: false

jobs:
  gc:
    name: delete superseded caches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: delete superseded and stale caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/cache-gc.sh | tee -a "$GITHUB_STEP_SUMMARY"
