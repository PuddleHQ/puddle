# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-compute"
description = "Compute plane: sandbox and volume traits, the msb fake and the contract suite every runtime passes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
puddle-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[features]
# FakeRuntime: an in-memory msb for unit tests of the crates above the compute plane.
fake = ["tokio/io-util"]
# The contract suite every Runtime implementation runs (contract::run_all, contract_tests!).
contract = ["tokio/io-util", "tokio/macros", "tokio/rt", "tokio/time"]

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
tempfile = { workspace = true }

[[test]]
name = "contract_fake"
required-features = ["fake", "contract"]

[lints]
workspace = true
