# SPDX-License-Identifier: GPL-3.0-or-later
# cargo-deny: licences, advisories, bans, sources. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# A RustSec vulnerability, unmaintained or unsound advisory fails the check for any dependency, direct or
# transitive, as does a yanked crate. `unmaintained` and `unsound` default to "workspace" (direct
# dependencies of workspace members only), so both are set to "all". An exception goes in `ignore`
# with the advisory ID, a reason and a review date.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # Unmaintained, not vulnerable: bincode 2 comes in through the msb SDK (fork tag
    # v0.7.8-puddle.2: microsandbox-filesystem, msb_krun). Still there; review at each
    # fork bump, by 2027-01-06.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; transitive via the pinned msb SDK" },
    # rsa timing side channel (Marvin), no fixed release. Comes in through the SDK's `ssh` feature
    # (russh, ssh-key). Puddle's SSH server listens only on an owner-only local pipe/socket
    # with an ed25519 host key; the attack needs remote timing observation; review when the SSH endpoint
    # changes and at each SDK/fork bump, by 2027-01-06.
    { id = "RUSTSEC-2023-0071", reason = "rsa Marvin attack; transitive via the msb SDK's russh, local-only SSH" },
    # Unmaintained proc macro (build time only, Linux only): glib-macros 0.18 -> gtk 0.18 -> tauri's
    # wry/tao on Linux. tauri 2 stays on gtk-rs 0.18 until tauri 3 (alpha); nothing of it
    # runs at runtime. Review at each tauri bump, by 2027-01-06.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; build-time dependency of tauri's gtk-rs 0.18 on Linux" },
    # zstd 0.13.3 and zstd-safe 7.3.0, held by the libkrun fork's `msb_krun_vmm` 0.1.41 (fork tag
    # msb_krun-v0.1.41-puddle.4); the 0.14 copy is fixed in Cargo.lock. The fork's only zstd call is
    # `zstd::stream::copy_decode` (src/vmm/src/builder.rs:2488, x86_64 non-Windows): it decompresses
    # the guest kernel file that the host itself passes in, through `Decoder::new` (a fresh
    # context), and nothing else names zstd. So no advisory API is reached: not `with_context`
    # (0391), not seekable, dictionaries, `try_clone`, multithreaded contexts, `train_from_buffer`,
    # `OutBuffer::around_pos`, `InBuffer::pos` or `CParameter` (0395 to 0402, 0404 to 0406). 0403
    # needs a corrupt legacy frame written through `zstd::stream::write::Decoder`; the fork reads
    # through the read-side decoder, and a decode error is ignored by `let _ =` but leaves a truncated kernel that `load_elf64_kernel` then rejects, so the boot fails. The input is never guest or
    # network data. Remove with the fork's bump to zstd 0.14.3; review by 2027-01-06.
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13.3 reused-context leak (raw::Decoder::with_context and Encoder::with_context); fork decodes the host's kernel file with one fresh Decoder::new; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0395", reason = "zstd-safe 7.3.0, CCtx::set_parameter with CParameter::StableInBuffer (use-after-free); the fork never builds a CCtx, it only decompresses; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0396", reason = "zstd-safe 7.3.0, seekable::Seekable and SeekTable (NULL seek table); the fork has no seekable code, and nothing enables the seekable feature; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0397", reason = "zstd-safe 7.3.0, OutBuffer::around_pos (uninitialized memory); zstd 0.13.3's decoder only calls OutBuffer::around on a fixed slice; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.3.0, seekable::Seekable::decompress and AdvancedSeekable::decompress (Vec length past capacity); no seekable code in the fork; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0399", reason = "zstd-safe 7.3.0, CCtx::init_using_cdict and DCtx::init_using_ddict (dictionary use-after-free); the fork never loads a dictionary, Decoder::new passes an empty one; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0400", reason = "zstd-safe 7.3.0, DCtx::decompress, decompress_using_dict and decompress_using_ddict on a context with an open stream; the fork only streams, through one fresh Decoder, and never makes a one-shot call; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0401", reason = "zstd-safe 7.3.0, zstd_safe::train_from_buffer (dictionary training, overflow); the fork never trains a dictionary; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0402", reason = "zstd-safe 7.3.0, CCtx::try_clone on a multithreaded context; the fork has no compression context and never clones one; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.3.0, DCtx::decompress_stream on a corrupt legacy frame leaks stale heap through zstd::stream::write::Decoder; the fork uses the read-side Decoder (copy_decode), which the advisory names as unaffected, on a host-supplied kernel file; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0404", reason = "zstd-safe 7.3.0, DCtx::try_clone (double free); the fork never clones a decompression context; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0405", reason = "zstd-safe 7.3.0, seekable::SeekableCStream::compress_stream with an out-of-range InBuffer::pos; the fork has no seekable or compression code; removal: when the msb fork moves to zstd 0.14" },
    { id = "RUSTSEC-2026-0406", reason = "zstd-safe 7.3.0, CCtx::load_dictionary, ref_cdict, ref_prefix, disable_dictionary, reset and set_parameter with NbWorkers; the fork has no compression context and never enables zstdmt workers; removal: when the msb fork moves to zstd 0.14" },
    # zbus_names, zvariant and zvariant_derive are unmaintained as standalone crates (merged into
    # zbus 6). They are only the Linux Secret Service client: keyring 4.2 ->
    # zbus-secret-service-keyring-store 1.0.1 -> secret-service 5.2.0 -> zbus 5.19. The newest
    # secret-service release still needs zbus 5, so no fixed version exists. Not vulnerable. Review
    # when secret-service or the keyring store moves to zbus 6, by 2027-01-06.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; transitive via keyring's Secret Service store (zbus 5), no migration path yet" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; transitive via keyring's Secret Service store (zbus 5), no migration path yet" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; transitive via keyring's Secret Service store (zbus 5), no migration path yet" },
    # Unsound `glib::VariantStrIter` (undefined behaviour in its iterator methods): glib 0.18 -> gtk 0.18
    # -> tauri's wry/tao, Linux only. Only `Variant::array_iter_str` creates one and no crate in the Linux
    # build graph calls it. tauri 2 stays on gtk-rs 0.18 (the fix is glib 0.20 or later) until tauri 3
    # (alpha). Review at each tauri bump, by 2027-01-06.
    { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsound; unused API, transitive via tauri's gtk-rs 0.18 on Linux" },
]

[licenses]
# Licences that may be combined into a GPL-3.0-or-later program. Anything else fails until
# reviewed. GPL-2.0-only, AGPL, EPL, CDDL, SSPL and similar are deliberately absent.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "LGPL-3.0-only",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "Unlicense",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are `publish = false`; they are GPL-3.0-or-later (checked by the SPDX gate).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Puddle's own forks, and only these repositories: the msb SDK at its fork tag, and the
# libkrun and russh forks that the msb fork patches in (repeated in Puddle's `[patch.crates-io]`).
# Not `allow-org`: a new repository under TijsVK must be added here on purpose.
allow-git = [
    "https://github.com/TijsVK/microsandbox",
    "https://github.com/TijsVK/libkrun",
    "https://github.com/TijsVK/russh",
    "https://github.com/TijsVK/imago",
]
