# SPDX-License-Identifier: GPL-3.0-or-later
# Says when ci/lab/overrides.txt can be deleted: ci/lab-override-check.py reads the latest mitmproxy release's
# declared bounds from PyPI and fails when it allows the version the override pins. A failure opens
# "Nightly red: lab-override" through nightly-signal.yml and a green run closes it. Not a required check and never
# run on a pull request. A PyPI outage is no failure: the script prints that it checked nothing and exits 0.
name: lab-override

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-override
  cancel-in-progress: false

jobs:
  check:
    name: lab override check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - name: check
        run: python3 -I ci/lab-override-check.py
