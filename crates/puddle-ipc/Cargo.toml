# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-ipc"
description = "Per-workspace host endpoints (named pipe / Unix socket) that only the current user can open"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = { workspace = true }
puddle-fs = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(windows)'.dev-dependencies]
puddle-fs = { workspace = true, features = ["testing"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
