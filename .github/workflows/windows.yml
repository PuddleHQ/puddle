# SPDX-License-Identifier: AGPL-3.0-or-later
# Native Windows MSVC build and tests. It runs on every pull request to develop and main (a
# required check on develop), on every merge queue run, nightly (skipped when this workflow already has a green run on
# develop's head), and by hand. Linux CI already cross-checks clippy for the msvc target.
# Clippy, tests and UI run on every trigger; the release build runs only on the nightly, on pull
# requests to main and on manual runs from develop, so a pull request to develop skips it. The jobs
# run side by side, so the run takes as long as the slowest one instead of the sum: the tests are built once
# (`test-build`, a nextest archive) and run on four runners (`tests`), the doc tests and the secret scan have a
# job (`docs`), and the UI is split into Edge end-to-end (`ui-e2e`) and the rest (`ui-unit`). Two cache entries
# (debug builds, clippy's check builds); only runs on develop save them. The release build has none.
# A pull request runs only the jobs its changed files can affect (ci/scope.sh, the `scope` job):
# no Rust, fixture or UI path skips clippy and tests, no UI-relevant path skips the UI job. Every
# other trigger, and any doubt, runs everything; the result job accepts a skip only when `scope`
# said so. A merge queue run is scoped by the group's diff against develop.
# With the repository variable PUDDLE_QUEUE set to `on`, a pull request to develop skips clippy
# and UI here (the light mode, ci/scope.sh) and the merge queue runs them on the commit that
# lands; the result job still reports. The test jobs (`test-build`, `tests`, `docs`) run on every pull request that changes
# Rust or fixtures (a Windows-only failure then shows on the pull request, not first in the queue),
# and again in the queue. A pull request with no such path skips it, and the result job accepts that.
# Unset, every pull request runs all of them.
# With the repository variable PUDDLE_TIER set to `on`, a merge queue run also skips the native
# clippy job and the whole UI job (they run nightly and on a pull request to main) unless the
# group's diff touches a path that can break them (ci/scope.sh `escalates`: crates/puddle-app, any
# path with `windows` in its name, this workflow). The result job accepts the skip and its summary
# says the check is not a test result for them. The test jobs stay in the queue, where each partition's nextest stops at its first failure (--max-fail 1).
# The nightly also reruns each failed test once and lists the ones that pass only on retry
# (ci/flaky-report.py); it never turns the run red. The nightly gate (ci/should-run.sh --events) counts
# only nightly and manual runs as "already green" for every job, so a merge queue run on develop's
# commit never stops the flake report, the release build, clippy or the UI job. A pull request run
# never counts either.
name: windows

on:
  schedule:
    - cron: "37 2 * * *"
  pull_request:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a PR or task branch stop; develop's (the nightly, a dispatch) run to the end, each in its own group so none is dropped as a pending run.
concurrency:
  group: windows-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, while the 100+ test binaries link much faster and
  # the cache stays smaller (the same setting as ci.yml and the VM workflows).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which jobs this pull request needs (ci/scope.sh; it falls open to "all" on any doubt). Checks out
  # only ci/, so it costs a few seconds.
  scope:
    name: scope (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      win_rust: ${{ steps.scope.outputs.win_rust }}
      ui: ${{ steps.scope.outputs.ui }}
      defer_win_ui: ${{ steps.scope.outputs.defer_win_ui }}
      defer_win_clippy: ${{ steps.scope.outputs.defer_win_clippy }}
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: which jobs does this change need?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
        run: ci/scope.sh
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  clippy:
    name: windows clippy
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.win_rust != 'false' && needs.scope.outputs.light != 'true' && needs.scope.outputs.defer_win_clippy != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 30
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # Its own entry: check builds (rmeta) of the dependencies, so a pull request compiles only
      # the workspace. Only develop saves it; cache-gc.yml deletes the superseded one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows-clippy
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - name: clippy
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: scripts/check.sh clippy
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # The tests are compiled once here and run from the archive in the partition jobs below. This job saves
  # the `windows` entry (on develop), which the doc tests and both UI jobs restore.
  test-build:
    name: windows tests (build, test archive)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.win_rust != 'false' }}
    runs-on: windows-2025
    # Compiling and linking the test binaries takes about 6.5 min with a warm cache (7 min measured in a
    # merge group); a cold cache (any Cargo.lock change) is far longer.
    timeout-minutes: 45
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # One entry for the debug builds (this job saves it); only develop saves, and cache-gc.yml
      # deletes the superseded one (10 GB cap for the whole repo).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows
          cache-on-failure: true # a red build must not forfeit the dependencies
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      - name: build the tests once (nextest archive)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cargo nextest archive --workspace --all-features --locked --profile ci --archive-file "$RUNNER_TEMP/bundle/tests.tar.zst"
      # The UI jobs' desktop shell smoke test builds `-p puddle-app`, whose dependency features
      # differ from the workspace build above, so it compiled 130+ crates each run. Building it
      # here puts them in the entry this job saves (only develop saves, so only develop pays).
      - name: desktop shell dependencies (for the entry the UI jobs restore)
        if: ${{ steps.changed.outputs.run == 'true' && github.ref == 'refs/heads/develop' }}
        shell: bash
        run: cargo build -p puddle-app --all-features --locked
      - name: share the archive with the partition jobs
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-tests-build
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          compression-level: 0 # the archive is already compressed
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # Four runners run the archive side by side (nextest `--partition hash:`: a test's partition follows its name, so
  # a new test never moves the others). Each runner makes its own second-user account and runs its own mitmproxy.
  # The job is not skipped when the build job found nothing new (a nightly on a green commit): its steps are, so
  # the result job sees a success and not a skip it would have to explain.
  tests:
    name: windows tests (nextest, partition ${{ matrix.partition }} of 4)
    needs: test-build
    if: ${{ !cancelled() && needs.test-build.result == 'success' }}
    runs-on: windows-2025
    # About 4.3 min of tests across all four partitions, plus the steps before them (a few minutes).
    timeout-minutes: 30
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.test-build.outputs.run == 'true'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: needs.test-build.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      # One test (puddle-runtime's dev_override) runs `cargo check --offline` on the workspace, so the
      # pinned toolchain and the downloaded crates must be here although nothing is compiled by the job itself.
      - name: Toolchain and crate sources (for the one test that runs cargo)
        if: needs.test-build.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && cargo fetch --locked
      # The corporate-lab fixtures (crates/puddle-e2e/src/lab) run mitmproxy as the NTLM proxy and the
      # TLS interceptor; pinned with hashes in ci/lab/requirements.txt (Dependabot's uv entry bumps it).
      - name: mitmproxy for the corporate-lab fixtures
        if: needs.test-build.outputs.run == 'true'
        shell: bash
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/lab-venv"
          "$RUNNER_TEMP/lab-venv/Scripts/python.exe" -m pip install --require-hashes --no-deps --quiet -r ci/lab/requirements.txt
          "$RUNNER_TEMP/lab-venv/Scripts/mitmdump.exe" --version
          echo "PUDDLE_MITMDUMP_BIN=$(cygpath -w "$RUNNER_TEMP/lab-venv/Scripts/mitmdump.exe")" >> "$GITHUB_ENV"
      # Some runs have minutes in which every program start is 10 to 30 times slower (mitmproxy,
      # git, browser tests time out together; tests that start nothing do not). The canary times a
      # trivial start every 2 s through the tests, and the step after them prints the counts, the
      # runner image and the Defender state, so each run says whether it had such a window.
      - name: process start canary
        if: needs.test-build.outputs.run == 'true'
        shell: pwsh
        run: Start-Process -WindowStyle Hidden pwsh -ArgumentList '-NoProfile', '-File', 'ci/start-canary.ps1', '-Out', (Join-Path $env:RUNNER_TEMP 'start-canary.txt')
      # The first start of node.exe on a fresh runner reads it from a slow disk: 2 to 8 s idle, 10 to 19 s
      # in the canary_github_auth tests while the other tests read their binaries, and 30 s or more once
      # (a failed merge group, 2026-11-10). Starting it here, idle, puts it in memory (ci/warm-node.ps1).
      - name: warm up node
        if: needs.test-build.outputs.run == 'true'
        shell: pwsh
        run: ./ci/warm-node.ps1
      # A hung download would hold the job until its job limit (the same stall cost vm-linux 39 minutes once). Each download gets a step
      # limit (the archive 8 minutes; the slowest seen on this runner is under 2), then one more try that fails the job when it also fails.
      - name: the test archive from the build job
        id: archive
        if: needs.test-build.outputs.run == 'true'
        timeout-minutes: 8
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests-build
          path: ${{ runner.temp }}/bundle
      - name: the test archive from the build job (second try)
        if: needs.test-build.outputs.run == 'true' && steps.archive.outcome != 'success'
        timeout-minutes: 8
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-tests-build
          path: ${{ runner.temp }}/bundle
      - name: tests (partition ${{ matrix.partition }} of 4)
        if: needs.test-build.outputs.run == 'true'
        shell: bash
        env:
          # The nightly retries a failed test once, only to report flakes (below). The profile
          # keeps retries at 0 for every other run (docs/STANDARDS.md, "Flaky tests").
          RETRIES: ${{ github.event_name == 'schedule' && '1' || '0' }}
          PARTITION: ${{ matrix.partition }}
          PARTITIONS: ${{ strategy.job-total }}
          # The hostile-guest second-user tests make a local account; if the hosted runner stops
          # allowing that, they fail here instead of skipping without a trace.
          PUDDLE_REQUIRE_SECOND_USER: "1"
          # A test whose prerequisite is missing fails here instead of skipping (scripts/check-silent-skips.sh).
          # Each flag names what this runner provides: the Windows credential store, python3, and the
          # machine-editing tests' own opt-in (CI is set, GITHUB_ACTIONS is set).
          PUDDLE_REQUIRE_OS_CREDENTIAL_STORE: "1"
          PUDDLE_REQUIRE_TOOLS: "1"
          PUDDLE_REQUIRE_STORE_TESTS: "1"
          PUDDLE_REQUIRE_REGISTRY_TESTS: "1"
          # mitmproxy from the step above: the TLS interceptor and the NTLM proxy of the corporate-lab tests.
          PUDDLE_REQUIRE_MITMPROXY: "1"
          # The queue stops at the first failure: the group is removed anyway, so the rest of the
          # run only delays the next group. A pull request and the nightly run every test.
          MAX_FAIL: ${{ github.event_name == 'merge_group' && '1' || '' }}
        # The archive is unpacked into the checkout, where the build job's test binaries had their paths
        # (cargo bakes the workspace and binary paths into them). cargo-nextest runs directly, so the
        # rustup proxy never sets RUSTUP_TOOLCHAIN for the tests; the one that runs cargo (dev_override)
        # then synced the runner's `stable` and failed on its rust-src component. Pin it from
        # rust-toolchain.toml, as `cargo nextest` through the proxy did.
        run: |
          RUSTUP_TOOLCHAIN="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          [ -n "$RUSTUP_TOOLCHAIN" ] || { echo "no channel in rust-toolchain.toml"; exit 1; }
          export RUSTUP_TOOLCHAIN
          cargo-nextest nextest run --profile ci --retries "$RETRIES" ${MAX_FAIL:+--max-fail "$MAX_FAIL"} \
            --archive-file "$(cygpath -m "$RUNNER_TEMP")/bundle/tests.tar.zst" \
            --extract-to "$(cygpath -m "$PWD")" --workspace-remap . \
            --partition "hash:${PARTITION}/${PARTITIONS}"
      - name: process start canary (summary)
        if: ${{ needs.test-build.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        continue-on-error: true
        run: ./ci/start-canary.ps1 -Summary (Join-Path $env:RUNNER_TEMP 'start-canary.txt')
      # The test kit picks its quiet ports in 20000..32000. This prints the excluded and dynamic TCP
      # ranges of the runner and says QUIET PORT RANGE HIT when one overlaps that span.
      - name: TCP port ranges
        if: ${{ needs.test-build.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        continue-on-error: true
        run: |
          ./ci/port-ranges.ps1 -SelfTest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./ci/port-ranges.ps1
      # A cert-store call that hangs wedges the machine for the tests behind it. The hang is rare and
      # the test log alone does not show what held, so a red run records the processes, the
      # cryptographic service and the CAPI2 and Application events of the last 10 minutes.
      - name: what held the machine (processes, CryptSvc, CAPI2 events)
        if: ${{ failure() && needs.test-build.outputs.run == 'true' }}
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output '--- processes and the busiest ones ---'
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'powershell|pwsh|certutil|puddle|windows_store' } |
            Select-Object ProcessId, ParentProcessId, Name, CreationDate, CommandLine | Format-List
          Get-Process | Sort-Object CPU -Descending | Select-Object -First 15 Id, ProcessName, CPU, WorkingSet | Format-Table -AutoSize
          Write-Output '--- CryptSvc ---'
          Get-Service CryptSvc | Format-List Name, Status, StartType
          $since = (Get-Date).AddMinutes(-10)
          foreach ($log in 'Microsoft-Windows-CAPI2/Operational', 'Application') {
            Write-Output "--- $log, last 10 minutes ---"
            Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = $since } -MaxEvents 200 -ErrorAction SilentlyContinue |
              ForEach-Object { '{0:s} {1} {2} {3}' -f $_.TimeCreated, $_.Id, $_.LevelDisplayName, (($_.Message -replace '\s+', ' ')[0..300] -join '') }
          }
      - name: flaky tests (nightly report)
        if: ${{ github.event_name == 'schedule' && needs.test-build.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: python3 ci/flaky-report.py target/nextest/ci/junit.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - name: upload test results
        if: ${{ needs.test-build.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-results-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # The doc tests and the secret scan compile no test binary of the archive, so they run beside the partitions.
  docs:
    name: windows doc tests and secret scan
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.win_rust != 'false' }}
    runs-on: windows-2025
    timeout-minutes: 30
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows # saved by the test build job
          save-if: false
      - name: doc tests
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cargo test --doc --workspace --all-features --locked --no-fail-fast
      - name: gitleaks download cache (the script still checks the pin)
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gitleaks-cache
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/gitleaks.sha256') }}
      # Windows runs this one gate of the Linux job too: it proves ci/fetch-gitleaks.sh and the
      # gate work in Git Bash with the Windows release, where developers' pre-push hook runs.
      - name: secret scanning (gitleaks, Windows release)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        run: |
          GITLEAKS_CACHE_DIR="$HOME/gitleaks-cache" ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" scripts/check.sh secrets
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # The two UI jobs run side by side. Each stops the storage service and keeps Edge's files on the runner's temp
  # disk, since the Edge stalls (StorSvc, the system disk) hit any job that starts a browser or the shell.
  ui-e2e:
    name: windows UI (end-to-end on Edge)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ui != 'false' && needs.scope.outputs.light != 'true' && needs.scope.outputs.defer_win_ui != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 40
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    steps:
      - name: stop the storage service (it scans the disk and stalls the tests)
        shell: pwsh
        # StorSvc reads the whole MFT (about 1.3 GB) roughly ten minutes after Explorer starts, and the
        # e2e tests stall behind that read on hosted runners (measured: with the service stopped the
        # read never appears). The runner is thrown away after the job. An already stopped service is fine.
        run: |
          Stop-Service StorSvc -Force -ErrorAction SilentlyContinue
          Set-Service StorSvc -StartupType Disabled
          Get-Service StorSvc | Format-List Name, Status, StartType
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows # saved by the test build job
          save-if: false
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI end-to-end (Playwright on the installed Edge, axe)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        # Edge's profile, its downloads and Playwright's artifacts go to the temp folder, which is on
        # the system disk (C:) by default. That disk takes a few hundred I/O operations a second and
        # Edge, Defender and Windows Update together queue 20 to 40 of them (measured on windows-2025):
        # a page load, a download or Edge's first start then stalls for 5 to 35 s while the CPU idles.
        # The runner's temp folder is on the local temp disk (D:), which keeps up. A stopgap for the
        # runner image: drop it when a run without it shows no stall (first start under 5 s, a download
        # event under 1 s) after a windows-2025 image update.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: scripts/check.sh ui-e2e
      - name: upload UI end-to-end results
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-e2e-results
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  ui-unit:
    name: windows UI (unit tests, certificate, desktop shell smoke)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ui != 'false' && needs.scope.outputs.light != 'true' && needs.scope.outputs.defer_win_ui != 'true' }}
    runs-on: windows-2025
    timeout-minutes: 40
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    steps:
      - name: stop the storage service (it scans the disk and stalls the tests)
        shell: pwsh
        # StorSvc reads the whole MFT (about 1.3 GB) roughly ten minutes after Explorer starts, and the
        # e2e tests stall behind that read on hosted runners (measured: with the service stopped the
        # read never appears). The runner is thrown away after the job. An already stopped service is fine.
        run: |
          Stop-Service StorSvc -Force -ErrorAction SilentlyContinue
          Set-Service StorSvc -StartupType Disabled
          Get-Service StorSvc | Format-List Name, Status, StartType
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the UI diff-coverage gate needs the base commit
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          shared-key: windows # saved by the test build job
          save-if: false
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI (format, lint, types, unit and component tests with coverage, build)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: scripts/check.sh ui
      # The development certificate in the three browsers the runner image has: the trust dialog is
      # answered No (each browser must show its certificate warning for the leaf), then Yes (each
      # must load the page with no warning). The throwaway runner may take the click; a person's
      # machine never does.
      - name: development certificate in Edge, Chrome and Firefox (trust dialog answered No, then Yes)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: bash
        env:
          PUDDLE_REQUIRE_BROWSER_TRUST: "1"
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --workspace --all-features --locked --test windows_browsers -- --nocapture
      # The desktop shell starts on the installed WebView2 and its main window shows the SPA from
      # the in-process backend; driven over WebView2's DevTools Protocol, no extra tools. First on
      # the in-memory fixture (the first-run flow and a seeded request), then on the Puddle host.
      - name: desktop shell smoke test (WebView2, fixture backend)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          cargo build -p puddle-app --all-features --locked
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          node crates/puddle-app/e2e/smoke.mjs
      # A workspace window on a page the test serves attacks the shell like hostile editor script
      # would: no Tauri command may succeed, in the window or in the second one it opens.
      - name: workspace window attack test (WebView2)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          node crates/puddle-app/e2e/sandbox-window.mjs
      # What the real webview keeps under a workspace's origins: storage and a cookie on
      # `<id>.localhost` and `<port>.<id>.localhost` survive a restart on the same id, a new id
      # starts empty, and a delete removes the data (five runs of the shell over one data folder).
      - name: workspace origins test (WebView2)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          node crates/puddle-app/e2e/origins.mjs
      # What the terminal screen's key rules assume of WebView2, with
      # real input (SendInput): Ctrl+Shift+V and Shift+Insert fire `paste`, Ctrl+R and F5 with the keydown
      # cancelled do not reload, Ctrl+Q quits with no terminal open and asks first with some. The WebKitGTK half runs in ci.yml.
      - name: terminal paste, key-cancel and Ctrl+Q test (WebView2)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          node crates/puddle-app/e2e/terminal-keys.mjs
      # The host needs the bundled runtime beside the program (the fork's msb.exe and libkrunfw.dll,
      # checksums pinned); no machine boots, so WHP is not needed.
      - name: desktop shell smoke test (WebView2, Puddle host)
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        shell: pwsh
        run: |
          bash ci/fetch-msb.sh target/debug/runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PUDDLE_APP_EXE = Join-Path $PWD 'target\debug\puddle-app.exe'
          $env:SMOKE_BACKEND = 'host'
          node crates/puddle-app/e2e/smoke.mjs
      - name: upload UI unit test results
        if: ${{ steps.changed.outputs.run == 'true' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ui-unit-results
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # Nightly, pull requests to main and manual runs from develop only: it compiles everything a
  # second time, which a pull request to develop does not need. It keeps no Rust cache: the 1.6 GB
  # entry was gone when the nightly looked for it and held the repo over its 10 GB cap
  # (cache-gc.yml); a cold build took 21 minutes of the 45 on 2026-10-24.
  release:
    name: windows release build
    if: >-
      ${{ github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
    runs-on: windows-2025
    timeout-minutes: 45
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh windows.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: rustup toolchain install && rustc --version
      # The binaries embed ui/build, so it is built first, as the release build always saw it.
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: UI build (embedded in the release binaries)
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cd ui && npm ci --ignore-scripts --no-audit --no-fund && npm run build
      - name: release build
        if: steps.changed.outputs.run == 'true'
        shell: bash
        run: cargo build --workspace --release --locked
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # One stable result for the jobs above. The release build is skipped on a pull request to
  # develop, a merge queue run and a manual run from a task branch (its own `if:`); a skipped job
  # counts as passed there. The scoped jobs may be skipped on a pull request or a merge queue run
  # only when `scope` said so, or in the light mode (`queue`; ci/scope.sh verdict), and `always()`
  # makes this job report whatever happened. The develop ruleset requires it by this name: a rename
  # changes the ruleset in the same change.
  windows:
    name: windows-msvc (build, clippy, tests)
    needs: [scope, clippy, test-build, tests, docs, ui-e2e, ui-unit, release]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh verdict clippy=win_rust,queue,defer:defer_win_clippy test-build=win_rust tests=win_rust docs=win_rust ui-e2e=ui,queue,defer:defer_win_ui ui-unit=ui,queue,defer:defer_win_ui
