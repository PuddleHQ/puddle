[package]
name = "sbx-tools"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies.windows-sys]
version = "=0.61.2"
features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization",
  "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Hypervisor", "Win32_System_Memory",
  "Win32_System_SystemServices", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem",
]

[profile.release]
