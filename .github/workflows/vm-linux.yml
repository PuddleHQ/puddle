# SPDX-License-Identifier: GPL-3.0-or-later
# VM tests on Linux KVM (tier K): crate puddle-vm-tests under `nextest --profile vm`, real
# msb microVMs on the hosted runner. It runs on every pull request to develop (a required check there) and to main,
# on every merge queue run, by hand on any branch (`gh workflow run vm-linux.yml --ref <branch>`) and
# nightly on develop unless it already has a green nightly or manual run on that commit
# (a merge queue run or a light pull request run never counts, so the soak tests still run). VM tests are never retried; a
# runner without KVM is reported as an infrastructure skip, not a test result, except on a pull
# request or a merge queue run, where it fails the job (a required check must not pass without
# running VM tests; ci/vm-skip-policy.sh).
# A pull request to develop or a merge queue run whose changed files cannot reach a VM test skips every job here
# (ci/scope.sh, the `scope` job); the result job accepts that skip only when `scope` said so. With the
# repository variable PUDDLE_QUEUE set to `on`, a pull request to develop skips them too (the light
# mode) and the merge queue runs them on the commit that lands.
# The test binaries are built once (`cargo nextest archive`) and the tests run in four partitions
# on four runners at once; `vm-linux (KVM, msb microVMs)` is the one result of all of them.
name: vm-linux

on:
  schedule:
    - cron: "7 3 * * *"
  pull_request:
    branches: [develop, main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      parallel_runs:
        description: "Test runs at once on each partition's runner, each with its own prefix and msb home (1-3)"
        default: "1"
        type: choice
        options: ["1", "2", "3"]

permissions:
  contents: read

# A newer push to the same pull request or task branch stops the run in flight (its result would be about a commit that is
# no longer the head); develop's runs (the nightly, a dispatch) run to the end, each in its own group so none is dropped.
concurrency:
  group: vm-linux-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces keep file:line, builds and the cache stay much smaller.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Crates with VM tests: the harness smoke, the msb adapter (contract suite, memory),
  # the boot hook, the workspace lifecycle, shutdown and reconcile, the whole host.
  VM_CRATES: -p puddle-vm-tests -p puddle-compute-msb -p puddle-boot -p puddle-workspace -p puddle-lifecycle -p puddle-host --package=puddle
  # msb's sandbox runtimes log at debug, and the harness keeps each removed sandbox's logs beside
  # the run home, so a boot that fails keeps its VMM trace and kernel.log in the artefact.
  PUDDLE_VM_MSB_LOG_LEVEL: debug

jobs:
  # Which jobs this pull request needs (ci/scope.sh; it falls open to "all" on any doubt). Checks out
  # only ci/, so it costs a few seconds.
  scope:
    name: scope (changed files)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      vm: ${{ steps.scope.outputs.vm }}
      light: ${{ steps.scope.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: which jobs does this change need?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
        run: ci/scope.sh
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  build:
    name: vm-linux build (test archive, guest agent)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.vm != 'false' && needs.scope.outputs.light != 'true' }}
    # `actions: write` for ci/cancel-group.sh (it covers the read ci/should-run.sh needs; a separate gate job would be billed a full minute).
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      run: ${{ steps.changed.outputs.run }}
    steps:
      # A runner that starts nearly full ends in "No space left on device" in its own log, with the job log lost;
      # this line shows the free space and the image of the runner a failed job had. A normal runner starts with
      # about 86 GB free, and a test job writes about 13 GB (measured 2026-10-31).
      - name: disk at start (evidence, never a gate)
        run: |
          df -h /
          echo "runner=${RUNNER_NAME} image=${ImageVersion:-unknown}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh vm-linux.yml --events schedule,workflow_dispatch
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install && rustc --version
      # No Rust cache here: this job's nextest archive build restored an entry on 0 of the last 22 pull
      # requests, and with the ci entry restored (exact) it was no faster than a cold build, so the
      # restore only cost time and the repo's 10 GB cap more space (cache-gc.yml, budget table).
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.changed.outputs.run == 'true'
        with:
          tool: cargo-nextest@0.9.146
      # The runtime is the fork release's prebuilt Linux msb, downloaded and checked against
      # ci/msb-runtime.sha256 (a few seconds). Only a tag with no Linux msb pinned is built from
      # source (about 10 minutes, with a warning annotation).
      # The runtime folder the Linux packages will ship (msb, both firmware names, runtime.json),
      # built by `cargo xtask runtime --msb` from this msb. The test jobs run on the msb folder, not
      # on it; this only keeps the layout honest (ci/check-runtime-layout.sh).
      - name: runtime folder layout (cargo xtask runtime --msb)
        if: steps.changed.outputs.run == 'true'
        run: |
          ci/fetch-msb.sh "$RUNNER_TEMP/msb"
          ci/check-runtime-layout.sh "$RUNNER_TEMP/msb" "$RUNNER_TEMP/runtime-layout"
      - name: guest agent (static musl build)
        if: steps.changed.outputs.run == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          cp "$(ci/build-agent.sh --locked)" "$RUNNER_TEMP/bundle/puddle-agent"
      - name: build the VM tests once (nextest archive)
        if: steps.changed.outputs.run == 'true'
        run: cargo nextest archive $VM_CRATES --profile vm --locked --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst"
      - name: share the archive and the agent with the test jobs
        if: steps.changed.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-linux-build
          path: ${{ runner.temp }}/bundle
          retention-days: 1
          compression-level: 0 # the archive is already compressed
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  tests:
    name: vm-linux tests (partition ${{ matrix.partition }} of 4)
    needs: build
    if: needs.build.outputs.run == 'true'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    # ~67 VM tests in all, each partition a hash-quarter of them (the longest of three took 11.8 minutes, of four 10.0,
    # paired on one build); every test has its own 12-minute cap.
    # Three limits, each inside the next, so a hang ends in a named failure with its log uploaded
    # instead of the job's timeout (a cancelled job skips the steps that would keep the evidence):
    # nextest's deadline for the whole run (VM_TEST_DEADLINE), the test step's own limit as the
    # backstop if nextest cannot end, then this job limit. Change them together: the steps before
    # the tests (under a minute) plus the step limit must leave the steps after it a few minutes.
    timeout-minutes: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 60 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      # A runner that starts nearly full ends in "No space left on device" in its own log, with the job log lost;
      # this line shows the free space and the image of the runner a failed job had. A normal runner starts with
      # about 86 GB free, and a test job writes about 13 GB (measured 2026-10-31).
      - name: disk at start (evidence, never a gate)
        run: |
          df -h /
          echo "runner=${RUNNER_NAME} image=${ImageVersion:-unknown}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: KVM preflight (infrastructure)
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            ci/vm-skip-policy.sh vm-linux "/dev/kvm is missing on this runner" || exit 1
            echo "### vm-linux partition ${{ matrix.partition }}: SKIPPED, no /dev/kvm on the runner (infrastructure)" >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Hosted runners ship /dev/kvm root-only; open it to the runner user.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sleep 1
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.kvm.outputs.ok == 'true'
        with:
          tool: cargo-nextest@0.9.146
      # The runtime is the SDK's fork tag (ci/msb-tag.sh, from Cargo.lock): the release's Linux msb,
      # downloaded and checked against ci/msb-runtime.sha256.
      - name: msb runtime (fork tag; download, verify)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          ci/fetch-msb.sh "$RUNNER_TEMP/msb"
          echo "PUDDLE_VM_RUNTIME_DIR=$RUNNER_TEMP/msb" >> "$GITHUB_ENV"
          echo "PUDDLE_VM_ROOT=$RUNNER_TEMP/pvm" >> "$GITHUB_ENV"
      # The browser editor's server, mounted read-only into the guests that the host tests start.
      - name: code-server (pinned release; download, verify)
        if: steps.kvm.outputs.ok == 'true'
        run: |
          ci/fetch-code-server.sh "$RUNNER_TEMP/code-server"
          echo "PUDDLE_CODE_SERVER_DIR=$RUNNER_TEMP/code-server" >> "$GITHUB_ENV"
      - name: the test archive and the guest agent from the build job
        if: steps.kvm.outputs.ok == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vm-linux-build
          path: ${{ runner.temp }}/bundle
      # The browser client (node and Chromium, crates/puddle-vm-tests/src/browser.rs) is installed only on a
      # partition that runs a `vm_browser_*` test: nextest hashes each test to a partition by its name alone, so
      # listing the partition's share tells. Chromium is the build the UI jobs use (ui/package-lock.json pins
      # Playwright), restored from their cache entry and never saved here.
      - name: does this partition run a browser test?
        id: browser
        if: steps.kvm.outputs.ok == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/vmx"
          listed=$(cargo-nextest nextest list --profile vm \
            --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst" \
            --extract-to "$RUNNER_TEMP/vmx" --extract-overwrite --workspace-remap . \
            --partition hash:${{ matrix.partition }}/4 \
            -E 'test(/(^|::)vm_browser_/)' --message-format oneline)
          echo "$listed"
          if [ -n "$listed" ]; then echo "needed=true" >> "$GITHUB_OUTPUT"; else echo "needed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.browser.outputs.needed == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Playwright browsers cache (the UI jobs' entry)
        id: browsers
        if: steps.browser.outputs.needed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: browser client (Playwright driver and Chromium)
        if: steps.browser.outputs.needed == 'true'
        timeout-minutes: 10
        run: |
          ci/apt-setup.sh
          cd ui
          npm ci --ignore-scripts --no-audit --no-fund
          ../ci/apt-retry.sh npx playwright install-deps chromium
          if [ "${{ steps.browsers.outputs.cache-hit }}" != true ]; then
            npx playwright install chromium
          fi
          echo "PUDDLE_VM_BROWSER_MODULES=$PWD/node_modules" >> "$GITHUB_ENV"
      # Every test on one runner ran 4 to 6 times slower than usual once (a slow host, not a hang): the
      # figures show a slow runner at the top of the log, before the tests it slows down.
      - name: runner speed (evidence, never a gate)
        if: steps.kvm.outputs.ok == 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: ci/runner-speed.sh | tee "$RUNNER_TEMP/runner-speed.txt"
      - name: VM tests (tier K, partition ${{ matrix.partition }} of 4)
        if: steps.kvm.outputs.ok == 'true'
        timeout-minutes: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 52 || 32 }}
        env:
          RUNS: ${{ inputs.parallel_runs || '1' }}
          VM_TEST_DEADLINE: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && '48m' || '28m' }}
        run: |
          chmod +x "$RUNNER_TEMP/bundle/puddle-agent"
          export PUDDLE_AGENT_BIN="$RUNNER_TEMP/bundle/puddle-agent"
          # cargo-nextest is called directly: through `cargo` it would make rustup install the
          # pinned toolchain here, which an archive run never needs.
          mkdir -p "$RUNNER_TEMP/vmx"
          # Real-machine tests (vm_machine_*) run in ci/windows-e2e.ps1, and the real-tool radar (vm_radar_*) in full-test.yml, not here. The soak (vm_soak_*, a 15-minute idle SSH session) runs on the nightly and on a dispatch only. Each run gets its
          # own prefix, so its sandbox names and private msb home never meet another run's.
          base="r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FILTER='not (test(/(^|::)vm_machine_/) | test(/(^|::)vm_radar_/) | test(/(^|::)vm_soak_/))'
          case "$GITHUB_EVENT_NAME" in schedule | workflow_dispatch) FILTER='not (test(/(^|::)vm_machine_/) | test(/(^|::)vm_radar_/))' ;; esac
          # At the deadline nextest stops the test still running, names it and writes junit.xml.
          # The other users of the vm profile (the radar, the real-machine run) need longer, so the
          # deadline comes from this job, as a tool config below the repository's.
          printf '[profile.vm]\nglobal-timeout = "%s"\n' "$VM_TEST_DEADLINE" > "$RUNNER_TEMP/vm-deadline.toml"
          nextest() {
            PUDDLE_VM_PREFIX="$1" cargo-nextest nextest run --profile vm \
              --tool-config-file "vm-deadline:$RUNNER_TEMP/vm-deadline.toml" \
              --archive-file "$RUNNER_TEMP/bundle/vm-tests.tar.zst" \
              --extract-to "$RUNNER_TEMP/vmx" --extract-overwrite --workspace-remap . \
              --partition hash:${{ matrix.partition }}/4 \
              -E "$FILTER"
          }
          if [ "$RUNS" = "1" ]; then
            # nextest writes to a file that the upload keeps (the job log is lost when the job is
            # cancelled), and tail shows it here as it grows, until nextest exits. The file exists
            # before tail opens it, and a tail failure never ends the step early: nextest would go
            # on running under the steps that follow.
            log="$RUNNER_TEMP/vm-tests.log"
            : > "$log"
            nextest "$base" > "$log" 2>&1 &
            run=$!
            tail -n +1 -f --pid="$run" "$log" || true
            wait "$run"
            exit
          fi
          pids=""
          for i in $(seq 1 "$RUNS"); do
            nextest "$base-$i" > "$RUNNER_TEMP/run-$i.log" 2>&1 &
            pids="$pids $!"
          done
          rc=0
          for pid in $pids; do wait "$pid" || rc=1; done
          for i in $(seq 1 "$RUNS"); do
            echo "::group::run $i ($base-$i)"; cat "$RUNNER_TEMP/run-$i.log"; echo "::endgroup::"
          done
          exit "$rc"
      - name: memory and processes after a failed or stopped run
        if: ${{ (failure() || cancelled()) && steps.kvm.outputs.ok == 'true' }}
        # Best effort: a starved runner must not cost the upload after it.
        timeout-minutes: 3
        continue-on-error: true
        run: |
          # What was still running (a VM process that outlived its test, a stuck test) and how much
          # memory was left; printed here and kept with the results. Command lines only for the
          # run's own programs (test binaries, msb), which carry no secrets.
          {
            free -m
            ps -eo pid=,ppid=,rss=,etimes=,comm= --sort=-rss | head -40 | while read -r pid ppid rss age name; do
              exe=$(readlink "/proc/$pid/exe" 2>/dev/null || true)
              case "$exe" in
                "$RUNNER_TEMP"/vmx/* | "$RUNNER_TEMP"/msb/*) cmd=$({ tr '\0' ' ' < "/proc/$pid/cmdline"; } 2>/dev/null || true) ;;
                *) cmd="$name" ;;
              esac
              printf 'pid %s ppid %s rss %s MiB age %s s: %s\n' "$pid" "$ppid" "$((rss / 1024))" "$age" "$cmd"
            done
          } 2>&1 | tee "$RUNNER_TEMP/vm-processes.txt"
      # Names the tests that failed or were stopped as annotations on this job. The merge queue cancels
      # the run when a job fails, and a cancelled job keeps only its annotations, so this is where the
      # result job finds the name.
      - name: name the failed and stopped tests
        if: ${{ failure() && steps.kvm.outputs.ok == 'true' }}
        timeout-minutes: 2
        continue-on-error: true
        run: ci/vm-tests-report.sh log "$RUNNER_TEMP/vm-tests.log" "${{ matrix.partition }}"
      - name: upload test results and msb logs
        if: ${{ always() && steps.kvm.outputs.ok == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-linux-results-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/vmx/target/nextest/vm/junit.xml
            target/nextest/vm/junit.xml
            ${{ runner.temp }}/vm-tests.log
            ${{ runner.temp }}/run-*.log
            ${{ runner.temp }}/vm-processes.txt
            ${{ runner.temp }}/runner-speed.txt
            ${{ runner.temp }}/pvm/**/logs/**
          retention-days: 14
          if-no-files-found: ignore
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # One stable result for the build and every partition.
  # The develop ruleset requires it by this name: a rename changes the ruleset in the same change.
  # A pull request or a merge queue run may skip them all only when `scope` said so, or in the light
  # mode (`queue`), and a nightly when the commit already has a green run (ci/scope.sh verdict); the
  # KVM/WHP infrastructure skip is a skipped step inside a passing job, not a skipped job.
  vm-linux:
    name: vm-linux (KVM, msb microVMs)
    needs: [scope, build, tests]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      # A cancelled partition (the queue cancels the run when one job fails) is only the word `cancelled`
      # in the verdict below; this prints which test each partition named before it went.
      - name: which tests failed or were stopped
        if: ${{ always() && needs.tests.result != 'success' && needs.tests.result != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/vm-tests-report.sh run "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
      - name: every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh verdict --nightly-skips build=vm,queue tests=vm,queue
