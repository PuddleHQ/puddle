[package]
name = "puddle-workspace"
description = "Workspace volume lifecycle: one named disk volume per workspace, attach tracking, trim, checked delete (ADR 0006)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
puddle-compute = { workspace = true }
puddle-types = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
puddle-test-kit = { workspace = true }
microsandbox = { workspace = true }
puddle-boot = { workspace = true }
puddle-compute = { workspace = true, features = ["fake"] }
puddle-compute-msb = { workspace = true }
puddle-ipc = { workspace = true }
puddle-proxy = { workspace = true, features = ["testing"] }
puddle-vm-tests = { workspace = true }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[lints]
workspace = true
