# SPDX-License-Identifier: GPL-3.0-or-later
# Backstop for pull requests that are armed for auto-merge and green but never enter the merge queue: GitHub does not
# always hand an armed pull request to a ruleset queue (seen on a Dependabot PR armed with the workflow token, which sat
# green for 2 h until it was disarmed and armed again). Every 10 minutes ci/merge-queue-sweep.sh asks GitHub to merge
# each such PR's head commit, which adds it to the queue. Reads PR metadata only and never checks out or runs PR code.
# A scheduled run executes the copy on the default branch (develop).
name: merge-queue-sweep

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-queue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: queue armed PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          sparse-checkout: ci/merge-queue-sweep.sh
          persist-credentials: false
      - name: add armed, green PRs that are not queued
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/merge-queue-sweep.sh
