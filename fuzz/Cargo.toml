# SPDX-License-Identifier: AGPL-3.0-or-later
# cargo-fuzz targets for what a guest's first bytes reach. Not a
# member of the root workspace (it needs a nightly toolchain and libFuzzer), so the stable gates
# never build it; `.github/workflows/fuzz.yml` runs it nightly. Each target's checked-in corpus under
# `corpus/` is replayed on stable by the crates' own tests (`fuzz_corpus`).
[package]
name = "puddle-fuzz"
version = "0.0.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = "1.5"
libfuzzer-sys = "0.4"
puddle-agent = { path = "../crates/puddle-agent" }
puddle-agent-proto = { path = "../crates/puddle-agent-proto", features = ["fuzzing"] }
puddle-proxy = { path = "../crates/puddle-proxy", features = ["fuzzing"] }
tokio = { version = "1.52", default-features = false, features = ["io-util", "net", "rt", "time"] }

[workspace]

[[bin]]
name = "head_parser"
path = "fuzz_targets/head_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "connect_target"
path = "fuzz_targets/connect_target.rs"
test = false
doc = false
bench = false

[[bin]]
name = "normalise_host"
path = "fuzz_targets/normalise_host.rs"
test = false
doc = false
bench = false

[[bin]]
name = "answer_tokens"
path = "fuzz_targets/answer_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_preamble"
path = "fuzz_targets/agent_preamble.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_line"
path = "fuzz_targets/resolve_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message"
path = "fuzz_targets/dns_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_message_grammar"
path = "fuzz_targets/dns_message_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_line_grammar"
path = "fuzz_targets/resolve_line_grammar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resolve_ask"
path = "fuzz_targets/resolve_ask.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_tcp_stream"
path = "fuzz_targets/dns_tcp_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dns_udp_datagram"
path = "fuzz_targets/dns_udp_datagram.rs"
