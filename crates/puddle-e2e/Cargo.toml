# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-e2e"
description = "End-to-end and hostile-guest test harness and the UI fixture backend; tests and dev only, no product code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The fixture backend serves the built SPA (`ui/build`) from inside the binary, like the app.
embedded-ui = ["puddle-api/embedded-ui"]

[[bin]]
name = "puddle-ui-fixture"
path = "src/bin/puddle-ui-fixture.rs"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
puddle-api = { workspace = true }
puddle-repos = { workspace = true }
puddle-secrets = { workspace = true }
puddle-settings = { workspace = true }
puddle-store = { workspace = true }
puddle-types = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { workspace = true }

[dev-dependencies]
h2 = { workspace = true }
http = { workspace = true }
puddle-agent = { workspace = true }
puddle-agent-proto = { workspace = true }
puddle-ca = { workspace = true }
puddle-compute = { workspace = true }
puddle-compute-msb = { workspace = true }
puddle-fd-limit = { workspace = true }
puddle-inject = { workspace = true, features = ["testing"] }
puddle-ipc = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-ports = { workspace = true }
puddle-proxy = { workspace = true, features = ["testing"] }
puddle-upstream = { workspace = true, features = ["testing"] }
puddle-vm-tests = { workspace = true }
futures-util = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
