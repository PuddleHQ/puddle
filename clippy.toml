# Tests may unwrap, expect, panic and index: a panic is how a test fails.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true

# Names from the Windows proxy stack that doc-markdown would want in backticks.
doc-valid-idents = ["WinINet", "WinHTTP", "WPAD", "PoC", "NTLM", "SSPI", "WebView2", "DevTools", "WebKitGTK", ".."]

# A name or path made from the clock or the pid collides across parallel test runs, and a shared temp
# folder is state two tests can both change. Counted for now: the workspace lint level is "allow" in the
# root Cargo.toml until the existing sites are moved, and scripts/flake-lints-test.sh runs the rule at
# "warn" to show it still flags the original code.
disallowed-methods = [
    { path = "std::env::temp_dir", reason = "make the file or folder with `tempfile` (a unique, self-removing path); the few production sites say why with #[expect(clippy::disallowed_methods, reason = \"...\")]" },
]
