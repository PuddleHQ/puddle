# Weekly, grouped into one PR per ecosystem to save CI minutes. PRs go to develop, labelled by ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    labels: ["dependencies", "rust"]
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels: ["dependencies", "github_actions"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # CI and engines pin Node 24; @types/node majors above it describe APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sveltejs/kit, svelte-check and typescript-eslint all peer on typescript 6 or lower. A 7 bump
      # cannot resolve ("Error while updating peer dependency") and fails the whole grouped job. Drop
      # this once all three accept 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /crates/puddle-api/openapi
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    groups:
      openapi-codegen:
        patterns: ["*"]
