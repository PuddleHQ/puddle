# SPDX-License-Identifier: AGPL-3.0-or-later
# Backstop for pull requests that are armed for auto-merge and green but never enter the merge queue: GitHub does not
# always hand an armed pull request to a ruleset queue (seen on a Dependabot PR armed with the workflow token, which sat
# green for 2 h until it was disarmed and armed again). ci/merge-queue-sweep.sh adds each such PR's head commit to the
# queue and checks that it got there. GitHub drops scheduled runs under load (two of the six hourly runs in 17 h fired), so
# the sweep also runs when a required workflow finishes: a PR goes green at that moment, and the run waits out the
# settle time first. Reads PR metadata only and never checks out or runs PR code.
# The same run also cancels the runs of merge groups the queue dissolved (ci/cancel-dissolved-groups.sh), which
# ci/cancel-group.sh cannot do because no job failed. A scheduled run executes the copy on the default branch (develop).
name: merge-queue-sweep

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_run:
    workflows: [ci, windows, vm-linux, vm-windows]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: merge-queue-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: queue armed PRs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          sparse-checkout: |
            ci/merge-queue-sweep.sh
            ci/cancel-dissolved-groups.sh
          persist-credentials: false
      - name: wait until a PR that just went green counts as settled
        if: github.event_name == 'workflow_run'
        run: sleep 150
      # A merge-queue entry added with the default GITHUB_TOKEN started no merge-group run (PR 768, 2026-11-09: queued 21:05Z by
      # github-actions[bot], no run in 95 min, dropped 22:40Z), so the entry is added as the GitHub App that coverage-baseline.yml
      # already uses (same variable and secret; Pull requests write is what enqueuePullRequest needs).
      - name: Token for the coverage baseline app
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.COVERAGE_BASELINE_CLIENT_ID }}
          private-key: ${{ secrets.COVERAGE_BASELINE_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: add armed, green PRs that are not queued
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # a run started by a finished workflow has waited 2.5 minutes, so a 2 minute settle time suffices
          SWEEP_MIN: ${{ github.event_name == 'workflow_run' && '2' || '10' }}
        run: ci/merge-queue-sweep.sh
      - name: cancel the runs of dissolved merge groups
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/cancel-dissolved-groups.sh
