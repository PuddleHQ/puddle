# SPDX-License-Identifier: AGPL-3.0-or-later
# The Rust unit tier of ci.yml (job `unit`), a reusable workflow so ci.yml stays under 1000 lines.
# Called from ci.yml; its `if` (scope verdict, event) lives on the calling job. The environment below is a copy of ci.yml's,
# because a called workflow does not inherit it: change both together.
name: ci-unit

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces and coverage keep file:line, while the test binaries that link
  # the msb SDK (puddle-vm-tests) stay small enough for the runner's disk (full debug info filled
  # it: `ld terminated with signal 7 [Bus error]`).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The commit the diff-coverage gate measures from: the PR's base, the merge queue's base, or the push's
  # previous head (empty or unknown, e.g. a new branch or a manual run: scripts/check.sh uses the merge
  # base with origin/develop).
  DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  # The light CI mode's Rust unit tier (PUDDLE_LIGHT_CI=on, ci/scope.sh `unit`): what a pull request to develop and a merge
  # queue run check in that mode instead of the `rust` and `gates` jobs (the `msvc` job still runs when a crate or fixture changed, scope `msvc`). Off the mode scope says `unit=false` and it
  # skips. It restores the `gates` job's Rust cache (its clippy, doc test and desktop shell builds cover these) and saves none.
  unit:
    name: unit (fmt, clippy, Rust unit tests)
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free disk space on a runner that starts low
        run: ci/free-disk.sh
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gates
          save-if: false
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2
      - name: apt package cache
        uses: ./.github/actions/apt-debs-cache
        with:
          name: gates
      # libayatana-appindicator3-1 and xvfb: the tray unit test opens the tray library at run time on a virtual display it starts itself.
      - name: System packages (WebKitGTK to compile the desktop shell; the tray library and Xvfb for its unit test)
        timeout-minutes: 10
        run: |
          ci/apt-setup.sh
          ci/apt-retry.sh sudo apt-get update
          ci/apt-retry.sh sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-1 xvfb
      - name: fmt
        run: scripts/check.sh fmt
      - name: quick gates (platform literals, silent skips, early-exit pipes, spawn, test hooks)
        if: ${{ !cancelled() }}
        run: scripts/check.sh platform-literals silent-skips early-exit-pipes spawn test-hooks
      - name: clippy (linux)
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy
      - name: cargo-deny (bans, licences, sources)
        if: ${{ !cancelled() }}
        run: scripts/check.sh deny
      - name: Rust unit tests (every crate's library tests, all features)
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --lib --all-features --locked
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group
