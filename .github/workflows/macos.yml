# SPDX-License-Identifier: GPL-3.0-or-later
# Clippy on macOS (aarch64-apple-darwin), so a break that only the macOS arms of the code can cause shows on the pull request or the
# next develop push instead of when someone first builds on a Mac. Those arms (autostart, certificate trust, proxy discovery, the
# doctor's macOS facts, the desktop shell's WKWebView link) compile nowhere else: Linux CI and the cross-checked msvc target never
# build them. This job is NOT a required check: it is not in the `develop` ruleset, so a red run warns and blocks nothing. Make it
# required only after a few weeks of green runs.
#
# Clippy only, no tests and no VMs: a hosted macOS runner has no Hypervisor.framework (hv_vm_create fails on macos-14, 15 and 26),
# so no msb microVM can start there; the bar for that is a real Mac. `macos-14` is Apple silicon (3 CPUs, 7 GB). Public repositories
# get hosted macOS minutes free; the pool is small (five concurrent macOS jobs for the repository), so a pull request run stops
# when a newer commit arrives and the job has a 40 minute limit. It keeps no Rust cache: the 10 GB Actions cache cap is already
# full (cache-gc.yml), and a cold clippy run builds check metadata only.
#
# Runs on: a pull request to develop that changes Rust, manifests or this workflow; a push to develop with the same paths; nightly
# (skipped when the commit already has a green run, ci/should-run.sh); by hand.
name: macos

on:
  schedule:
    - cron: "11 4 * * *"
  pull_request:
    branches: [develop]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "scripts/check.sh"
      - ".github/workflows/macos.yml"
  push:
    branches: [develop]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "clippy.toml"
      - "scripts/check.sh"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

# Superseded runs on a pull request stop; develop's (push, nightly, dispatch) run to the end, each in its own group.
concurrency:
  group: macos-${{ github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  clippy:
    name: macos clippy
    runs-on: macos-14
    timeout-minutes: 40
    # `actions: read` for ci/should-run.sh (the nightly's "already green" lookup).
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh macos.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install && rustc --version
      - name: clippy
        if: steps.changed.outputs.run == 'true'
        run: scripts/check.sh clippy
