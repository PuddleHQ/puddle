# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-ssh"
description = "SSH endpoint per workspace (serve_connection behind the readiness gate) and the ssh-bridge relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
puddle-boot = { workspace = true }
puddle-compute = { workspace = true }
puddle-ipc = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
puddle-test-kit = { workspace = true }
puddle-compute = { workspace = true, features = ["fake"] }
puddle-types = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[lints]
workspace = true
