# SPDX-License-Identifier: AGPL-3.0-or-later
# Nightly performance bars: the six `#[ignore]`d tests in crates/puddle-proxy/tests/terminate_suite/perf.rs
# (terminating next to splicing, HTTP/2 next to HTTP/1.1, resident memory of an idle connection),
# built in release mode, because a debug build says nothing about throughput or memory. Each test
# prints what it measured and asserts a ceiling set well above a workstation's number (see the
# constants in the test file), so a collapse fails the run and a drift shows in the log.
# Not a pull request check: shared-runner wall times are too noisy to gate a merge. By hand:
# `gh workflow run perf.yml --ref <branch>`. Nothing is cached: a release build shares nothing with
# the `linux` entry, and the repo's cache budget (cache-gc.yml) has no room for another one.
name: perf

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  terminate-perf:
    name: perf (release-build throughput and memory)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146
      # Each test in its own process (nextest), one at a time: the memory tests read the whole process's
      # resident size, and the throughput tests want the machine to themselves.
      - name: terminate_suite perf::, ignored tests only
        run: cargo nextest run --release -p puddle-proxy --test terminate_suite -E "test(/^perf::/)" --run-ignored only --no-capture --test-threads 1

  # The polled API calls on a database the size of a long-lived install (100 000 audit records, 1000
  # rules, 1000 open requests): the p95 of each call's CPU time must stay under 100 ms
  # (crates/puddle-host/tests/fake_host/api_latency.rs). CPU time, not wall time, so a busy shared runner
  # does not fail it.
  api-latency:
    name: perf (API call CPU time on a long history)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146
      - name: fake_host api_latency::, ignored tests only
        run: cargo nextest run --release -p puddle-host --test fake_host -E "test(/^api_latency::/)" --run-ignored only --no-capture --test-threads 1

  # What a zero-on-free allocator would cost the proxy (hardening of the secret store: a freed block is
  # wiped before it goes back). The perf tests' global allocator wraps `System` and wipes every freed
  # block when PUDDLE_PERF_ZERO_ON_FREE is set (crates/puddle-proxy/tests/terminate_suite/zeroing_alloc.rs),
  # so one binary is both sides. Five runs per side, interleaved and alternating which side goes first
  # in a pair, so a slow minute on a shared runner hits both; the summary shows the median of each side
  # and the ratio. Dispatch only: shared-runner numbers move too much to gate anything.
  zero-on-free-ab:
    name: perf A/B (zero-on-free allocator, ${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-nextest@0.9.146
      - name: Build the perf tests once
        run: cargo nextest run --release -p puddle-proxy --test terminate_suite -E "test(/^perf::(terminating_costs|http2_costs|small_requests)/)" --run-ignored only --no-run
      - name: Five interleaved pairs
        run: |
          mkdir ab
          for n in 1 2 3 4 5; do
            if [ $((n % 2)) -eq 1 ]; then sides="off on"; else sides="on off"; fi
            for side in $sides; do
              value=0; [ "$side" = on ] && value=1
              echo "::group::run $n, zero-on-free $side"
              PUDDLE_PERF_ZERO_ON_FREE=$value cargo nextest run --release -p puddle-proxy --test terminate_suite -E "test(/^perf::(terminating_costs|http2_costs|small_requests)/)" --run-ignored only --no-capture --test-threads 1 > "ab/$side-$n.log" 2>&1 || { cat "ab/$side-$n.log"; echo "::endgroup::"; exit 1; }
              grep -E '^(A|M) |ratio' "ab/$side-$n.log"
              echo "::endgroup::"
            done
          done
      - name: Summary
        run: |
          py=$(command -v python3 || command -v python)
          "$py" scripts/perf-zero-ab-summary.py ab
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-zero-on-free-${{ matrix.os }}
          path: ab/
