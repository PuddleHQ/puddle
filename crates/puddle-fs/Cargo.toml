# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-fs"
description = "Where Puddle keeps its files (the per-user data folder) and how it keeps the private ones (owner-only files and folders), per OS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Windows ACL test helpers (`win::testing`) for other crates' tests; never in product code.
testing = []

[dependencies]
dirs = { workspace = true }
getrandom = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }

# The lock across real processes: children are copies of the test binary, so it supplies its own `main`.
[[test]]
name = "lock_processes"
harness = false

[lints]
workspace = true
