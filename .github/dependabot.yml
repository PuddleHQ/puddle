# SPDX-License-Identifier: GPL-3.0-or-later
# Weekly, grouped to save CI minutes. PRs go to develop, labelled by ecosystem. A release waits 3 days
# (cooldown) before it is proposed; security updates skip the wait. cargo, ui and openapi-codegen split
# into an `auto` group (patch and minor: the dependabot-auto-merge workflow arms auto-merge, so the PR lands
# once the normal checks and the merge queue pass) and a `major` group (manual). github-actions, login-tools
# and the lab's uv entry stay manual. The workflow keys on the `auto` group's branch names.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    labels: ["dependencies", "rust"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # The microsandbox crates are our fork (PuddleHQ/microsandbox), released by hand as
      # `v<upstream>-puddle.<n>` tags. Dependabot sorts those tags and proposed .3 over .5.
      - dependency-name: "microsandbox*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels: ["dependencies", "github_actions"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # CI and engines pin Node 24; @types/node majors above it describe APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sveltejs/kit, svelte-check and typescript-eslint all peer on typescript 6 or lower. A 7 bump
      # cannot resolve ("Error while updating peer dependency") and fails the whole grouped job. Drop
      # this once all three accept 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /crates/puddle-api/openapi
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      openapi-codegen-auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      openapi-codegen-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /ci/login-tools
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      login-tools:
        patterns: ["*"]
  # uv, not pip: requirements.txt is compiled by `uv pip compile --universal`. The pip ecosystem rewrote it
  # without the environment markers (dropping typing-extensions and the Windows and macOS mitmproxy
  # packages); the uv ecosystem reruns uv with the flags in the file's header and keeps them.
  - package-ecosystem: uv
    directory: /ci/lab
    target-branch: develop
    labels: ["dependencies", "python"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      lab-proxies:
        patterns: ["*"]
