# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-api"
description = "Local HTTP API (axum) with SSE and the generated OpenAPI contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Serves the built SPA (`ui/build`) at `/` from inside the binary. Off by default so the crate
# builds and tests without Node; the app turns it on.
embedded-ui = ["dep:rust-embed"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
puddle-certs = { workspace = true }
puddle-doctor = { workspace = true }
puddle-fs = { workspace = true }
puddle-netpolicy = { workspace = true }
puddle-repos = { workspace = true }
puddle-secrets = { workspace = true }
puddle-settings = { workspace = true }
puddle-store = { workspace = true }
puddle-types = { workspace = true, features = ["openapi"] }
puddle-upstream = { workspace = true }
rust-embed = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
rcgen = { workspace = true }
puddle-upstream = { workspace = true, features = ["testing"] }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
puddle-fs = { workspace = true, features = ["testing"] }
windows-sys = { workspace = true, features = ["Win32_Foundation"] }

[lints]
workspace = true
