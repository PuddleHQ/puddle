# SPDX-License-Identifier: AGPL-3.0-or-later
# Weekly, grouped to save CI minutes. PRs go to develop, labelled by ecosystem. A release waits 3 days
# (cooldown) before it is proposed; security updates skip the wait. cargo, ui and openapi-codegen split
# into an `auto` group (patch and minor: the dependabot-auto-merge workflow arms auto-merge, so the PR lands
# once the normal checks and the merge queue pass) and a `major` group (manual). github-actions, login-tools
# and the lab's uv entry stay manual. The workflow keys on the `auto` group's branch names.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    labels: ["dependencies", "rust"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # The microsandbox crates are our fork (PuddleHQ/microsandbox), released by hand as
      # `v<upstream>-puddle.<n>` tags. Dependabot sorts those tags and proposed .3 over .5.
      - dependency-name: "microsandbox*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    labels: ["dependencies", "github_actions"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]
    ignore:
      # CI and engines pin Node 24; @types/node majors above it describe APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @sveltejs/kit, svelte-check and typescript-eslint all peer on typescript 6 or lower. A 7 bump
      # cannot resolve ("Error while updating peer dependency") and fails the whole grouped job. Drop
      # this once all three accept 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /crates/puddle-api/openapi
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      openapi-codegen-auto:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      openapi-codegen-major:
        patterns: ["*"]
        update-types: ["major"]
  - package-ecosystem: npm
    directory: /ci/login-tools
    target-branch: develop
    labels: ["dependencies", "javascript"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      login-tools:
        patterns: ["*"]
  # uv, not pip: requirements.txt is compiled by `uv pip compile --universal`. The pip ecosystem rewrote it
  # without the environment markers (dropping typing-extensions and the Windows and macOS mitmproxy
  # packages); the uv ecosystem reruns uv with the flags in the file's header and keeps them.
  - package-ecosystem: uv
    directory: /ci/lab
    target-branch: develop
    labels: ["dependencies", "python"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      lab-proxies:
        patterns: ["*"]
  # Frozen on purpose: ci/login-tools-old pins Claude Code 2.1.5, the last release whose login ends on
  # console.anthropic.com, and the CI install step checks that exact version, because the profile still
  # has to capture that login. Nothing watches this directory automatically, yet Dependabot still
  # opened a bump here (its security updates run without an entry in this file).
  # `open-pull-requests-limit: 0` turns off both version and security update PRs for it.
  #
  # Open alerts (all on @anthropic-ai/claude-code 2.1.5, first patched release in brackets):
  # #33 low symlink deny bypass [2.1.7], #34 high workspace trust dialog bypass [2.1.53], #35 medium
  # Windows managed-settings loading [2.1.75], #36 high sandbox symlink escape [2.1.64], #37 medium
  # WebFetch to huggingface.co [2.1.163], #38 high plugin hash pin bypass [2.1.179], #39 high macOS
  # Edit tool race [2.1.251]. Why they do not reach us: the one test that runs it
  # (`claude_code_2_1_5_logs_in_on_the_console_host_with_stand_ins_only`, Linux CI only) starts the
  # login screen, pastes a fake code and stops at "Login successful". It never opens a repository,
  # starts an agent session, runs a tool, installs a plugin or fetches a page, and it runs with a
  # cleared environment, a temporary home and fake hosts. Nothing here installs the package for use
  # outside CI, and the install runs with `--ignore-scripts` (the package has none to run).
  # Remove the fixture (the install step, this entry, the directory and the test) when Puddle no
  # longer supports the console-host login, or when a release that fixes these advisories still
  # logs in on that host; then Dependabot's alerts for the directory close on their own.
  - package-ecosystem: npm
    directory: /ci/login-tools-old
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
