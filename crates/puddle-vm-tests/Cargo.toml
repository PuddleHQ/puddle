[package]
name = "puddle-vm-tests"
description = "VM test harness (tiers K/W/R): per-run prefix, private MSB_HOME, msb runtime pair, boot helpers; tests only, no product code"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
microsandbox = { workspace = true }
puddle-runtime = { workspace = true }
puddle-types = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "process", "time"] }

[dev-dependencies]
puddle-ca = { workspace = true }
puddle-certs = { workspace = true }
puddle-doctor = { workspace = true }
puddle-guest-env = { workspace = true }
puddle-test-kit = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
