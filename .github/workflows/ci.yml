# SPDX-License-Identifier: GPL-3.0-or-later
# Linux gates on every push to develop/main and every pull request (docs/STANDARDS.md, "CI").
# Two jobs run side by side: the Rust and repository gates, and the UI gates (the browser tests are
# the longest step). A third job, `linux (all gates)`, waits for both and is the one result to
# require. Every gate runs even when an earlier one fails, so one run shows every problem.
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or task branch supersedes the run in flight (its result would be about a
# commit that is no longer the head). develop and main runs are never cancelled: every commit there gets a
# finished run, so a regression cannot land unseen. They get one group per commit, because a group also
# keeps only one pending run (a queued run is dropped for a newer one even with cancel-in-progress false).
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces and coverage keep file:line, while the test binaries that link
  # the msb SDK (puddle-vm-tests) stay small enough for the runner's disk (full debug info filled
  # it: `ld terminated with signal 7 [Bus error]`).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The commit the diff-coverage gate measures from: the PR's base, or the push's previous head
  # (empty or unknown, e.g. a new branch or a manual run: scripts/check.sh uses the merge base with origin/develop).
  DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  rust:
    name: linux (Rust and repository gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff-coverage gate needs the base commit
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # The 4 GB entry is saved by every develop run whose restore was not an exact hit (rust-cache skips
      # the save itself on an exact hit), so a lost entry is back after the next push to develop instead
      # of after the next dependency change. A pull request restores it and never saves.
      # The key hashes the toolchain, the CARGO, RUST, CC, CFLAGS, CXX and CMAKE variables, the manifests and the lockfile's
      # registry packages; a restore of a slightly older entry (same toolchain and variables) only
      # rebuilds what changed, but a changed toolchain or variable finds nothing, so it must save.
      # cache-gc.yml (budget table at its top) deletes the superseded entry.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux # the UI job restores this entry
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          # A develop run that fails after building still saves what it built, so the next run is warm.
          cache-on-failure: ${{ github.ref == 'refs/heads/develop' }}
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,typos@1.50.3,cargo-xwin@0.23.1,shellcheck@0.11.0,cargo-about@0.9.2
      - name: Node for the API contract's TypeScript types (openapi gate, ADR 0004)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/puddle-api/openapi/package-lock.json
      - name: System packages (WebKitGTK for the desktop shell, Squid for the upstream-chaining e2e)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid
          # The package starts its own daemon; the test runs its own Squid on a free port.
          sudo systemctl stop squid || true
          test -x /usr/sbin/squid
      - name: llvm-rc for the msvc cross-check (tauri-winres compiles the shell's Windows resources)
        run: |
          rc=$(ls /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$rc" ]; then sudo apt-get install -y --no-install-recommends llvm; rc=$(ls /usr/lib/llvm-*/bin/llvm-rc | sort -V | tail -n 1); fi
          mkdir -p "$HOME/llvm-rc-bin" && ln -sf "$rc" "$HOME/llvm-rc-bin/llvm-rc"
          echo "$HOME/llvm-rc-bin" >> "$GITHUB_PATH"
      - name: clang for the msvc cross-check (preinstalled on the runner)
        run: clang --version
      - name: Cache the MSVC CRT and Windows SDK that cargo-xwin downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
          # A miss costs a 14-minute MSVC CRT download; cache-gc.yml never deletes this entry.
      - name: fmt
        run: scripts/check.sh fmt
      - name: typos
        if: ${{ !cancelled() }}
        run: scripts/check.sh typos
      - name: spdx headers
        if: ${{ !cancelled() }}
        run: scripts/check.sh spdx
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: scripts/check.sh shellcheck
      - name: standalone (no planning-note references)
        if: ${{ !cancelled() }}
        run: scripts/check.sh standalone
      - name: secret scanning (gitleaks, pinned and checksummed in ci/gitleaks.sha256)
        if: ${{ !cancelled() }}
        run: |
          ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" scripts/check.sh secrets
      - name: hooks (pre-push hook and runtime fetch tests)
        if: ${{ !cancelled() }}
        run: scripts/check.sh hooks
      - name: git-env (gates run with the variables git sets for a hook)
        if: ${{ !cancelled() }}
        run: scripts/check.sh git-env
      - name: clippy (linux)
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy
      - name: clippy (windows-msvc, cross-checked)
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy-windows
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: scripts/check.sh deny
      - name: licence notices (cargo-about)
        if: ${{ !cancelled() }}
        run: scripts/check.sh notices
      - name: API contract (openapi.json and schema.d.ts are current)
        if: ${{ !cancelled() }}
        run: scripts/check.sh openapi
      - name: doc tests and rustdoc
        if: ${{ !cancelled() }}
        run: scripts/check.sh doc
      - name: tests with coverage gate
        if: ${{ !cancelled() }}
        env:
          NEXTEST_PROFILE: ci
          PUDDLE_SQUID_BIN: /usr/sbin/squid
          PUDDLE_SQUID_REQUIRED: "1"
        run: |
          scripts/check.sh coverage
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-results
          path: |
            target/nextest/ci/junit.xml
            target/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: linux (UI gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff-coverage gate needs the base commit
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # The end-to-end tests build the API fixture server; this job restores the Rust job's entry
      # and never saves one (two jobs would write the same key).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux
          save-if: false
      - name: Node for the UI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Restored everywhere, saved only by develop (a branch's own entry is never read by another).
      - name: Playwright browsers cache
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Playwright browsers (Chromium and WebKit; their system libraries every time)
        run: |
          cd ui
          npm ci --ignore-scripts --no-audit --no-fund
          if [ "${{ steps.browsers.outputs.cache-hit }}" = true ]; then
            npx playwright install-deps chromium webkit
          else
            npx playwright install --with-deps chromium webkit
          fi
      - name: Save the Playwright browsers
        if: ${{ github.ref == 'refs/heads/develop' && steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: UI (format, lint, types, unit and component tests with coverage, build)
        run: scripts/check.sh ui
      - name: UI licences (npm packages in the bundle)
        if: ${{ !cancelled() }}
        run: scripts/check.sh ui-licences
      - name: UI audit (npm advisories in production dependencies)
        if: ${{ !cancelled() }}
        run: scripts/check.sh ui-audit
      - name: UI end-to-end (Playwright, Chromium and WebKit, axe)
        if: ${{ !cancelled() }}
        run: scripts/check.sh ui-e2e
      - name: upload UI test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ui-test-results
          path: |
            ui/playwright-report
            ui/test-results
            ui/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore

  # One stable result for both jobs above.
  # The develop ruleset requires it by this name: a rename changes the ruleset in the same change.
  linux:
    name: linux (all gates)
    needs: [rust, ui]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: both jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null
