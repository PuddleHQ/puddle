name: cache-gc
on:
  workflow_dispatch:
jobs:
  base-natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: develop }
      - name: install (develop's step)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s); ip=$(getent ahostsv4 azure.archive.ubuntu.com | awk 'NR==1{print $1}')
          trap 'echo "AB role=base-natural ip=$ip secs=$(( $(date +%s) - t0 ))"' EXIT
          ci/apt-setup.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid
          test -x /usr/sbin/squid
      - run: 'echo "AB role=base-natural outcome=${{ steps.i.outcome }}"'
  cand-natural:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install (the new step)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s); ip=$(getent ahostsv4 azure.archive.ubuntu.com | awk 'NR==1{print $1}')
          trap 'echo "AB role=cand-natural ip=$ip secs=$(( $(date +%s) - t0 ))"' EXIT
          ci/apt-setup.sh
          ci/apt-retry.sh sudo apt-get update
          ci/apt-retry.sh sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid
          test -x /usr/sbin/squid
      - run: 'echo "AB role=cand-natural outcome=${{ steps.i.outcome }}"'
  # The mirror is pinned to a known-slow backend and the probe is told it is fast: the case where a
  # probe passes and the install still crawls.
  base-forced:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: develop }
      - name: install on a slow backend (develop's step)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s)
          echo "20.106.104.242 azure.archive.ubuntu.com" | sudo tee -a /etc/hosts
          trap 'echo "AB role=base-forced secs=$(( $(date +%s) - t0 ))"' EXIT
          ci/apt-setup.sh
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid
          test -x /usr/sbin/squid
      - run: 'echo "AB role=base-forced outcome=${{ steps.i.outcome }}"'
  cand-forced:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install on a slow backend (the new step)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s)
          echo "20.106.104.242 azure.archive.ubuntu.com" | sudo tee -a /etc/hosts
          trap 'echo "AB role=cand-forced secs=$(( $(date +%s) - t0 ))"' EXIT
          sudo apt-get update -q >/dev/null 2>&1 || true
          uri=$(apt-get download --print-uris libwebkit2gtk-4.1-0 | awk -F"'" 'NR==1{print $2}' | sed -nE 's#^.*/(pool/.*)#http://archive.ubuntu.com/ubuntu/\1#p')
          echo "probe stand-in: $uri"
          APT_PROBE_URL=$uri ci/apt-setup.sh
          ci/apt-retry.sh sudo apt-get update
          ci/apt-retry.sh sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid
          test -x /usr/sbin/squid
      - run: 'echo "AB role=cand-forced outcome=${{ steps.i.outcome }}"'
