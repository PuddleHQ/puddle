# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-agent-proto"
description = "Wire protocol between the guest agent and the host: yamux settings, control stream, host session, reset-preserving relay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true }
puddle-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-yamux = { workspace = true }
tracing = { workspace = true }

[features]
# `testing`: an allow-all CONNECT endpoint for integration tests of the agent (never in product code).
testing = []
# `fuzzing`: entry points for the cargo-fuzz targets in `fuzz/` and their checked-in corpus (never in
# product code; the xtask release-feature check refuses it in a shipped build).
fuzzing = []

[dev-dependencies]
puddle-agent-proto = { path = ".", features = ["fuzzing"] }
proptest = { workspace = true }
puddle-test-kit = { workspace = true }
puddle-types = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
