<!-- The page behind terminal-keys.mjs and terminal-keys-webkit.mjs: what the terminal screen's key
     rules assume of a webview. Like the terminal's input, a focused textarea.
     Every key is logged and its default cancelled, except the two paste shortcuts, which must still
     fire `paste` (the page then reads the text from the event, so no clipboard permission is
     needed). `window.probe` is what the scripts read. -->
<meta charset="utf-8">
<title>terminal key probe</title>
<textarea id="input" autofocus rows="3" cols="40"></textarea>
<script>
  const PASTE_KEYS = (e) =>
    (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "v") || (e.shiftKey && !e.ctrlKey && e.key === "Insert");
  window.probe = {
    // Set once per document: a reload makes a new one, so a changed value means a reload.
    document: Math.random().toString(36).slice(2),
    keys: [],
    pastes: [],
  };
  const input = document.getElementById("input");
  input.addEventListener("keydown", (e) => {
    window.probe.keys.push({ key: e.key, ctrl: e.ctrlKey, shift: e.shiftKey, alt: e.altKey, defaultPrevented: !PASTE_KEYS(e) });
    if (!PASTE_KEYS(e)) e.preventDefault();
  });
  input.addEventListener("paste", (e) => {
    window.probe.pastes.push(e.clipboardData.getData("text/plain"));
    e.preventDefault();
  });
  input.focus();
</script>
