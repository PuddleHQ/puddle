# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "puddle-agent"
description = "Guest agent: static binary inside each sandbox that carries traffic to the host over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Lets a test run the built binary with a lookup that never asks the machine's resolver
# (`PUDDLE_AGENT_TEST_LOOKUP`). Only this crate's own dev-dependency on itself turns it on, so a
# release build never has it; scripts/check-test-features.sh proves that.
test-lookup = []

[dependencies]
flate2 = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
puddle-agent-proto = { workspace = true }
puddle-fd-limit = { workspace = true }
puddle-log = { workspace = true }
puddle-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-yamux = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
nix = { workspace = true }
rustix = { workspace = true, features = ["net"] }

[dev-dependencies]
puddle-agent = { path = ".", features = ["test-lookup"] }
arbitrary = { workspace = true }
tracing-subscriber = { workspace = true }
puddle-test-kit = { workspace = true }
puddle-types = { workspace = true, features = ["testing"] }
proptest = { workspace = true }
rustix = { workspace = true }
tempfile = { workspace = true }
puddle-agent-proto = { workspace = true, features = ["testing"] }
puddle-front = { workspace = true }
puddle-guest-env = { workspace = true }
puddle-ipc = { workspace = true }
puddle-proxy = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[lints]
workspace = true
