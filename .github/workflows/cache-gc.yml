name: cache-gc
on:
  workflow_dispatch:
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: install (develop's step, verbatim)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s)
          ip=$(getent ahostsv4 azure.archive.ubuntu.com | awk 'NR==1{print $1}')
          printf 'Acquire::http::Timeout "20";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts >/dev/null
          trap 'echo "AB role=baseline ip=$ip secs=$(( $(date +%s) - t0 )) runner=$RUNNER_NAME"' EXIT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid 2>&1 | tee /tmp/apt.out
          grep -E "^Fetched" /tmp/apt.out | sed 's/^/AB fetched baseline: /'
          sudo systemctl stop squid || true
          test -x /usr/sbin/squid
      - run: 'echo "AB role=baseline outcome=${{ steps.i.outcome }}"'
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install (the new step)
        id: i
        timeout-minutes: 10
        continue-on-error: true
        run: |
          t0=$(date +%s)
          ip=$(getent ahostsv4 azure.archive.ubuntu.com | awk 'NR==1{print $1}')
          ci/apt-setup.sh | sed "s/^/AB setup: /"
          trap 'echo "AB role=candidate ip=$ip secs=$(( $(date +%s) - t0 )) runner=$RUNNER_NAME"' EXIT
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev squid 2>&1 | tee /tmp/apt.out
          grep -E "^Fetched" /tmp/apt.out | sed 's/^/AB fetched candidate: /'
          sudo systemctl stop squid || true
          test -x /usr/sbin/squid
      - run: 'echo "AB role=candidate outcome=${{ steps.i.outcome }}"'
