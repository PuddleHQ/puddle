# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-ssh-agent"
description = "A client for the SSH agent on the host: where it listens and which keys it holds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
signature = { workspace = true }
ssh-key = { workspace = true }
thiserror = { workspace = true }

[features]
# `testing`: keys from a fixed seed and the bytes of an SSH key exchange, a bind and a login, for tests
# of this crate and of the proxy (never in product code).
testing = []

[dev-dependencies]
puddle-ssh-agent = { path = ".", features = ["testing"] }
puddle-ipc = { workspace = true }
puddle-test-kit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
