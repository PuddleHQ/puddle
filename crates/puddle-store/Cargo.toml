# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "puddle-store"
description = "SQLite storage and the rules engine: rules, grants, pending requests, audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
psl = { workspace = true }
puddle-secrets = { workspace = true }
puddle-types = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tracing = { workspace = true }

[dev-dependencies]
# `hooks` lets tests make single statements fail, to run the error paths.
puddle-test-kit = { workspace = true }
rusqlite = { workspace = true, features = ["hooks"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "test-util"] }

[lints]
workspace = true
