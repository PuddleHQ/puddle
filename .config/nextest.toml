# SPDX-License-Identifier: AGPL-3.0-or-later
# Test runner settings. Retries stay at 0: a flaky proxy or transparency test is the bug itself
# (docs/STANDARDS.md, "Flaky tests"). Only infrastructure steps may retry, and they do so in the
# harness, visibly. The one exception is the Windows nightly, which passes `--retries 1` on the
# command line to list tests that pass only on retry (ci/flaky-report.py); a test that fails twice
# still fails the run.
#
# VM tests (functions or test binaries named `vm_*`, crate `puddle-vm-tests`) boot real microVMs.
# The default and ci profiles leave them out, so `scripts/check.sh` and the Linux gates never
# need KVM; `--profile vm` runs only them (vm-linux / vm-windows workflows, ci/windows-e2e.ps1).

# Wrapper scripts are still an experimental nextest feature; the `mutants` profile needs one.
experimental = ["wrapper-scripts"]

[profile.default]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
default-filter = "not (test(/(^|::)vm_/) | binary(/^vm_/))"

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
default-filter = "not (test(/(^|::)vm_/) | binary(/^vm_/))"

[profile.ci.junit]
path = "junit.xml"

# Mutation runs (scripts/mutants.sh, .cargo/mutants.toml). A mutant can turn a scanning loop into one
# that never advances while it pushes into a Vec: the test process then takes about 200 MB a second
# until the run's timeout, and one such process per CPU filled a 32 GB machine in seconds. Each test
# process gets a heap limit (scripts/cap-test-memory.sh) and fewer run at once, so the runaway test
# fails, which counts the mutant as caught. Ordinary tests peak at about 10 MB.
[scripts.wrapper.cap-memory]
command = { command-line = "scripts/cap-test-memory.sh", relative-to = "workspace-root" }

# A mutant can also make a test spin without allocating (a scanning loop that never advances, as in
# `Frames::observe`). cargo-mutants gives the whole test run 5 times the unmutated run (125 s for
# `puddle-proxy`) and reports a timeout, which fails the sweep, when nextest's own limit (4 x 30 s,
# plus the kill grace) ends the test only after that. The runaway test is killed first instead, so the
# mutant counts as caught by a failing test (nightly 2026-11-09, `watch.rs:135`: three timeouts).
[profile.mutants]
inherits = "default"
test-threads = 4
slow-timeout = { period = "20s", terminate-after = 3, grace-period = "2s" }

[[profile.mutants.scripts]]
filter = "all()"
run-wrapper = "cap-memory"

# VM tests only, one at a time (hosted runners have 2 vCPU / 8 GB), never retried.
# A test is killed after 12 minutes, inside the jobs' 15-minute limit.
[profile.vm]
retries = 0
fail-fast = false
test-threads = 1
default-filter = "test(/(^|::)vm_/) | binary(/^vm_/)"
slow-timeout = { period = "120s", terminate-after = 6 }
failure-output = "immediate-final"
success-output = "final"

[profile.vm.junit]
path = "junit.xml"

# If a VM test runs under another profile (an explicit `-E` or `--ignore-default-filter`), it
# still runs alone.
[test-groups]
vm = { max-threads = 1 }
# The transparency suite's cases run one at a time: each asserts no stall over a few seconds, and a
# gibibyte moving next to them in a debug build is CPU contention, not a stall.
transparency = { max-threads = 1 }
# The 100 000-request floods: about 65 CPU-seconds each in a debug build (measured idle, user plus
# sys), so their wall time is that divided by the share of CPU they get. Three of them side by side
# on a busy runner took each other's share and hit the 120 s kill (once at 116 s on four CPUs shared
# with 16 busy loops, alone).
flood = { max-threads = 1 }

[[profile.default.overrides]]
filter = "test(/(^|::)vm_/) | binary(/^vm_/)"
test-group = "vm"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "test(/(^|::)vm_/) | binary(/^vm_/)"
test-group = "vm"
slow-timeout = { period = "120s", terminate-after = 5 }

# The real-tool radar (`vm_radar_*`, never run by the per-pull-request jobs): package managers
# fetch thousands of packages through the whole stack, so a test may run for up to an hour (a run
# took about 35 minutes on a busy host).
[[profile.vm.overrides]]
filter = "test(/(^|::)vm_radar_/)"
slow-timeout = { period = "600s", terminate-after = 6 }

# The soak (`vm_soak_*`: a session idle for 15 minutes, then it must answer) is longer than any other
# VM test by design; the nightly and dispatch runs of the VM workflows run it, pull requests skip it.
[[profile.vm.overrides]]
filter = "test(/(^|::)vm_soak_/)"
slow-timeout = { period = "600s", terminate-after = 3 }

# The desktop VS Code story (`vm_vscode_*`) boots a VM, installs Remote-SSH and attaches the real window five times (the
# first attach unpacks and starts VS Code's server in the guest, a reload replaces it); 25 minutes, inside the job's 30.
[[profile.vm.overrides]]
filter = "test(/(^|::)vm_vscode_/)"
slow-timeout = { period = "300s", terminate-after = 5 }

# The transparency suite moves a gibibyte each way and lets a reader take a minute: a slow runner
# must not turn "finishes in 30 s" into a kill (a gibibyte each way took 250 s on four busy CPUs).
[[profile.default.overrides]]
filter = "binary(transparency) & package(puddle-e2e)"
test-group = "transparency"
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.ci.overrides]]
filter = "binary(transparency) & package(puddle-e2e)"
test-group = "transparency"
slow-timeout = { period = "60s", terminate-after = 10 }

# One at a time, and a kill budget of 300 s: at the measured 65 CPU-seconds that holds down to a
# 0.25-CPU share, which is below the share a test gets on a loaded runner.
[[profile.default.overrides]]
filter = "test(/a_hundred_thousand_|hostile_hg1[12]_a_hundred_thousand/)"
test-group = "flood"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = "test(/a_hundred_thousand_|hostile_hg1[12]_a_hundred_thousand/)"
test-group = "flood"
slow-timeout = { period = "60s", terminate-after = 5 }

# The edge tests of the merge engine (`merge_edges`) read files of the 4 MiB limit through every format:
# linear work (1, 2, 4 MiB took 0.04, 0.09, 0.18 s in the instrumented build, per scan; the three limit tests
# take 0.45 to 0.85 s alone), but with eight busy loops on one CPU they took 4 to 8 s, and on a loaded
# coverage runner a test of this binary reached 15 s once. Hung-scanner detection stays: each test
# that feeds a scanner unfinished input runs it under its own 30 s bound.
[[profile.default.overrides]]
filter = "package(puddle-types) & binary(merge_edges)"
slow-timeout = { period = "60s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(puddle-types) & binary(merge_edges)"
slow-timeout = { period = "60s", terminate-after = 1 }
# First matching override wins for a setting, so this one sits above the crate-wide 15 s one below.

# `puddle-types` scans text in loops (the merge engine, the request-path decoder). A scanner that stops
# advancing (a mutant, or a bug) hangs every test that reaches it, and with only a few test threads those
# hung tests hold every slot, so the test that would fail fast never starts and the mutation run reports
# a timeout instead of a kill. The whole crate's tests take about a second, so one that runs for 15 s is hung.
[[profile.default.overrides]]
filter = "package(puddle-types)"
slow-timeout = { period = "15s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = "package(puddle-types)"
slow-timeout = { period = "15s", terminate-after = 1 }
