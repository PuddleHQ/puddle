# SPDX-License-Identifier: GPL-3.0-or-later
# Nightly fuzzing of what a guest's first bytes reach (fuzz/, HG-10 in docs/arch/threat-model.md):
# ten minutes per target on a nightly toolchain, by hand with a different length. It is not a
# required check and gates nothing; a crash fails the run and uploads the input as an artifact, which
# is committed under fuzz/corpus/<target>/ as a regression (fuzz/README.md). The checked-in corpus
# is replayed on every push by crates/puddle-proxy/tests/fuzz_corpus.rs.
name: fuzz

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        default: "600"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [head_parser, connect_target, normalise_host, agent_preamble]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nightly toolchain
        run: rustup toolchain install nightly --profile minimal && rustc +nightly --version
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-fuzz@0.13.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/develop' }}
      # The prebuilt cargo-fuzz is a musl binary and defaults to the musl target, which the runner lacks.
      - name: fuzz ${{ matrix.target }}
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
        working-directory: fuzz
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=2048
      - name: the crashing input
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
          if-no-files-found: ignore
