# Keeps the .deb files a job downloads in the Actions cache, so a warm run installs without the Ubuntu
# mirrors (they stalled for hours on 2026-11-19). Put it before the job's first `ci/apt-setup.sh`: it
# restores the files to $RUNNER_TEMP/apt-debs and sets APT_DEBS_DIR for the rest of the job, which makes
# ci/apt-setup.sh point apt's archives at that directory. The index is still fetched (a few MB), the
# packages are not. Only develop saves, like the other caches here; a pull request reads develop's entry.
# The key names the job's package set (`name`), the runner image version and the workflow file, so a new
# image or an edited package list starts a fresh entry; a miss or a read-only cache (an exhausted cache
# budget) only means a normal download.
name: apt-debs-cache
description: Restore and save the apt package downloads of a job
inputs:
  name:
    description: Short name of the job's package set, for the cache key
    required: true
runs:
  using: composite
  steps:
    - name: apt package cache directory
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/apt-debs"
        echo "APT_DEBS_DIR=$RUNNER_TEMP/apt-debs" >> "$GITHUB_ENV"
    - name: Restore and save (develop)
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs
        key: apt-debs-${{ inputs.name }}-${{ env.ImageVersion }}-${{ hashFiles('.github/workflows/ci.yml') }}
    - name: Restore
      if: ${{ github.ref != 'refs/heads/develop' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/apt-debs
        key: apt-debs-${{ inputs.name }}-${{ env.ImageVersion }}-${{ hashFiles('.github/workflows/ci.yml') }}
