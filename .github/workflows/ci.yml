# SPDX-License-Identifier: GPL-3.0-or-later
# Linux gates on every push to develop/main, every pull request and every merge queue run
# (docs/STANDARDS.md, "CI").
# Two jobs run side by side: the Rust and repository gates, and the UI gates (the browser tests are
# the longest step). A third job, `linux (all gates)`, waits for both and is the one result to
# require. Every gate runs even when an earlier one fails, so one run shows every problem.
# A pull request to develop runs only the jobs its changed files can affect (ci/scope.sh, the `scope`
# job): a docs-only or UI-only change runs a light job (typos, spdx, shellcheck, standalone, secrets)
# instead of the Rust gates, and a change with no UI-relevant path skips the UI job. Every other
# event, and any doubt, runs everything. `linux (all gates)` accepts a skip only when `scope` said so.
# A merge queue run (`merge_group`) is scoped the same way, by the group's diff against develop.
# With the repository variable PUDDLE_QUEUE set to `on`, a pull request to develop runs in the light
# mode (ci/scope.sh): the `git-env` and `notices` gates skip and the UI end-to-end tests run on
# Chromium only; the merge queue runs them all on the commit that lands. Unset, every pull request
# runs the full set. With PUDDLE_TIER set to `on`, a merge queue run also runs those tests on Chromium
# only unless the diff touches markup, styles or the browser test setup (webkit.yml runs WebKit nightly;
# a pull request to main runs both here). With PUDDLE_QUEUE_SKIP_PUSH set to `on`, a push to develop whose commit a green
# merge queue run of this workflow tested skips the Rust, msvc and UI jobs when their caches exist
# (the `queue-tested` job); it still runs the advisories.
# Advisories (RustSec, npm) are not one of those gates: a new advisory fails every pull request at once, whatever
# the pull request changes. The separate `advisories` and `advisories-npm` jobs run on pull requests to main, on
# pushes, nightly and by hand, never on a pull request to develop or a merge queue run (the `cargo-deny` step
# there checks bans, licences and sources).
name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
  merge_group:
    types: [checks_requested]
  # The nightly runs only the two advisories jobs (every other job skips on this event) and keeps its tracking issue.
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or task branch supersedes the run in flight (its result would be about a
# commit that is no longer the head). develop and main runs are never cancelled: every commit there gets a
# finished run, so a regression cannot land unseen. They get one group per commit, because a group also
# keeps only one pending run (a queued run is dropped for a newer one even with cancel-in-progress false).
# The event is part of the group, so the nightly never replaces a push run of the same commit.
concurrency:
  group: ci-${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && format('{0}-{1}', github.sha, github.event_name) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only: backtraces and coverage keep file:line, while the test binaries that link
  # the msb SDK (puddle-vm-tests) stay small enough for the runner's disk (full debug info filled
  # it: `ld terminated with signal 7 [Bus error]`).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The commit the diff-coverage gate measures from: the PR's base, the merge queue's base, or the push's
  # previous head (empty or unknown, e.g. a new branch or a manual run: scripts/check.sh uses the merge
  # base with origin/develop).
  DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

jobs:
  # Which jobs this pull request needs (ci/scope.sh; it falls open to "all" on any doubt). Checks out
  # only ci/, so it costs a few seconds.
  scope:
    name: scope (changed files)
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      ci_rust: ${{ steps.scope.outputs.ci_rust }}
      ui: ${{ steps.scope.outputs.ui }}
      light: ${{ steps.scope.outputs.light }}
      defer_linux_webkit: ${{ steps.scope.outputs.defer_linux_webkit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: which jobs does this change need?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
        run: ci/scope.sh
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # A push to develop whose commit a green merge queue run of this workflow already tested (the queue
  # fast-forwards develop to the commit it tested) need not build and test it again. Runs only with
  # PUDDLE_QUEUE_SKIP_PUSH=on, and says skip=true only when that run exists and the caches the heavy
  # jobs would save (the Rust `linux` entry, the Playwright browsers, cargo-xwin) are all on develop
  # for this exact key. Any error or doubt says skip=false and everything runs.
  queue-tested:
    name: already tested in the merge queue?
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && vars.PUDDLE_QUEUE_SKIP_PUSH == 'on' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: a green merge queue run on this commit?
        id: queue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PUDDLE_QUEUE_SKIP_PUSH: ${{ vars.PUDDLE_QUEUE_SKIP_PUSH }}
        run: ci/should-run.sh ci.yml --queue-tested
      # The Rust key hashes the toolchain, the manifests and the environment, as in the rust job (no extra
      # CARGO or RUST variables may be set in this job, or the key differs). If the two keys ever drift
      # apart, the lookup misses and the push run always tests: safe, but option D then saves nothing.
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.queue.outputs.tested == 'true'
        continue-on-error: true
        run: rustup toolchain install && rustc --version
      - name: Rust cache entry (lookup only)
        id: rust-cache
        if: steps.queue.outputs.tested == 'true'
        continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          lookup-only: true
          save-if: false
      - name: Playwright browsers entry (lookup only)
        id: browsers
        if: steps.queue.outputs.tested == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
          lookup-only: true
      - name: cargo-xwin entry (lookup only)
        id: xwin
        if: steps.queue.outputs.tested == 'true'
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
          lookup-only: true
      - name: skip the heavy jobs?
        id: decide
        env:
          TESTED: ${{ steps.queue.outputs.tested }}
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          BROWSERS_HIT: ${{ steps.browsers.outputs.cache-hit }}
          XWIN_HIT: ${{ steps.xwin.outputs.cache-hit }}
        run: |
          echo "merge queue tested this commit: ${TESTED:-unknown}; cache hits: rust ${RUST_HIT:-none}, browsers ${BROWSERS_HIT:-none}, cargo-xwin ${XWIN_HIT:-none}"
          if [ "$TESTED" = true ] && [ "$RUST_HIT" = true ] && [ "$BROWSERS_HIT" = true ] && [ "$XWIN_HIT" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: linux (Rust and repository gates)
    needs: [scope, queue-tested]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.scope.outputs.ci_rust != 'false' && needs.queue-tested.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `actions: write` is for the cancel-group step (a merge queue failure) and the cache-drop step, which frees the superseded Rust entry on a develop push
    # (ci/cache-drop.sh; a pull request, a queue branch or a fork never deletes anything).
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff-coverage gate needs the base commit
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # The 6.7 GB entry is saved by every develop run whose restore was not an exact hit (rust-cache skips
      # the save itself on an exact hit), so a lost entry is back after the next push to develop instead
      # of after the next dependency change. A pull request restores it and never saves.
      # The key hashes the toolchain, the CARGO, RUST, CC, CFLAGS, CXX and CMAKE variables, the manifests and the lockfile's
      # registry packages; a restore of a slightly older entry (same toolchain and variables) only
      # rebuilds what changed, but a changed toolchain or variable finds nothing, so it must save.
      # On a develop run, the step below remembers the entry rust-cache restores and deletes it once rust-cache has
      # saved the replacement (its post step runs after rust-cache's), so the repo holds both for seconds, not until
      # cache-gc.yml runs; a pull request, a queue branch or a run with no save deletes nothing (ci/cache-drop.sh).
      - name: Free the Rust cache entry the save below replaces (develop only)
        if: ${{ github.ref == 'refs/heads/develop' }}
        uses: ./.github/actions/cache-drop
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          prefix: v0-rust-linux-
      # The queue-tested job looks this entry up by the same key: a CARGO or RUST variable set on this job
      # or this step must be set there too.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/develop' }}
          # A develop run that fails after building still saves what it built, so the next run is warm.
          cache-on-failure: ${{ github.ref == 'refs/heads/develop' }}
      # No job builds for x86_64-pc-windows-msvc here (the cross-check is its own job without a Rust cache), but the
      # restore-key chain carried the directory from entry to entry: 415 MiB raw in the 7.0 GiB entry. Removing it
      # right after the restore keeps it out of the next save (rust-cache's post step packs `target` as it is then).
      - name: Keep the unused msvc target out of the saved entry (develop only)
        if: ${{ github.ref == 'refs/heads/develop' }}
        run: rm -rf target/x86_64-pc-windows-msvc
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146,cargo-llvm-cov@0.9.1,cargo-deny@0.20.2,typos@1.50.3,shellcheck@0.11.0,cargo-about@0.9.2
      - name: Node for the API contract's TypeScript types (openapi gate, ADR 0004)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/puddle-api/openapi/package-lock.json
      - name: System packages (WebKitGTK, the tray library and Xvfb for the desktop shell, Squid for the upstream-chaining e2e)
        timeout-minutes: 10
        run: |
          # The image's default mirror hands some runners a backend that serves 40 to 250 kB/s (a 62 MB
          # install took 26 minutes): ci/apt-setup.sh keeps to a fast backend or goes to Canonical, and
          # ci/apt-retry.sh moves to Canonical when the install itself stalls anyway.
          ci/apt-setup.sh
          ci/apt-retry.sh sudo apt-get update
          # libayatana-appindicator3-1: the tray icon library, opened at run time (the build does not
          # need its dev package); xvfb: the virtual display the tray test runs on.
          ci/apt-retry.sh sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-1 xvfb squid
          # The package starts its own daemon; the test runs its own Squid on a free port.
          sudo systemctl stop squid || true
          test -x /usr/sbin/squid
      # The corporate-lab fixtures (crates/puddle-e2e/src/lab) run mitmproxy as the TLS interceptor and
      # the NTLM proxy. The packages are pinned with hashes in ci/lab/requirements.txt (compiled from
      # requirements.in; Dependabot's uv entry for /ci/lab bumps them weekly), so a new release reaches
      # the tests through a pull request, not a runner.
      - name: mitmproxy for the corporate-lab fixtures
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 -m venv "$RUNNER_TEMP/lab-venv"
          "$RUNNER_TEMP/lab-venv/bin/pip" install --require-hashes --no-deps --quiet -r ci/lab/requirements.txt
          "$RUNNER_TEMP/lab-venv/bin/mitmdump" --version
          echo "PUDDLE_MITMDUMP_BIN=$RUNNER_TEMP/lab-venv/bin/mitmdump" >> "$GITHUB_ENV"
      # The login tests run the real Claude Code, `gh` (on the runner image) and Copilot CLI against fake
      # servers. The two npm packages are pinned in ci/login-tools/package.json and its lockfile, which
      # Dependabot bumps weekly (the npm entry for /ci/login-tools in .github/dependabot.yml): a bump PR
      # runs these tests against the new release, so a changed login flow fails there. Scripts stay on:
      # Claude Code's postinstall fetches its native binary, and without it `claude` does not start.
      - name: Real login tools (Claude Code and Copilot CLI) for the login tests
        run: |
          npm ci --prefix ci/login-tools --no-audit --no-fund
          tools="$GITHUB_WORKSPACE/ci/login-tools/node_modules/.bin"
          export PATH="$tools:$PATH"
          claude --version
          copilot --version
          gh --version
          # The install step is what provides the tools, so it also turns "tool missing" into a failure.
          echo "$tools" >> "$GITHUB_PATH"
          {
            echo "PUDDLE_COPILOT_BIN=$tools/copilot"
            echo "PUDDLE_REQUIRE_LOGIN_TOOLS=1"
          } >> "$GITHUB_ENV"
      - name: fmt
        run: scripts/check.sh fmt
      # ci/ is an always-run path, so a change to the scoping rules or this test runs this job.
      - name: path scoping (fixture of merged pull requests, fail-open cases, crate sets against cargo metadata)
        if: ${{ !cancelled() }}
        env:
          SCOPE_TEST_METADATA: "1"
        run: ci/scope-test.sh
      - name: typos
        if: ${{ !cancelled() }}
        run: scripts/check.sh typos
      - name: spdx headers
        if: ${{ !cancelled() }}
        run: scripts/check.sh spdx
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: scripts/check.sh shellcheck
      - name: standalone (no planning-note references)
        if: ${{ !cancelled() }}
        run: scripts/check.sh standalone
      - name: quality (every unsafe, suppression and TODO says why)
        if: ${{ !cancelled() }}
        run: scripts/check.sh quality
      - name: silent skips (a test that returns early must fail in the job that provides its prerequisite)
        if: ${{ !cancelled() }}
        run: scripts/check.sh silent-skips
      - name: gitleaks download cache (the script still checks the pin)
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gitleaks-cache
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/gitleaks.sha256') }}
      - name: secret scanning (gitleaks, pinned and checksummed in ci/gitleaks.sha256)
        if: ${{ !cancelled() }}
        run: |
          GITLEAKS_CACHE_DIR="$HOME/gitleaks-cache" ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" scripts/check.sh secrets
      - name: hooks (pre-push hook and runtime fetch tests)
        if: ${{ !cancelled() }}
        run: scripts/check.sh hooks
      # The light pull request mode skips the two slowest repository gates; the merge queue runs them.
      - name: git-env (gates run with the variables git sets for a hook)
        id: git-env
        if: ${{ !cancelled() && needs.scope.outputs.light != 'true' }}
        run: scripts/check.sh git-env
      - name: clippy (linux)
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy
      - name: cargo-deny (bans, licences, sources; advisories run in their own job)
        if: ${{ !cancelled() }}
        run: scripts/check.sh deny
      # The notices verdict is a function of the manifests, the lockfile, cargo-about's config and version and xtask
      # (`notices_inputs_hash` in scripts/check.sh). A develop run that passes saves a stamp in a cache entry named by
      # that hash; a run on the same inputs restores it and the gate skips (about 90 s of a warm job). A pull request
      # and a queue run only restore, so a stamp always comes from a gate that passed on develop. The gate compares the
      # stamp with its own hash, so an entry that does not match its name only costs the run. The stamp lives outside
      # target/ (CHECK_STAMP_DIR): rust-cache deletes the files of a target subfolder when it saves.
      - name: licence notices stamp (key from the gate's own inputs hash)
        id: notices-key
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: echo "key=notices-ok-$(scripts/check.sh --stamp-key notices)" >> "$GITHUB_OUTPUT"
      - name: licence notices stamp (restore)
        id: notices-stamp
        if: ${{ !cancelled() && steps.notices-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/check-stamps
          key: ${{ steps.notices-key.outputs.key }}
      - name: licence notices (cargo-about)
        id: notices
        if: ${{ !cancelled() && needs.scope.outputs.light != 'true' }}
        env:
          CHECK_STAMP_DIR: ${{ runner.temp }}/check-stamps
        run: scripts/check.sh notices
      - name: licence notices stamp (save, develop only)
        if: ${{ github.ref == 'refs/heads/develop' && steps.notices.outcome == 'success' && steps.notices-key.outputs.key != '' && steps.notices-stamp.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/check-stamps
          key: ${{ steps.notices-key.outputs.key }}
      - name: API contract (openapi.json and schema.d.ts are current)
        if: ${{ !cancelled() }}
        run: scripts/check.sh openapi
      - name: doc tests and rustdoc
        if: ${{ !cancelled() }}
        run: scripts/check.sh doc
      - name: tests with coverage gate
        if: ${{ !cancelled() }}
        env:
          NEXTEST_PROFILE: ci
          PUDDLE_SQUID_BIN: /usr/sbin/squid
          # A test whose prerequisite is missing fails here instead of skipping (scripts/check-silent-skips.sh).
          # Each flag names what this job provides: Squid, mitmproxy and Node 24 above, `ssh`, `git` and `python3`
          # from the runner image, AF_VSOCK from its kernel, and a non-root user.
          PUDDLE_REQUIRE_SQUID: "1"
          PUDDLE_REQUIRE_MITMPROXY: "1"
          PUDDLE_REQUIRE_NODE: "1"
          PUDDLE_REQUIRE_SSH_CLIENTS: "1"
          PUDDLE_REQUIRE_TOOLS: "1"
          PUDDLE_REQUIRE_VSOCK: "1"
          PUDDLE_REQUIRE_NON_ROOT: "1"
        run: |
          scripts/check.sh coverage
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-test-results
          path: |
            target/nextest/ci/junit.xml
            target/lcov.info
            target/coverage-summary.json
          retention-days: 14
          if-no-files-found: ignore
      # Off the light mode (worked out again from the event, not from `scope`) both gates must have run.
      - name: the gates the light mode skips ran
        if: ${{ !cancelled() }}
        env:
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh full-steps git-env=${{ steps.git-env.outcome }} notices=${{ steps.notices.outcome }}
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # The msvc cross-check, in its own job: its 12 to 14 minute CRT download on a cargo-xwin cache miss runs next to the
  # Rust job instead of inside its 30 minutes. No Rust cache of its own (the 10 GB cap has no room), so it builds
  # the check target cold every time. Only a push to develop saves the cargo-xwin entry: a pull request or a queue
  # run that saved it stored a copy no other ref can read, and the next run missed again (31 of 86 runs missed).
  msvc:
    name: clippy (windows-msvc, cross-checked)
    needs: [scope, queue-tested]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.scope.outputs.ci_rust != 'false' && needs.queue-tested.outputs.skip != 'true' }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-xwin@0.23.1
      - name: llvm-rc for the msvc cross-check (tauri-winres compiles the shell's Windows resources)
        run: |
          rc=$(ls /usr/lib/llvm-*/bin/llvm-rc 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$rc" ]; then sudo apt-get install -y --no-install-recommends llvm; rc=$(ls /usr/lib/llvm-*/bin/llvm-rc | sort -V | tail -n 1); fi
          mkdir -p "$HOME/llvm-rc-bin" && ln -sf "$rc" "$HOME/llvm-rc-bin/llvm-rc"
          echo "$HOME/llvm-rc-bin" >> "$GITHUB_PATH"
      - name: clang for the msvc cross-check (preinstalled on the runner)
        run: clang --version
      # A miss costs a 12 to 14 minute MSVC CRT download; cache-gc.yml never deletes this entry. It is saved by the
      # step after the cross-check, not by a post step, so a later red or cancelled step cannot lose it. The
      # restore key finds the entry of an older cargo-xwin version when the version in the key was bumped, so a bump
      # costs one develop run a refresh, not every pull request a download (queue-tested above looks up the exact key only).
      - name: Cache the MSVC CRT and Windows SDK that cargo-xwin downloads
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
          restore-keys: cargo-xwin-
      - name: clippy (windows-msvc, cross-checked)
        if: ${{ !cancelled() }}
        run: scripts/check.sh clippy-windows
      # cargo-xwin writes `xwin/DONE` when the download is complete; a download that failed halfway is never saved.
      - name: Is the cargo-xwin download complete?
        id: xwin-done
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.xwin.outputs.cache-hit != 'true' }}
        run: |
          if [ -f "$HOME/.cache/cargo-xwin/xwin/DONE" ]; then echo "complete=true" >> "$GITHUB_OUTPUT"; else echo "cargo-xwin download incomplete, not saving"; fi
      - name: Save the MSVC CRT and Windows SDK
        if: ${{ steps.xwin-done.outputs.complete == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-xwin
          key: cargo-xwin-0.23.1-x86_64
      # What the next measurement reads from the job summary instead of scraping logs.
      - name: cargo-xwin cache outcome (job summary)
        if: ${{ always() }}
        env:
          XWIN_HIT: ${{ steps.xwin.outputs.cache-hit }}
          XWIN_MATCHED: ${{ steps.xwin.outputs.cache-matched-key }}
          XWIN_DONE: ${{ steps.xwin-done.outputs.complete }}
          XWIN_REF: ${{ github.ref }}
        run: |
          if [ "$XWIN_HIT" = true ]; then restore="hit (exact)"
          elif [ -n "$XWIN_MATCHED" ]; then restore="prefix hit ($XWIN_MATCHED)"
          else restore="miss"; fi
          if [ "$XWIN_DONE" = true ]; then saved="saved"
          elif [ "$XWIN_REF" != refs/heads/develop ]; then saved="not saved (only develop saves)"
          elif [ "$XWIN_HIT" = true ]; then saved="not needed (exact hit)"
          else saved="not saved (download incomplete or step skipped)"; fi
          echo "- cargo-xwin cache: $restore; $saved" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # The gates a change without Rust, fixtures or gate data can still break. It runs instead of `rust`
  # when ci/scope.sh says no Rust gate is needed (a docs-only or UI-only pull request).
  light:
    name: linux (repository gates, light)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.ci_rust == 'false' }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets gate scans the pull request's commits
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: typos@1.50.3,shellcheck@0.11.0
      - name: typos
        if: ${{ !cancelled() }}
        run: scripts/check.sh typos
      - name: spdx headers
        if: ${{ !cancelled() }}
        run: scripts/check.sh spdx
      - name: shellcheck
        if: ${{ !cancelled() }}
        run: scripts/check.sh shellcheck
      - name: standalone (no planning-note references)
        if: ${{ !cancelled() }}
        run: scripts/check.sh standalone
      - name: quality (every unsafe, suppression and TODO says why)
        if: ${{ !cancelled() }}
        run: scripts/check.sh quality
      - name: gitleaks download cache (the script still checks the pin)
        if: ${{ !cancelled() }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/gitleaks-cache
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/gitleaks.sha256') }}
      - name: secret scanning (gitleaks, pinned and checksummed in ci/gitleaks.sha256)
        if: ${{ !cancelled() }}
        run: |
          GITLEAKS_CACHE_DIR="$HOME/gitleaks-cache" ci/fetch-gitleaks.sh "$HOME/gitleaks-bin"
          PATH="$HOME/gitleaks-bin:$PATH" scripts/check.sh secrets
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  ui:
    name: linux (UI gates)
    needs: [scope, queue-tested]
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.scope.outputs.ui != 'false' && needs.queue-tested.outputs.skip != 'true' }}
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The light pull request mode runs the end-to-end tests on Chromium only (ui/playwright.config.ts);
      # so does a merge queue run with PUDDLE_TIER=on whose diff touches nothing WebKit sees differently
      # (webkit.yml runs WebKit nightly). Every other run, a pull request to main included, runs both
      # browsers. Empty means every browser.
      PUDDLE_E2E_PROJECTS: ${{ (needs.scope.outputs.light == 'true' || needs.scope.outputs.defer_linux_webkit == 'true') && 'chromium' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff-coverage gate needs the base commit
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      # No Rust cache here. The end-to-end tests build the API fixture server, and the Rust job's 5 GiB entry
      # (restore 84 to 415 s of a 13 to 18 minute job, a third of it the coverage build this job never reads) cost
      # more than building the fixture cold adds to the end-to-end step: paired runs of this job with the
      # restore and without it took 1130 and 790 s.
      - name: Node for the UI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Restored everywhere, saved only by develop (a branch's own entry is never read by another).
      - name: Playwright browsers cache
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: Playwright browsers (Chromium and WebKit, or Chromium alone when narrowed above; their system libraries every time)
        timeout-minutes: 10
        run: |
          ci/apt-setup.sh
          cd ui
          npm ci --ignore-scripts --no-audit --no-fund
          browsers="${PUDDLE_E2E_PROJECTS:-chromium webkit}"
          # shellcheck disable=SC2086 # one word per browser
          ../ci/apt-retry.sh npx playwright install-deps $browsers
          if [ "${{ steps.browsers.outputs.cache-hit }}" != true ]; then
            # shellcheck disable=SC2086 # one word per browser
            npx playwright install $browsers
          fi
      - name: Save the Playwright browsers
        if: ${{ github.ref == 'refs/heads/develop' && steps.browsers.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      - name: UI (format, lint, types, unit and component tests with coverage, build)
        run: scripts/check.sh ui
      - name: UI licences (npm packages in the bundle)
        if: ${{ !cancelled() }}
        run: scripts/check.sh ui-licences
      - name: UI end-to-end (Playwright, Chromium and WebKit unless narrowed above, axe)
        id: ui-e2e
        if: ${{ !cancelled() }}
        run: scripts/check.sh ui-e2e
      - name: upload UI test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-ui-test-results
          path: |
            ui/playwright-report
            ui/test-results
            ui/coverage/lcov.info
          retention-days: 14
          if-no-files-found: ignore
      # Off the light mode (worked out again from the event) both browsers must have run.
      - name: the end-to-end tests ran on every browser
        if: ${{ !cancelled() }}
        env:
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_TIER: ${{ vars.PUDDLE_TIER }}
          DEFER_LINUX_WEBKIT: ${{ needs.scope.outputs.defer_linux_webkit }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh full-steps ui-e2e=${{ steps.ui-e2e.outcome }}
      - name: Cancel the rest of the merge group
        if: ${{ failure() && github.event_name == 'merge_group' }}
        continue-on-error: true
        uses: ./.github/actions/cancel-group

  # RustSec advisories (`scripts/check.sh advisories`). The result job needs it, but it skips on a pull
  # request to develop and on a merge queue run by its own event rule (not a scope verdict; the result job
  # accepts a skip of a job it does not scope), so a new advisory fails no pull request to develop. It runs where the answer matters: a release path (pull request
  # to main, where it fails `linux (all gates)`), every push to develop and main, the nightly (which the result job
  # skips) and by hand. The nightly also opens, rewrites or closes the tracking issue (ci/advisories-issue.sh).
  advisories:
    name: advisories (RustSec)
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - name: cargo-deny advisories
        run: scripts/check.sh advisories
      - name: tracking issue (nightly only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/advisories-issue.sh rust

  # npm advisories (`scripts/check.sh ui-audit`), the same shape as `advisories` above: skipped on a pull
  # request to develop and a merge queue run, run on a pull request to main (where it fails `linux (all
  # gates)`), every push, the nightly and by hand.
  # Its own job, so it is not tied to the UI job's scope verdict: a UI-free pull request to main still gets it.
  advisories-npm:
    name: advisories (npm)
    if: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.base.ref == 'main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node for the UI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm audit (production dependencies)
        run: scripts/check.sh ui-audit
      - name: tracking issue (nightly only)
        if: ${{ !cancelled() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd ui && npm ci --ignore-scripts --no-audit --no-fund)
          ci/advisories-issue.sh npm

  # One stable result for the jobs above.
  # The develop ruleset requires it by this name: a rename changes the ruleset in the same change.
  # On a pull request or a merge queue run a job may be skipped only when `scope` said it was not needed
  # (ci/scope.sh verdict); a failed `scope` job leaves its outputs empty, which runs everything. On a
  # develop push the Rust, msvc and UI jobs may also skip when `queue-tested` said so (`pushskip`).
  linux:
    name: linux (all gates)
    needs: [scope, queue-tested, rust, msvc, light, ui, advisories, advisories-npm]
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - name: every needed job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          PUDDLE_QUEUE: ${{ vars.PUDDLE_QUEUE }}
          PUDDLE_QUEUE_SKIP_PUSH: ${{ vars.PUDDLE_QUEUE_SKIP_PUSH }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: ci/scope.sh verdict rust=ci_rust,pushskip msvc=ci_rust,pushskip light='!ci_rust' ui=ui,pushskip
