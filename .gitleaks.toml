# SPDX-License-Identifier: AGPL-3.0-or-later
# gitleaks configuration for scripts/check.sh secrets (docs/STANDARDS.md, "Secret scanning").
# The default rules stay on; the allowlist below is the reviewed list of fake test values in
# this repository's history. An entry matches only when BOTH the file path and the exact matched
# value fit, so a real secret in the same file still fails. Add an entry only for a value that
# is made up on purpose, and say why. (A fixture that merely looks credential-shaped but isn't
# flagged needs no entry.)
title = "puddle"

[extend]
useDefault = true

# The gate's own self-test (scripts/check-secrets.sh) writes these same values into throwaway
# repositories, so the script lists them too.
#
# Canary strings: test values that are recognisable on purpose, so a test can assert they never
# reach a log, a response or the guest (CANARY-<word>, in integration tests only).
[[allowlists]]
description = "CANARY-* test values in crate integration tests"
condition = "AND"
paths = ['''^crates/[^/]+/tests/.+\.rs$''', '''^scripts/check-secrets\.sh$''']
regexTarget = "match"
regexes = ['''(?i)(password|token|secret)\W{0,4}CANARY-[A-Za-z0-9-]+''']

# The Docker CLI config fixture in a VM test (an older revision of the line is in history):
# "dXNlcjpwdWRkbGU=" is base64 of the made-up login "user:puddle".
[[allowlists]]
description = "base64 of the fake login user:puddle in the Docker config fixture"
condition = "AND"
paths = ['''^crates/puddle-boot/tests/vm_boot\.rs$''', '''^scripts/check-secrets\.sh$''']
regexTarget = "match"
regexes = ['''auth\W{1,4}dXNlcjpwdWRkbGU=''']

# History only: the made-up GitHub token the log canary test once held as a literal. The tests now
# build such tokens at run time (puddle-test-kit), so no tree has the literal, but the full scan
# (CI, every ref) still reads the old commits. Drop the entry if that history is ever rewritten.
[[allowlists]]
description = "the made-up GitHub token of the log canary test"
condition = "AND"
paths = ['''^crates/puddle-proxy/tests/terminate_suite/log_canary\.rs$''']
regexTarget = "match"
regexes = ['''ghp_R7mQ2xVb9TnLk4Zs8WdYc1HfJe6UoPa3GiXt''']

# History only: the made-up GitLab token the foreign credential classifier tests once held as a
# literal (see the entry above for why it stays).
[[allowlists]]
description = "the made-up GitLab token of the foreign credential classifier tests"
condition = "AND"
paths = ['''^crates/puddle-proxy/src/terminate/foreign\.rs$''']
regexTarget = "match"
regexes = ['''glpat-AbCdEfGhIjKlMnOpQrSt''']

# History only: the made-up pasted tokens the per-user isolation tests once held as literals (they
# are made at run time now; see the log canary entry for why it stays).
[[allowlists]]
description = "the made-up pasted tokens of the per-user isolation tests"
condition = "AND"
paths = ['''^crates/puddle-api/src/authz/tests\.rs$''']
regexTarget = "match"
regexes = ['''token\W{1,4}ghp_(owners|anns)0123456789''']
