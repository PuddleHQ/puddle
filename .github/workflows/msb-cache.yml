# SPDX-License-Identifier: GPL-3.0-or-later
# Keeps the Linux msb binary cache (`msb-linux-<hash>`) saved under develop, the one scope every
# pull request restores from. A pull request that misses builds msb from source (about 10 minutes)
# and saves the result under its own ref, which no other pull request can read, so without a
# develop entry every pull request builds it again. Until now only the nightly vm-linux run saved
# one: after a change to the pins, ci/fetch-msb.sh or the toolchain, each pull request paid the
# build until the next nightly run.
#
# Every develop push looks the key up (no download, a few seconds); on a miss it builds msb and
# saves it. The key and the cached path must match vm-linux.yml's "msb build cache" steps exactly
# (the cache version includes the path string), so a change to either goes in both files.
name: msb-cache

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

# Two pushes in a row: the second waits for the first, then finds its entry and stops.
concurrency:
  group: msb-cache
  cancel-in-progress: false

jobs:
  seed:
    name: msb cache (restore check, build on a miss)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: msb build cache (lookup only)
        id: msb-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msb-build/msb-*
          key: msb-linux-${{ hashFiles('ci/msb-runtime.sha256', 'ci/fetch-msb.sh', 'rust-toolchain.toml') }}
          lookup-only: true
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.msb-cache.outputs.cache-hit != 'true'
        run: rustup toolchain install && rustc --version
      - name: msb runtime (fork tag; build from source)
        if: steps.msb-cache.outputs.cache-hit != 'true'
        run: |
          ci/apt-setup.sh
          sudo apt-get update -q && sudo apt-get install -y -q libcap-ng-dev
          MSB_BUILD_DIR="$RUNNER_TEMP/msb-build" ci/fetch-msb.sh "$RUNNER_TEMP/msb"
      - name: msb build cache (save)
        if: steps.msb-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/msb-build/msb-*
          key: ${{ steps.msb-cache.outputs.cache-primary-key }}
      - name: summary
        run: |
          if [ "${{ steps.msb-cache.outputs.cache-hit }}" = "true" ]; then
            echo "msb cache present: ${{ steps.msb-cache.outputs.cache-primary-key }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "msb cache was missing and is now saved: ${{ steps.msb-cache.outputs.cache-primary-key }}" >> "$GITHUB_STEP_SUMMARY"
          fi
