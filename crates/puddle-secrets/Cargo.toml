# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "puddle-secrets"
description = "where Puddle gets a secret on the host: signed-in gh, Git Credential Manager, a pasted token in the OS store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = { workspace = true }
getrandom = { workspace = true }
keyring-core = { workspace = true }
puddle-fs = { workspace = true }
puddle-process = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { workspace = true }

[dev-dependencies]
puddle-test-kit = { workspace = true }
# The stand-in GitHub host of the real-tools contract (tests/integration/real_tools).
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-rustls = { workspace = true }
tracing-subscriber = { workspace = true }

# A stand-in for `gh` and `git` that the tests copy next to a behaviour file. A binary, so the
# same tests run on Windows, where a shell script is not an executable.
[[bin]]
name = "puddle-fake-tool"
path = "tests/support/fake_tool.rs"
test = false

[lints]
workspace = true
