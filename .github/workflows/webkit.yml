# SPDX-License-Identifier: GPL-3.0-or-later
# The WebKit half of the Linux UI end-to-end tests, nightly and by hand: the half a merge queue run skips
# with PUDDLE_TIER=on (ci/scope.sh). A pull request to main runs both browsers in ci.yml. WebKit stands in
# for WebKitGTK and, later, WKWebView.
# It is no required check. A red run opens the "Nightly red: webkit" issue (nightly-signal.yml) and
# `ci/bisect-red.sh webkit.yml` names the commit. The nightly skips when this workflow already has a green
# run on the commit, so a quiet day costs nothing.
name: webkit

on:
  schedule:
    - cron: "53 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Line tables only, as in ci.yml: backtraces keep file:line while the fixture server stays small.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  e2e:
    name: linux UI (WebKit end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # `actions: read` for ci/should-run.sh.
    permissions:
      contents: read
      actions: read
    env:
      PUDDLE_E2E_PROJECTS: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: anything new since the last green run?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/should-run.sh webkit.yml
      - name: Toolchain (from rust-toolchain.toml)
        if: steps.changed.outputs.run == 'true'
        run: rustup toolchain install && rustc --version
      - name: Node for the UI
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Restored, never saved: ci.yml's entry (same key) holds both browsers and only a develop push saves it.
      - name: Playwright browsers cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/package-lock.json') }}
      # `playwright install` does nothing for a browser the restored entry already holds.
      - name: WebKit and its system libraries
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 10
        run: |
          ci/apt-setup.sh
          cd ui
          npm ci --ignore-scripts --no-audit --no-fund
          ../ci/apt-retry.sh npx playwright install-deps webkit
          npx playwright install webkit
      - name: UI end-to-end (Playwright, WebKit, axe)
        if: steps.changed.outputs.run == 'true'
        run: scripts/check.sh ui-e2e
      - name: upload UI test results
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webkit-ui-test-results
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 14
          if-no-files-found: ignore
